  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);

  head.split('\n').slice(0,5).forEach(function(l){Object.keys(cnt).forEach(function(d){cnt[d]+=l.split(d).length-1;});});
  var dl=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];})[0]||';';

async function fbMsg(r){
  var t='';
  try{var j=await r.clone().json();t=(j&&(j.error||j.message))||'';}catch(e){}
  if(!t){try{t=String(await r.text()).slice(0,140);}catch(e){}}
  return r.status+(t?' — '+t:'');
}
async function initFirebase(){
  if(location.protocol==='file:')return false;                  // fichier ouvert en local
  if(window._fbToken){FBTOKEN=window._fbToken;return true;}      // jeton déjà posé par la Toolbox
  if(typeof firebase==='undefined'||!firebase.auth)return false;
  if(!firebase.apps.length)firebase.initializeApp(FBCFG);
  var u=await new Promise(function(res){
    var fini=false;
    firebase.auth().onAuthStateChanged(function(user){if(!fini){fini=true;res(user||null);}});
    setTimeout(function(){if(!fini){fini=true;res(null);}},4000);
  });
  if(!u)return false;
  FBUSER=u;FBTOKEN=await u.getIdToken();window._fbToken=FBTOKEN;
  return true;
}
function clean(o){return JSON.parse(JSON.stringify(o===undefined?null:o));}
async function rtGet(p){
  var r=await dbFetch('/'+fbRoot()+'/'+p+'.json');
  if(!r.ok)throw new Error('lecture refusée sur /'+fbRoot()+'/'+p+' ('+(await fbMsg(r))+')');
  return await r.json();
}
async function rtSet(p,v){
  var r=await dbFetch('/'+fbRoot()+'/'+p+'.json',{method:'PUT',body:JSON.stringify(clean(v))});
  if(!r.ok)throw new Error('écriture refusée sur /'+fbRoot()+'/'+p+' ('+(await fbMsg(r))+')');
}
async function rtDel(p){
  await dbFetch('/'+fbRoot()+'/'+p+'.json',{method:'DELETE'});
}
async function rtSetAbs(p,v){    // écrit ailleurs dans la base : la section d'un outil sur une fiche globale
  var r=await dbFetch('/'+p+'.json',{method:'PUT',body:JSON.stringify(clean(v))});
  if(!r.ok)throw new Error('écriture refusée sur /'+p+' ('+(await fbMsg(r))+')');
}
/* --- roster de la Toolbox : /roster.json --- */
var SW_RENAME={'LEANDRE':'LEANDRE PICK','YANNICK SERI':'LE SERI','BRO':'BRÖ'};
async function chargerRoster(){
  var r=await dbFetch('/roster.json');
  if(!r.ok)throw new Error('roster illisible ('+r.status+')');
  var data=await r.json();
  if(!data)return [];
  return Object.keys(data).map(function(k){var a=data[k]||{};a.id=a.id||k;a._key=k;return a;})
    .filter(function(a){
      var tp=a.types?(Array.isArray(a.types)?a.types:[a.types]):[];
      return tp.indexOf('Auteur')>=0||tp.indexOf('Compositeur')>=0||tp.indexOf('Topliner')>=0;})
    .sort(function(a,b){return (a.name||'').localeCompare(b.name||'','fr');});
}
var ROSTER=[],PLANNING=[],nbPlanning=0;
async function chargerPlanning(){
  var r=await dbFetch('/releases.json');
  if(!r.ok)return [];
  var d=await r.json();
  if(!d)return [];
  return Object.keys(d).map(function(k){return d[k];}).map(function(x){
    var sw=x.songwriters?(Array.isArray(x.songwriters)?x.songwriters:[x.songwriters]):[];
    x._sw=sw.map(function(n){return norm(SW_RENAME[n]||n);});
    return x;});
}
function sortiesDe(sw){
  if(!PLANNING.length)return [];
  var noms=[norm(sw.nom)].concat((sw.alias||[]).map(norm));
  return PLANNING.filter(function(r){
    return r._sw.some(function(n){return noms.indexOf(n)>=0;});})
    .sort(function(a,b){return (b.dateSortable||'').localeCompare(a.dateSortable||'');});
}
function sortiePourOeuvre(titre){
  if(!PLANNING.length||!titre)return null;
  var t=norm(titre);
  return PLANNING.filter(function(r){
    return norm(r.track||r.title||'')===t;})
    .sort(function(a,b){return (a.dateSortable||'').localeCompare(b.dateSortable||'');})[0]||null;
}
// Le roster de la Toolbox fait foi sur l'identité ; l'outil n'y ajoute que l'édition
// (part cédée, COAD, IPI, ayants droit rattachés), conservée sous editions/songwriters/r:<id>.
var CHAMPS_EDITION=['part','coad','ipis','ads','alias','type','note','societe'];
function fusionRoster(){
  ROSTER.forEach(function(a){
    var id='r:'+a.id, ov=a.edition||store.overlays[id]||{};
    var alias=(ov.alias||[]).slice();
    Object.keys(SW_RENAME).forEach(function(o2){
      if(norm(SW_RENAME[o2])===norm(a.name)&&alias.indexOf(o2)<0)alias.push(o2);
      if(norm(o2)===norm(a.name)&&alias.indexOf(SW_RENAME[o2])<0)alias.push(SW_RENAME[o2]);});
    store.songwriters[id]={id:id,nom:a.name||'',rosterId:a.id,rosterKey:a._key||a.id,
      roles:a.types||[],source:'roster',
      societe:ov.societe||'',part:ov.part==null?50:ov.part,coad:ov.coad||'',
      ipis:ov.ipis||[],ads:ov.ads||[],alias:alias,type:ov.type||'roster',note:ov.note||''};
  });
}
// Certains songwriters n'ont pas de fiche artiste au Roster : ils n'apparaissent que sur
// les sorties et les posts du Planning. On leur fabrique un profil à partir de ces noms.
function fusionPlanning(){
  var vus={},n=0;
  Object.keys(store.songwriters).forEach(function(k){
    var x=store.songwriters[k];if(!x)return;
    vus[norm(x.nom)]=1;(x.alias||[]).forEach(function(a){vus[norm(a)]=1;});});
  PLANNING.forEach(function(r){
    var bruts=r.songwriters?(Array.isArray(r.songwriters)?r.songwriters:String(r.songwriters).split(',')):[];
    bruts.forEach(function(b){
      var nom=String(b==null?'':b).trim();
      nom=String(SW_RENAME[nom]||nom).trim();
      var cle=norm(nom);
      if(!cle||vus[cle])return;
      var id='p:'+cle,ov=store.overlays[id]||{};
      store.songwriters[id]={id:id,nom:ov.nom||nom,source:'planning',roles:['Songwriter'],
        societe:ov.societe||'',part:ov.part==null?50:ov.part,coad:ov.coad||'',
        ipis:ov.ipis||[],ads:ov.ads||[],alias:ov.alias||[],
        type:ov.type||'roster',note:ov.note||''};
      vus[cle]=1;n++;});});
  return n;
}
function fichesDepuisRoster(soc,liste){
  var cree=0,maj=0;
  liste.forEach(function(a){
    var nom=(a.name||'').trim();if(!nom)return;
    var ex=null,ids=Object.keys(store.songwriters);
    for(var i=0;i<ids.length;i++){var sw=store.songwriters[ids[i]];
      if(sw.rosterId&&a.id&&String(sw.rosterId)===String(a.id)){ex=sw;break;}
      if(norm(sw.nom)===norm(nom)){ex=sw;break;}}
    var alias=[];
    Object.keys(SW_RENAME).forEach(function(o2){
      if(norm(SW_RENAME[o2])===norm(nom))alias.push(o2);
      if(norm(o2)===norm(nom))alias.push(SW_RENAME[o2]);});
    var tp=a.types?(Array.isArray(a.types)?a.types:[a.types]):[];
    if(ex){
      ex.rosterId=ex.rosterId||a.id;ex.roles=tp;
      alias.forEach(function(x){if((ex.alias||[]).indexOf(x)<0)ex.alias=(ex.alias||[]).concat([x]);});
      maj++;
    }else{
      var n={id:uid('sw'),nom:nom,coad:'',ipis:[],ads:[],societe:soc,part:50,type:'roster',
        alias:alias,note:'',source:'roster',rosterId:a.id,roles:tp};
      store.songwriters[n.id]=n;cree++;
    }
  });
  return {cree:cree,maj:maj,total:liste.length};
}

/* ---------------- base locale au navigateur ---------------- */
function localSave(){
  if(MODE!=='local')return;
  try{
    localStorage.setItem(LSKEY,JSON.stringify({v:1,maj:new Date().toISOString(),
      meta:store.meta,oeuvres:store.oeuvres,edits:store.edits,liens:store.liens,
      overlays:store.overlays,songwriters:store.songwriters,imports:store.imports.slice(0,80)}));
  }catch(e){ toast('Sauvegarde locale impossible (espace du navigateur saturé) — exportez la base'); }
}
function localLoad(){
  try{
    var raw=localStorage.getItem(LSKEY);if(!raw)return false;
    adopte(JSON.parse(raw));return true;
  }catch(e){return false;}
}
function adopte(d){
  store.meta=d.meta||{};store.oeuvres=d.oeuvres||{};store.edits=d.edits||{};
  store.songwriters=d.songwriters||{};store.imports=d.imports||[];store.liens=d.liens||{};
  store.overlays=d.overlays||{};
  SOCIETES.forEach(function(s2){store.oeuvres[s2.id]=store.oeuvres[s2.id]||{};
    store.edits[s2.id]=store.edits[s2.id]||{};store.liens[s2.id]=store.liens[s2.id]||{};});
}
function exportBase(){
  var data={format:'toolbox-blzante/catalogues',version:1,exporte:new Date().toISOString(),
    meta:store.meta,oeuvres:store.oeuvres,edits:store.edits,liens:store.liens,
    overlays:store.overlays,songwriters:store.songwriters,imports:store.imports};
  var txt=JSON.stringify(data),nom='blzante-catalogues-'+today()+'.json';
  try{
    var url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download=nom;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    toast('Base exportée : '+nom);
  }catch(e){
    openModal('<div class="eyebrow">Export</div><h2>Base au format JSON</h2>',
      '<div class="hint">Le téléchargement direct est bloqué ici. Copiez ce contenu dans un fichier <b>'+nom+'</b>.</div>'+
      '<textarea id="x-json" style="min-height:280px;font-family:var(--mono);font-size:11px"></textarea>',
      '<button class="btn primary" id="x-ok">Fermer</button>');
    el('x-json').value=txt;el('x-json').select();el('x-ok').onclick=closeModal;
  }
}
function importBase(file){
  var fr=new FileReader();
  fr.onload=async function(){
    try{
      var d=JSON.parse(String(fr.result));
      if(!d||!d.oeuvres)throw new Error('format inattendu');
      if(!confirm('Remplacer le contenu actuel par la base « '+file.name+' » ?'))return;
      adopte(d);
      if(MODE==='local')localSave();
      else{for(var i=0;i<SOCIETES.length;i++)await saveOeuvres(SOCIETES[i].id);
        await saveMeta();
        var ids=Object.keys(store.songwriters);
        for(var j=0;j<ids.length;j++)await saveSW(store.songwriters[ids[j]]);}
      render();toast('Base restaurée');
    }catch(e){toast('Restauration impossible : '+(e.message||e));}
  };
  fr.readAsText(file,'utf-8');
}

/* ---------------- lecture et écriture, selon le mode ---------------- */
async function loadAll(){
  if(MODE==='local')return void localLoad();
  if(MODE==='firebase'){
    var st=await rtGet('meta/state');
    if(st){store.meta=st.societes||{};store.liens=st.liens||{};}
    var sw=await rtGet('songwriters')||{};
    store.songwriters={};store.overlays={};
    Object.keys(sw).forEach(function(k){
      var x=sw[k]||{};x.id=k;
      if(k.indexOf('r:')===0||k.indexOf('p:')===0)store.overlays[k]=x;  // greffe Roster ou Planning
      else store.songwriters[k]=x;});                   // fiche propre à l'outil (externe, non signé)
    try{ROSTER=await chargerRoster();fusionRoster();}
    catch(e){console.warn('roster illisible',e);}
    try{PLANNING=await chargerPlanning();nbPlanning=fusionPlanning();}catch(e){console.warn('planning illisible',e);}
    var im=await rtGet('imports')||{};
    store.imports=Object.keys(im).map(function(k){var x=im[k];x.id=k;return x;})
      .sort(function(a,b){return (b.date||'').localeCompare(a.date||'');}).slice(0,60);
    for(var i=0;i<SOCIETES.length;i++){
      var soc=SOCIETES[i].id;store.oeuvres[soc]={};store.edits[soc]={};store.liens[soc]=store.liens[soc]||{};
      var blocs=await rtGet('bulk/'+soc)||{};
      Object.keys(blocs).forEach(function(b){var it=(blocs[b]||{}).items||{};
        Object.keys(it).forEach(function(c){store.oeuvres[soc][c]=it[c];});});
      var eds=await rtGet('edits/'+soc)||{};
      Object.keys(eds).forEach(function(b){var it=(eds[b]||{}).items||{};
        Object.keys(it).forEach(function(c){store.edits[soc][c]=it[c];});});
    }
    return;
  }
  // artefact Claude
  if(!DB)return;
  var r=await Promise.all([DB.doc('meta/state').get(),
    DB.collection('songwriters').limit(900).get(),
    DB.collection('imports').orderBy('date','desc').limit(60).get()]);
  if(r[0].exists){store.meta=r[0].data().societes||{};store.liens=r[0].data().liens||{};}
  store.songwriters={};
  r[1].docs.forEach(function(d){var x=d.data();x.id=d.id;store.songwriters[d.id]=x;});
  store.imports=r[2].docs.map(function(d){var x=d.data();x.id=d.id;return x;});
  for(var s2=0;s2<SOCIETES.length;s2++){
    var so=SOCIETES[s2].id;store.oeuvres[so]={};store.edits[so]={};store.liens[so]=store.liens[so]||{};
    var nb=(store.meta[so]||{}).chunks||0;
    for(var k=0;k<nb;k++){
      var d2=await DB.doc(bulkPath(so,k)).get();
      if(d2.exists){var it2=d2.data().items||{};Object.keys(it2).forEach(function(c){store.oeuvres[so][c]=it2[c];});}
    }
    var ed=await DB.collection('edits').where('societe','==',so).limit(100).get();
    ed.docs.forEach(function(d3){var it3=d3.data().items||{};
      Object.keys(it3).forEach(function(c){store.edits[so][c]=it3[c];});});
  }
}
async function saveOeuvres(soc){
  var codes=Object.keys(store.oeuvres[soc]||{});
  var n=Math.max(1,Math.ceil(codes.length/CHUNK));
  var bloc=function(i){var items={};
    codes.slice(i*CHUNK,(i+1)*CHUNK).forEach(function(c){items[c]=store.oeuvres[soc][c];});
    return {societe:soc,items:items,maj:new Date().toISOString()};};
  if(MODE==='local'){
    store.meta[soc]=Object.assign({},store.meta[soc],{oeuvres:codes.length,chunks:n});localSave();return;}
  if(MODE==='firebase'){
    for(var i=0;i<n;i++)await rtSet('bulk/'+soc+'/b'+i,bloc(i));   // bloc par bloc : charges légères
    var vieux=(store.meta[soc]||{}).chunks||0;
    for(var k3=n;k3<vieux;k3++){try{await rtDel('bulk/'+soc+'/b'+k3);}catch(e){}}
    store.meta[soc]=Object.assign({},store.meta[soc],{chunks:n,oeuvres:codes.length});
    await saveMeta();return;}
  if(!DB)return;
  for(var j=0;j<n;j++)await DB.doc(bulkPath(soc,j)).set(bloc(j));
  var old=(store.meta[soc]||{}).chunks||0;
  for(var k2=n;k2<old;k2++){try{await DB.doc(bulkPath(soc,k2)).delete();}catch(e){}}
  store.meta[soc]=Object.assign({},store.meta[soc],{chunks:n,oeuvres:codes.length});
  await saveMeta();
}
async function saveEdit(soc,code){
  if(MODE==='local'){localSave();return;}
  var b=bucketOf(code),items={};
  Object.keys(store.edits[soc]||{}).forEach(function(c){if(bucketOf(c)===b)items[c]=store.edits[soc][c];});
  var body={societe:soc,items:items,maj:new Date().toISOString()};
  if(MODE==='firebase')return rtSet('edits/'+soc+'/e'+b,body);
  if(DB)return DB.doc('edits/'+soc+'-e'+b).set(body);
}
async function saveSW(sw){
  var corps=sw;
  if(sw.source==='roster'){
    // fiche globale : on n'écrit que la section « edition », l'identité reste au Roster
    corps={};CHAMPS_EDITION.forEach(function(c){corps[c]=sw[c];});
    corps.maj=new Date().toISOString();
    store.overlays[sw.id]=corps;
    var r=ROSTER.filter(function(a){return 'r:'+a.id===sw.id;})[0];
    if(r)r.edition=corps;
    if(MODE==='firebase')return rtSetAbs('roster/'+(sw.rosterKey||sw.rosterId)+'/edition',corps);
    if(MODE==='local')return void localSave();
    if(DB)return DB.doc('songwriters/'+sw.id).set(corps);
    return;
  }
  if(sw.source==='planning'){
    // profil déduit du Planning : on ne garde que la partie édition, sous son propre identifiant
    corps={};CHAMPS_EDITION.forEach(function(c){corps[c]=sw[c];});
    corps.nom=sw.nom;corps.source='planning';corps.maj=new Date().toISOString();
    store.overlays[sw.id]=corps;
  }
  if(MODE==='local')return void localSave();
  if(MODE==='firebase')return rtSet('songwriters/'+sw.id,corps);
  if(DB)return DB.doc('songwriters/'+sw.id).set(corps);
}
async function delSW(id){
  delete store.overlays[id];
  if(MODE==='local')return void localSave();
  if(MODE==='firebase')return rtDel('songwriters/'+id);
  if(DB)return DB.doc('songwriters/'+id).delete();
}
async function saveMeta(){
  var body={societes:store.meta,liens:store.liens,maj:new Date().toISOString()};
  if(MODE==='local')return void localSave();
  if(MODE==='firebase')return rtSet('meta/state',body);
  if(DB)return DB.doc('meta/state').set(body);
}
async function saveLiens(){return saveMeta();}
async function logImport(rec){
  rec.id=rec.id||uid('imp');store.imports.unshift(rec);
  if(MODE==='local')return void localSave();
  if(MODE==='firebase')return rtSet('imports/'+rec.id,rec);

/* ============================== dérivations ============================== */
function socNom(id){var s=SOCIETES.filter(function(x){return x.id===id;})[0];return s?s.nom:id;}
function socCoad(id){var m=store.meta[id]||{},s=SOCIETES.filter(function(x){return x.id===id;})[0];
  return m.coad||(s?s.coad:'');}
function swList(soc){
  return Object.keys(store.songwriters).map(function(k){return store.songwriters[k];})
    .filter(function(s){return !s.societe||s.societe===soc;})
    .sort(function(a,b){return (a.nom||'').localeCompare(b.nom||'','fr');});
}
function swIndex(soc){
  // index des correspondances sûres : COAD, IPI, ayants droit déjà rattachés, alias, nom
  var ix={};
  swList(soc).forEach(function(s){
    if(s.nom)ix['n:'+norm(s.nom)]=s.id;
    (s.alias||[]).forEach(function(a){ix['n:'+norm(a)]=s.id;});
    (s.ipis||[]).forEach(function(i){if(i)ix['i:'+String(i).trim()]=s.id;});
    (s.ads||[]).forEach(function(a){ix[adKey(a)]=s.id;if(a.nom)ix['n:'+norm(a.nom)]=s.id;
      if(a.ipi)ix['i:'+String(a.ipi).trim()]=s.id;});
    if(s.coad)ix[String(s.coad)]=s.id;   // le COAD de la fiche prime
  });
  // décisions validées manuellement
  var L=store.liens[soc]||{};
  Object.keys(L).forEach(function(k){if(L[k]&&L[k]!=='-')ix[k]=L[k];});
  return ix;
}
function adKey(a){return a&&a.coad?String(a.coad):'n:'+norm(a&&a.nom);}
function a2ad(a){return {cle:adKey(a),nom:a.nom,coad:a.coad||'',ipi:a.ipi||''};}
function big2(s){var o=[];for(var i=0;i<s.length-1;i++)o.push(s.slice(i,i+2));return o;}
function simil(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  var ga=big2(a),gb=big2(b),used={},inter=0;
  ga.forEach(function(g){for(var i=0;i<gb.length;i++){if(!used[i]&&gb[i]===g){used[i]=1;inter++;break;}}});
  return 2*inter/((ga.length+gb.length)||1);
}
// tous les ayants droit auteurs du catalogue, agrégés
function allAD(soc){
  var O=store.oeuvres[soc]||{},m={};
  Object.keys(O).forEach(function(c){
    var o=O[c],aut=auteurs(o),tot=aut.reduce(function(s,a){return s+a.dep;},0)||1;
    aut.forEach(function(a){
      var k=adKey(a);
      var x=m[k]||(m[k]={cle:k,nom:a.nom,coad:a.coad||'',ipi:a.ipi||'',oeuvres:0,net:0,dep:0});
      x.oeuvres++;x.dep+=a.dep;x.net+=(o.net||0)*a.dep/tot;
      if(!x.ipi&&a.ipi)x.ipi=a.ipi;
    });
  });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.net-a.net;});
}
// niveau de confiance du rapprochement d'un ayant droit
function swMatch(soc,ad){
  var L=store.liens[soc]||{};
  if(L[ad.cle]!==undefined)
    return L[ad.cle]==='-'?{id:null,niveau:'ignore'}:{id:L[ad.cle],niveau:'valide',raison:'validé'};
  var list=swList(soc),i,s2;
  for(i=0;i<list.length;i++){s2=list[i];
    if(s2.coad&&ad.coad&&String(s2.coad)===String(ad.coad))return {id:s2.id,niveau:'certain',raison:'COAD identique'};
    if((s2.ads||[]).some(function(x){return adKey(x)===ad.cle;}))return {id:s2.id,niveau:'certain',raison:'ayant droit déjà rattaché'};
    if(ad.ipi&&(s2.ipis||[]).some(function(x){return String(x).trim()===String(ad.ipi).trim();}))
      return {id:s2.id,niveau:'certain',raison:'IPI identique'};
  }
  var n=norm(ad.nom);
  for(i=0;i<list.length;i++){s2=list[i];
    if(norm(s2.nom)===n)return {id:s2.id,niveau:'probable',raison:'nom identique'};
    if((s2.alias||[]).some(function(a){return norm(a)===n;}))return {id:s2.id,niveau:'probable',raison:'pseudonyme connu'};
    if((s2.ads||[]).some(function(x){return norm(x.nom)===n;}))return {id:s2.id,niveau:'probable',raison:'nom d\'un ayant droit rattaché'};
  }
  var best=null;
  list.forEach(function(s3){
    var sc=simil(n,norm(s3.nom));
    (s3.ads||[]).forEach(function(x){sc=Math.max(sc,simil(n,norm(x.nom)));});
    (s3.alias||[]).forEach(function(x){sc=Math.max(sc,simil(n,norm(x)));});
    if(sc>=0.74&&(!best||sc>best.sc))best={id:s3.id,sc:sc};
  });
  if(best)return {id:best.id,niveau:'doute',raison:'nom proche ('+Math.round(best.sc*100)+' %)'};
  return {id:null,niveau:'aucun'};
}
// file d'attente : ce qui reste à trancher
function enAttente(soc){
  return allAD(soc).map(function(ad){var m=swMatch(soc,ad);ad.match=m;return ad;})
    .filter(function(ad){return ad.match.niveau==='probable'||ad.match.niveau==='doute'||ad.match.niveau==='aucun';});
}

function auteurs(o){
  var m={};
  (o.parts||[]).forEach(function(p){
    if(!ROLE_AUTEUR[p.r])return;
    var k=p.c||('n:'+norm(p.n));
    var a=m[k]||(m[k]={coad:p.c||'',nom:p.n,ipi:p.i||'',dep:0,dr:0,ph:0,roles:{}});
    a.dep+=p.dep||0;a.dr+=p.dr||0;a.ph+=p.ph||0;a.roles[p.r]=1;
  });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return (b.ph-a.ph)||(b.dep-a.dep);});
}
function editeurs(o){return (o.parts||[]).filter(function(p){return p.r==='E'||p.r==='SE'||p.r==='CE';});}

/* ---------- notes internes horodatées ---------- */
function notesDe(e){
  if(!e)return [];
  if(e.notes&&e.notes.length)return e.notes.slice();
  if(e.note&&String(e.note).trim())                       // ancienne note simple, sans date connue
    return [{t:String(e.note).trim(),d:e.noteDate||'',old:true}];
  return [];
}
function dateHeure(iso){
  if(!iso)return 'date inconnue';
  var d=new Date(iso);if(isNaN(d))return frDate(iso);
  return frDate(iso)+' à '+String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0');
}
/* ---------- pochette du titre commercialisé ---------- */
function ytId(u){var m=String(u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:'';}
function spUrl(u){
  var m=String(u||'').match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album)\/([A-Za-z0-9]+)/);
  return m?'https://open.spotify.com/'+m[1]+'/'+m[2]:'';}
function artKey(sp,yt){return (spUrl(sp)||'')+'|'+(ytId(yt)||'');}
function chercherPochette(sp,yt,cb){
  var s=spUrl(sp),y=ytId(yt);
  var secours=function(){cb(y?'https://img.youtube.com/vi/'+y+'/hqdefault.jpg':'');};
  if(!s)return secours();
  var to=setTimeout(secours,4000),fait=false;
  fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(s))
    .then(function(r){return r.json();})
    .then(function(j){if(fait)return;fait=true;clearTimeout(to);
      if(j&&j.thumbnail_url)cb(j.thumbnail_url);else secours();})
    .catch(function(){if(fait)return;fait=true;clearTimeout(to);secours();});
}

function attach(soc,code){
  var o=(store.oeuvres[soc]||{})[code]||{},e=(store.edits[soc]||{})[code];
  var aut=auteurs(o);
  if(e&&e.sw)return {list:e.sw.filter(function(x){return x.id&&store.songwriters[x.id];}),auto:false,aut:aut};
  var L=store.liens[soc]||{},out=[],seen={};
  aut.forEach(function(a){
    var k=adKey(a);
    if(L[k]==='-')return;
    var m=swMatch(soc,a2ad(a));
    if((m.niveau==='certain'||m.niveau==='valide')&&m.id&&!seen[m.id]){
      seen[m.id]=1;var sw=store.songwriters[m.id];
      out.push({id:m.id,part:(sw&&sw.part!=null)?sw.part:100});}
  });
  return {list:out,auto:true,aut:aut};
}
// La part de la société sur l'œuvre (droit d'exécution et phono) se répartit en points
// entre ses songwriters. Proposition = écriture × part cédée ; saisie manuelle prioritaire.
function autMatch(aut,sw,ads){
  return aut.filter(function(z){
    if(sw.coad&&z.coad&&String(z.coad)===String(sw.coad))return true;
    if(norm(z.nom)===norm(sw.nom))return true;
    if((sw.alias||[]).some(function(al){return norm(al)===norm(z.nom);}))return true;
    return (sw.ads||[]).some(function(x){return adKey(x)===adKey(z);});
  })[0];
}
// Le phono commande : les points de la société se répartissent sur sa part PHONO,
// DEP et DR suivent au prorata, et les revenus avec eux.
function socParts(o){
  return {dep:(o.soc&&o.soc.dep)||0,dr:(o.soc&&o.soc.dr)||0,ph:(o.soc&&o.soc.ph)||0};
}
function pilote(P){return P.ph>0?'ph':'dep';}   // phono en priorité
function alloc(soc,code){
  var o=(store.oeuvres[soc]||{})[code]||{},e=(store.edits[soc]||{})[code]||{};
  var a=attach(soc,code),aut=a.aut;
  var P=socParts(o),dr=pilote(P),tot=dr==='ph'?P.ph:P.dep;
  var base=a.list.map(function(x){
    var sw=store.songwriters[x.id]||{};
    var m=autMatch(aut,sw);
    var deal=x.part==null?(sw.part==null?100:sw.part):x.part;
    return {id:x.id,nom:sw.nom||'?',ecrDep:m?m.dep:0,ecrDr:m?m.dr:0,ecrPh:m?m.ph:0,deal:deal,
      w:(dr==='ph'?(m?m.ph:0):(m?m.dep:0))*deal/100,pt:0,net:0};
  });
  var s=base.reduce(function(s2,x){return s2+x.w;},0);
  base.forEach(function(x){x.pt=s>0?tot*x.w/s:0;});
  var manuel=false;
  if(e.alloc&&e.alloc.length){
    var m2={};e.alloc.forEach(function(y){m2[y.id]=y;});
    base.forEach(function(x){var y=m2[x.id];if(!y)return;
      x.pt=y.pt!=null?(+y.pt||0):(dr==='ph'?(+y.ptPh||0):(+y.ptDep||0));});   // bases anciennes
    manuel=true;
  }
  base.forEach(function(x){
    var r=tot>0?x.pt/tot:0;
    x.ratio=r;x.ptPh=P.ph*r;x.ptDep=P.dep*r;x.ptDr=P.dr*r;});
  return {list:base,pDep:P.dep,pDr:P.dr,pPh:P.ph,pilote:dr,total:tot,manuel:manuel};
}
function ventile(soc,code,o){
  var A=alloc(soc,code),net=o.net||0;
  var t=A.list.reduce(function(s2,x){return s2+x.pt;},0);
  A.list.forEach(function(x){x.net=t>0?net*x.pt/t:0;});
  if(t<=0&&A.list.length)A.list.forEach(function(x){x.net=net/A.list.length;});
  return {list:A.list,auto:attach(soc,code).auto,pDep:A.pDep,pDr:A.pDr,pPh:A.pPh,
    pilote:A.pilote,total:A.total,manuel:A.manuel,tPt:t};
}
function vsig(list){return list.map(function(x){
  return x.id+':'+Math.round((x.pt!=null?x.pt:x.ptPh||0)*100);}).sort().join('|');}
function ventStatut(soc,code,list){
  if(list.length<2)return 'na';
  var e=(store.edits[soc]||{})[code]||{};
  return e.vsig===vsig(list)?'valide':'attente';
}
function ventilationsEnAttente(soc){
  return rows(soc).filter(function(r){return r.vstat==='attente';})
    .sort(function(a,b){return b.net-a.net;});
}
function rows(soc){
  var O=store.oeuvres[soc]||{},E=store.edits[soc]||{};
  return Object.keys(O).map(function(code){
    var o=O[code],e=E[code]||{},v=ventile(soc,code,o);
    return {code:code,titre:o.titre||'(sans titre)',net:o.net||0,ans:o.ans||{},reps:o.reps||{},
      depot:o.depot||'',iswc:o.iswc||'',genre:o.genre||'',cat:!!o.cat,na:!!o.na,
      partSoc:(o.soc&&o.soc.dep)||0,partSocPh:(o.soc&&o.soc.ph)||0,partSocDr:(o.soc&&o.soc.dr)||0,
      de:o.de||0,dr:o.dr||0,ph:o.ph||0,nAut:auteurs(o).length,
      artiste:e.artiste||'',spotify:e.spotify||'',youtube:e.youtube||'',sortie:e.sortie||'',
      notes:notesDe(e),art:e.art||'',
      sw:v.list,swAuto:v.auto,vstat:ventStatut(soc,code,v.list)};
  });
}
function swRows(soc){
  var rs=rows(soc),agg={};
  swList(soc).forEach(function(s){agg[s.id]={sw:s,net:0,oeuvres:0,auto:0,sPh:0,sDep:0};});
  rs.forEach(function(r){r.sw.forEach(function(x){
    if(!agg[x.id])return;
    agg[x.id].net+=x.net;agg[x.id].oeuvres++;
    agg[x.id].sPh+=(x.ecrPh||0);agg[x.id].sDep+=(x.ecrDep||0);
    if(r.swAuto)agg[x.id].auto++;});});
  return Object.keys(agg).map(function(k){var a=agg[k];
    a.moyPh=a.oeuvres?a.sPh/a.oeuvres:0;a.moyDep=a.oeuvres?a.sDep/a.oeuvres:0;return a;});
}
function totals(soc){
  var rs=rows(soc),t={net:0,oeuvres:0,avecRev:0,ratt:0,ans:{},reps:{},partSoc:0,partSocPh:0,nPart:0,na:0};
  rs.forEach(function(r){
    t.net+=r.net;
    if(r.na){t.na+=r.net;}
    else{t.oeuvres++;if(r.net>0)t.avecRev++;if(r.sw.length)t.ratt++;}
    if(r.partSoc||r.partSocPh){t.partSoc+=r.partSoc;t.partSocPh+=r.partSocPh;t.nPart++;}
    Object.keys(r.ans).forEach(function(a){t.ans[a]=(t.ans[a]||0)+r.ans[a];});
    Object.keys(r.reps).forEach(function(p){t.reps[p]=(t.reps[p]||0)+r.reps[p];});
  });
  return t;
}
function auteursSansFiche(soc){
  return allAD(soc).filter(function(ad){
    var m=swMatch(soc,ad);return m.niveau==='aucun';});
}

/* ============================== imports ============================== */
function isRepartition(head){
  return colIndex(head,'Mes droits en NET (Euros)')>=0&&colIndex(head,'Rion paiement')>=0;}
function isCatalogue(head){
  return colIndex(head,'Code oeuvre')>=0&&colIndex(head,"Nom de l'ayant-droit")>=0;}
function autoMapRoster(head){
  var f=function(c){for(var i=0;i<c.length;i++){var j=colIndex(head,c[i]);if(j>=0)return j;}return -1;};
  return {nom:f(['Nom','Songwriter','Artiste','Nom complet','Name']),
    prenom:f(['Prénom','Prenom','First name']),
    coad:f(['COAD','Code ayant droit','Code Sacem']),
    ipi:f(['IPI','Code IPI','IPI name number']),
    part:f(['Part','Part éditoriale','Part cédée','Edition','% édition','Pourcentage']),
    statut:f(['Statut','Type','Contrat']),
    alias:f(['Pseudonyme','Pseudo','Alias','Nom d artiste',"Nom d'artiste"])};
}
function importRoster(soc,head,rws,map){
  var cree=0,maj=0,ignore=0;
  rws.forEach(function(r){
    var nom=(map.nom>=0?String(r[map.nom]||'').trim():'');
    if(map.prenom>=0&&String(r[map.prenom]||'').trim())
      nom=(String(r[map.prenom]).trim()+' '+nom).trim();
    if(!nom){ignore++;return;}
    var coad=map.coad>=0?String(r[map.coad]||'').replace(/\D+/g,''):'';
    var ipi=map.ipi>=0?String(r[map.ipi]||'').trim():'';
    var part=map.part>=0?numFR(r[map.part]):null;
    if(part!=null&&part>0&&part<=1)part=part*100;          // 0,8 → 80 %
    var alias=map.alias>=0?String(r[map.alias]||'').trim():'';
    var statut=map.statut>=0?norm(r[map.statut]):'';
    var type=/EXTERN|TIERS/.test(statut)?'externe':/ARTISTE|NON SIGNE/.test(statut)?'artiste':'roster';
    // fiche existante : par COAD, puis par IPI, puis par nom
    var ex=null,ids=Object.keys(store.songwriters);
    for(var i=0;i<ids.length;i++){var sw=store.songwriters[ids[i]];
      if(coad&&sw.coad&&String(sw.coad)===coad){ex=sw;break;}
      if(ipi&&(sw.ipis||[]).indexOf(ipi)>=0){ex=sw;break;}
      if(norm(sw.nom)===norm(nom)&&(sw.societe||soc)===soc){ex=sw;break;}}
    if(ex){
      if(coad&&!ex.coad)ex.coad=coad;
      if(ipi&&(ex.ipis||[]).indexOf(ipi)<0)ex.ipis=(ex.ipis||[]).concat([ipi]);
      if(part!=null&&ex.part==null)ex.part=part;
      if(alias&&(ex.alias||[]).indexOf(alias)<0)ex.alias=(ex.alias||[]).concat([alias]);
      ex.type=ex.type||type;maj++;
    }else{
      var n={id:uid('sw'),nom:nom,coad:coad,ipis:ipi?[ipi]:[],ads:[],societe:soc,
        part:part==null?50:part,type:type,alias:alias?[alias]:[],note:'',source:'roster'};
      store.songwriters[n.id]=n;cree++;
    }
  });
  return {cree:cree,maj:maj,ignore:ignore};
}

function importRepartition(soc,head,rws){
  var ic=colIndex(head,"Code de l'oeuvre"),it=colIndex(head,"Titre de l'oeuvre"),
      inet=colIndex(head,'Mes droits en NET (Euros)'),ir=colIndex(head,'Rion paiement'),
      ide=colIndex(head,'Montant DE (Euros)'),idr=colIndex(head,'Montant DR (Euros)'),
      iph=colIndex(head,'Montant Phono (Euros)');
  if(ic<0||inet<0||ir<0)throw new Error('colonnes de répartition introuvables');
  var O=store.oeuvres[soc]||(store.oeuvres[soc]={}),reps={},n=0;
  rws.forEach(function(r){
    var brut=String(r[ic]||'').trim(),titre=it>=0?String(r[it]||'').trim():'';
    var na=(brut==='-1'||brut===''||norm(titre)==='NON RENSEIGNE');
    var code=na?'NA':normCode(brut);
    if(!code)return;
    var net=numFR(r[inet]),rep=String(r[ir]||'').trim();
    var o=O[code]||(O[code]={code:code,titre:na?'Revenus non affectés':'',parts:[],net:0,de:0,dr:0,ph:0,ans:{},reps:{},cat:false,na:na});
    if(!o.titre&&it>=0)o.titre=titre;
    o.net=(o.net||0)+net;
    if(ide>=0)o.de=(o.de||0)+numFR(r[ide]);
    if(idr>=0)o.dr=(o.dr||0)+numFR(r[idr]);
    if(iph>=0)o.ph=(o.ph||0)+numFR(r[iph]);
    if(/^\d+$/.test(rep)){
      var an=String(repDate(rep).an);
      o.ans[an]=(o.ans[an]||0)+net;o.reps[rep]=(o.reps[rep]||0)+net;reps[rep]=(reps[rep]||0)+net;}
    n++;
  });
  return {reps:reps,lignes:n};
}
function importCatalogue(soc,head,rws,fichier){
  var C={code:colIndex(head,'Code oeuvre'),titre:colIndex(head,"Titre de l'oeuvre"),
    sous:colIndex(head,'Sous-titre(s)'),genre:colIndex(head,"Genre de l'oeuvre"),
    iswc:colIndex(head,'ISWC'),depot:colIndex(head,'Date de déclaration'),
    role:colIndex(head,'Rôle'),nom:colIndex(head,"Nom de l'ayant-droit"),coad:colIndex(head,'COAD'),
    ipi:colIndex(head,'Code IPI'),dep:colIndex(head,'Part DEP'),dr:colIndex(head,'Part DR'),
    ph:colIndex(head,'Part PHONO')};
  if(C.code<0)throw new Error('colonne « Code oeuvre » introuvable');
  var freq={};
  rws.forEach(function(r){
    if(C.role>=0&&String(r[C.role]).trim()==='E'&&C.coad>=0){
      var k=String(r[C.coad]).trim();if(k)freq[k]=(freq[k]||0)+1;}});
  var coad=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];})[0]||socCoad(soc);
  var O=store.oeuvres[soc]||(store.oeuvres[soc]={}),vus={},nouvelles=0,n=0;
  rws.forEach(function(r){
    var code=normCode(r[C.code]);if(!code)return;
    var o=O[code];
    if(!o){o=O[code]={code:code,titre:'',parts:[],net:0,ans:{},reps:{},cat:true};nouvelles++;}
    if(!vus[code]){vus[code]=1;o.parts=[];o.soc=null;}   // le catalogue fait foi sur les splits
    o.cat=true;
    if(C.titre>=0&&String(r[C.titre]).trim())o.titre=String(r[C.titre]).trim();
    if(C.genre>=0&&String(r[C.genre]).trim())o.genre=String(r[C.genre]).trim();
    if(C.iswc>=0&&String(r[C.iswc]).trim())o.iswc=String(r[C.iswc]).trim();
    if(C.depot>=0&&String(r[C.depot]).trim())o.depot=String(r[C.depot]).trim().slice(0,10);
    var p={r:C.role>=0?String(r[C.role]).trim():'',n:C.nom>=0?String(r[C.nom]).trim():'',
      c:C.coad>=0?String(r[C.coad]).trim():'',i:C.ipi>=0?String(r[C.ipi]).trim():'',
      dep:C.dep>=0?numFR(r[C.dep]):0,dr:C.dr>=0?numFR(r[C.dr]):0,ph:C.ph>=0?numFR(r[C.ph]):0};
    o.parts.push(p);
    if(p.c&&String(p.c)===String(coad))o.soc={dep:((o.soc&&o.soc.dep)||0)+p.dep,
      dr:((o.soc&&o.soc.dr)||0)+p.dr,ph:((o.soc&&o.soc.ph)||0)+p.ph};
    n++;
  });
  var m=store.meta[soc]||(store.meta[soc]={});
  m.coad=coad;m.catalogueDate=today();m.catalogueFichier=fichier;
  return {lignes:n,oeuvres:Object.keys(vus).length,nouvelles:nouvelles,coad:coad};
}

function dernierRep(t){var k=Object.keys(t.reps);if(!k.length)return '—';
  k.sort(function(a,b){return (+b)-(+a);});return eur(t.reps[k[0]])+' €';}
function kpi(c,k,v,s){return '<div class="kpi '+c+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';}
function origineTag(sw){
  return sw.source==='roster'?'<span class="tag neutral">roster</span>'
    :sw.source==='planning'?'<span class="tag neutral">planning</span>'
    :'<span class="tag neutral">fiche outil</span>';

function swTags(r){

  return '<div class="swlist">'+r.sw.map(function(x){
    return '<span class="swtag">'+esc(x.nom)+' <b>'+pv(x.pt)+'</b></span>';}).join('')+
    (r.swAuto?' <span class="tag neutral">auto</span>':'')+'</div>';

/* ============================== œuvres ============================== */
function viewOeuvres(){
  var soc=state.societe,rs=rows(soc);
  if(!rs.length)return viewVide();
  var ans=Object.keys(totals(soc).ans).sort(),q=state.q.toLowerCase();
  var list=rs.filter(function(r){
    if(state.filtre==='rev'&&!(r.net>0))return false;
    if(state.filtre==='ratt'&&!r.sw.length)return false;
    if(state.filtre==='nonratt'&&r.sw.length)return false;
    if(state.filtre==='fiche'&&(r.artiste&&r.sortie&&r.spotify))return false;
    if(!q)return true;
    return (r.titre+' '+r.code+' '+r.artiste+' '+r.iswc).toLowerCase().indexOf(q)>=0;});
  var k=state.sort.k,d=state.sort.d;
  list.sort(function(a,b){
    var va,vb;
    if(k==='titre'||k==='artiste'||k==='depot'||k==='sortie'){
      va=(a[k]||'').toLowerCase();vb=(b[k]||'').toLowerCase();return va<vb?-d:va>vb?d:0;}
    if(k.charAt(0)==='@'){va=a.ans[k.slice(1)]||0;vb=b.ans[k.slice(1)]||0;}
    else{va=+a[k]||0;vb=+b[k]||0;}
    return (va-vb)*d;});
  var th=function(key,lbl,cls){return '<th class="sortable '+(cls||'num')+'" data-k="'+key+'">'+lbl+
    (k===key?' <span class="car">'+(d<0?'▼':'▲')+'</span>':'')+'</th>';};
  var f=[['tous','Toutes'],['rev','Avec revenus'],['ratt','Rattachées'],['nonratt','Non rattachées'],['fiche','Fiche à compléter']];
  var h='<div class="panel"><div class="phead">'+
    '<div class="rowline"><input type="search" id="q" placeholder="Titre, code, artiste, ISWC…" value="'+esc(state.q)+'" style="width:240px">'+
    f.map(function(x){return '<button class="chip" data-f="'+x[0]+'" aria-pressed="'+(state.filtre===x[0])+'">'+x[1]+'</button>';}).join('')+
    '</div><span class="note">'+list.length+' œuvre'+(list.length>1?'s':'')+' · cliquez une ligne pour la fiche</span></div>'+
    '<div class="tscroll"><table><thead><tr>'+
    th('titre','Œuvre','l sortable')+th('artiste','Artiste','l sortable')+
    '<th class="l">Songwriters de la société</th>'+th('partSocPh','Notre phono')+th('nAut','Auteurs')+
    ans.map(function(a){return th('@'+a,a);}).join('')+th('net','Total €')+
    '<th class="l">Liens</th>'+th('sortie','Sortie','l sortable')+th('depot','Dépôt','l sortable')+
    '</tr></thead><tbody>';
  if(!list.length)h+='<tr><td colspan="10" class="empty">Aucune œuvre ne correspond.</td></tr>';
  list.slice(0,300).forEach(function(r){
    h+='<tr class="clickable" data-code="'+esc(r.code)+'">'+
      '<td class="l w">'+esc(r.titre)+'<div class="mini">'+esc(r.code)+(r.cat?'':' · hors catalogue')+'</div></td>'+
      '<td class="l">'+(r.artiste?esc(r.artiste):'<span class="mut">—</span>')+'</td>'+
      '<td class="l">'+swTags(r)+'</td>'+
      '<td class="num'+(r.partSocPh?' ph':' mut')+'">'+(r.partSocPh?pv(r.partSocPh)+' %':'·')+
        (r.partSoc?'<div class="mini">'+pv(r.partSoc)+' % DEP</div>':'')+'</td>'+
      '<td class="num mut">'+(r.nAut||'·')+'</td>'+
      ans.map(function(a){return '<td class="num'+(r.ans[a]?'':' mut')+'">'+(r.ans[a]?eur(r.ans[a]):'·')+'</td>';}).join('')+
      '<td class="num w">'+eur(r.net)+'</td><td class="l">'+liens(r)+'</td>'+
      '<td class="l mut">'+(r.sortie?frDate(r.sortie):'—')+'</td>'+
      '<td class="l mut">'+(r.depot?frDate(r.depot):'—')+'</td></tr>';});
  h+='</tbody></table></div>';
  if(list.length>300)h+='<div class="pbody mut">300 premières lignes affichées — affinez la recherche.</div>';
  return h+'</div>';
}
function liens(r){
  var o=[];
  if(r.spotify)o.push('<a href="'+esc(r.spotify)+'" target="_blank" rel="noopener" title="Spotify"><i class="ext sp"></i></a>');
  if(r.youtube)o.push('<a href="'+esc(r.youtube)+'" target="_blank" rel="noopener" title="YouTube"><i class="ext yt"></i></a>');
  return o.length?o.join(' '):'<span class="mut">—</span>';

/* ============================== rendu ============================== */
function render(){
  renderChrome();
  var v=el('view');
  v.innerHTML=state.tab==='apercu'?viewApercu():state.tab==='oeuvres'?viewOeuvres():
              state.tab==='songwriters'?viewSongwriters():
              state.tab==='rappro'?viewRappro():viewImports();
  v.querySelectorAll('[data-code]').forEach(function(tr){tr.onclick=function(){ficheOeuvre(this.dataset.code);};});
  v.querySelectorAll('[data-sw]').forEach(function(tr){
    tr.onclick=function(e){if(e.target.closest('[data-edit]'))return;ficheSW(this.dataset.sw);};});
  v.querySelectorAll('[data-edit]').forEach(function(b){
    b.onclick=function(e){e.stopPropagation();ficheSW(this.dataset.edit);};});
  v.querySelectorAll('[data-new]').forEach(function(b){
    b.onclick=function(e){e.stopPropagation();
      var soc=state.societe,cle=this.dataset.new;
      var c=auteursSansFiche(soc).filter(function(a){return String(a.coad)===String(cle)||a.nom===cle;})[0];
      ficheSW(null,c);};});
  v.querySelectorAll('[data-k]').forEach(function(t){t.onclick=function(){
    var key=this.dataset.k;
    if(state.sort.k===key)state.sort.d=-state.sort.d;
    else{state.sort.k=key;state.sort.d=(key==='titre'||key==='artiste')?1:-1;}
    render();};});
  v.querySelectorAll('[data-sk]').forEach(function(t){t.onclick=function(){
    var key=this.dataset.sk;
    if(state.swSort.k===key)state.swSort.d=-state.swSort.d;
    else{state.swSort.k=key;state.swSort.d=(key==='nom')?1:-1;}
    render();};});
  v.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){state.filtre=this.dataset.f;render();};});
  v.querySelectorAll('[data-rf]').forEach(function(b){
    b.onclick=function(){state.rfiltre=this.dataset.rf;render();};});
  v.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=async function(){
    var soc=state.societe;(store.liens[soc]||(store.liens[soc]={}))[this.dataset.ok]=this.dataset.id;
    try{await saveLiens();}catch(e){}
    render();toast('Rapprochement confirmé');};});
  v.querySelectorAll('[data-skip]').forEach(function(b){b.onclick=async function(){
    var soc=state.societe;(store.liens[soc]||(store.liens[soc]={}))[this.dataset.skip]='-';
    try{await saveLiens();}catch(e){}
    render();toast('Ayant droit écarté');};});
  v.querySelectorAll('[data-lier]').forEach(function(b){b.onclick=function(){modalLier(this.dataset.lier);};});
  v.querySelectorAll('[data-fiche]').forEach(function(b){b.onclick=function(){
    var ad=allAD(state.societe).filter(function(x){return x.cle===this.dataset.fiche;},this)[0];
    ficheSW(null,ad);};});
  v.querySelectorAll('[data-vok]').forEach(function(b){b.onclick=async function(){

/* ---------- fiche œuvre ---------- */
function repsSoc(soc){
  var s={},O=store.oeuvres[soc]||{};
  Object.keys(O).forEach(function(c){Object.keys(O[c].reps||{}).forEach(function(r){s[r]=1;});});
  return Object.keys(s).map(Number).filter(function(x){return !isNaN(x);})
    .sort(function(x,y){return x-y;});
}
function ficheOeuvre(code){
  var soc=state.societe,o=(store.oeuvres[soc]||{})[code];if(!o)return;
  var e=(store.edits[soc]||{})[code]||{};
  var a=attach(soc,code),aut=a.aut;
  var ix=swIndex(soc),moiCoad=String(socCoad(soc));
  var P=socParts(o),partDep=P.dep,partDr=P.dr,partPh=P.ph;
  var PIL=pilote(P),TOT=PIL==='ph'?partPh:partDep;
  var notes=notesDe(e),artUrl=e.art||'';
  var lignes=aut.map(function(x,i){
    var swId=ix[String(x.coad)]||ix['n:'+norm(x.nom)]||'';
    var cur=a.list.filter(function(l){return l.id===swId;})[0];
    var sw=swId?store.songwriters[swId]:null;
    return {i:i,coad:x.coad,nom:x.nom,ipi:x.ipi,ecr:x.dep,ecrDr:x.dr||0,ecrPh:x.ph,
      roles:Object.keys(x.roles).join('/'),swId:swId,coche:!!cur,role:Object.keys(x.roles).join('/'),
      deal:cur?(cur.part!=null?cur.part:100):(sw&&sw.part!=null?sw.part:100)};});
  // éditeurs regroupés par identité, avec la nôtre repérée sur place
  var eds=(function(){
    var m={};
    editeurs(o).forEach(function(p){
      var k=p.c||('n:'+norm(p.n));
      var x=m[k]||(m[k]={nom:p.n,coad:p.c||'',role:p.r||'E',ecr:0,ecrDr:0,ecrPh:0,
        moi:String(p.c)===moiCoad});
      x.ecr+=p.dep||0;x.ecrDr+=p.dr||0;x.ecrPh+=p.ph||0;});
    return Object.keys(m).map(function(k){return m[k];});
  })();
  var nous=eds.filter(function(p){return p.moi;});

  /* ---- revenus : total + détail sur les répartitions dont on a l'historique ---- */
  var toutes=repsSoc(soc),parAn={};
  toutes.forEach(function(n){var y=repDate(n).an;(parAn[y]||(parAn[y]=[])).push(n);});
  var anneesDispo=Object.keys(parAn).sort();
  var blocRevenus=!toutes.length
    ? '<div class="mut" style="font-size:12px">Aucune répartition importée pour '+esc(socNom(soc))+'.</div>'
    : '<div class="tscroll"><table><tbody>'+anneesDispo.map(function(y){
        var ta=parAn[y].reduce(function(s2,n){return s2+((o.reps||{})[n]||0);},0);
        return '<tr class="yr"><td class="l w">'+y+'</td><td class="num w">'+eur(ta)+' €</td><td></td></tr>'+
          parAn[y].map(function(n){
            var v=(o.reps||{})[n]||0,mx=Math.max.apply(null,toutes.map(function(z){return (o.reps||{})[z]||0;}).concat([0.01]));
            return '<tr><td class="l mut" style="padding-left:18px">'+n+' <span class="mini">'+repDate(n).lbl+'</span></td>'+
              '<td class="num'+(v?'':' mut')+'">'+(v?eur(v)+' €':'—')+'</td>'+
              '<td style="width:88px">'+(v>0?'<i class="bar" style="width:'+Math.max(3,Math.round(100*v/mx))+'%"></i>':'')+'</td></tr>';
          }).join('');}).join('')+
      '</tbody><tfoot><tr><td class="l">Total sur '+toutes.length+' répartition'+(toutes.length>1?'s':'')+
        ' ('+toutes[0]+'–'+toutes[toutes.length-1]+')</td>'+
        '<td class="num">'+eur(o.net||0)+' €</td><td></td></tr></tfoot></table></div>'+
      (o.de||o.dr||o.ph?'<div class="hint">Dont '+eur(o.de||0)+' € de droit d\'exécution · '+
        eur(o.dr||0)+' € de droits de reproduction · '+eur(o.ph||0)+' € de phono.</div>':'');

  var body='<div class="split"><div>'+
    /* --- le titre commercialisé --- */
    '<label class="fl">Titre commercialisé</label>'+
    '<div class="track"><div class="cover" id="f-cover">'+
      (artUrl?'<img src="'+esc(artUrl)+'" alt="">':'<span class="mut">pochette</span>')+'</div>'+
      '<div class="trackf">'+
        '<div class="field"><label class="fl">Artiste interprète</label>'+
          '<input type="text" id="f-artiste" value="'+esc(e.artiste||'')+'" placeholder="Nom de l\'artiste"></div>'+
        '<div class="field"><label class="fl">Date de sortie</label>'+
          '<input type="date" id="f-sortie" value="'+esc(e.sortie||'')+'"></div>'+
      '</div></div>'+
    '<div class="field" style="margin-top:10px"><label class="fl">Lien Spotify</label>'+
      '<input type="url" id="f-spotify" value="'+esc(e.spotify||'')+'" placeholder="https://open.spotify.com/track/…"></div>'+
    '<div class="field"><label class="fl">Lien YouTube</label>'+
      '<input type="url" id="f-youtube" value="'+esc(e.youtube||'')+'" placeholder="https://www.youtube.com/watch?v=…"></div>'+
    '<div class="hint" id="f-plan"></div>'+
    /* --- l'œuvre déposée --- */
    '<div class="sep"></div><label class="fl">Œuvre déposée à la Sacem</label>'+
    '<div class="grid2"><div class="field"><label class="fl">Titre du dépôt</label>'+
      '<input type="text" id="f-titre" value="'+esc(o.titre)+'"></div>'+
      '<div class="field"><label class="fl">Date de dépôt</label>'+
      '<input type="date" id="f-depot" value="'+esc(o.depot||'')+'"></div></div>'+
    '<div class="rowline"><span class="tag neutral">code '+esc(code)+'</span>'+
      (o.iswc?'<span class="tag neutral">ISWC '+esc(o.iswc)+'</span>':'')+
      (o.genre?'<span class="tag neutral">'+esc(o.genre)+'</span>':'')+
      (o.cat?'<span class="tag ok">au catalogue</span>':'<span class="tag warn">hors catalogue</span>')+'</div>'+
    /* --- revenus --- */
    '<div class="sep"></div><label class="fl">Revenus perçus par '+esc(socNom(soc))+'</label>'+blocRevenus+
    /* --- notes --- */
    '<div class="sep"></div><label class="fl">Notes internes</label><div id="f-notes"></div>'+
    '<div class="field" style="margin-top:8px"><textarea id="f-note" placeholder="Ajouter une note — elle sera datée"></textarea>'+
      '<div class="rowline" style="margin-top:6px"><button class="btn sm" id="f-note-add">Ajouter la note</button>'+
      '<span class="mut" style="font-size:11.5px">Horodatée à l\'ajout.</span></div></div>'+
    '</div><div>'+
    /* --- ayants droit --- */
    '<label class="fl">Ayants droit de l\'œuvre</label>'+
    '<div class="tscroll"><table><thead><tr id="aut-head">'+
      '<th class="l sortable" data-ak="role" data-lbl="Rôle">Rôle</th>'+
      '<th class="l sortable" data-ak="nom" data-lbl="Ayant droit">Ayant droit</th>'+
      '<th class="num sortable" data-ak="ecrPh" data-lbl="Phono">Phono</th>'+
      '<th class="num sortable sec" data-ak="ecr" data-lbl="DEP">DEP</th>'+
      '<th class="num sortable sec" data-ak="ecrDr" data-lbl="DR">DR</th>'+
      '<th class="num">Représenté</th><th class="num">Part</th></tr></thead>'+
      '<tbody id="aut-body"></tbody></table></div>'+
    '<div class="hint" id="vent-hint"></div>'+
    '<div class="sep"></div><label class="fl">Ventilation de notre part phono</label><div id="vent"></div>'+
    '</div></div>';
  openModal('<div class="eyebrow">Œuvre</div><h2>'+esc(o.titre)+'</h2>',body,
    '<span class="left mut" id="f-state"></span><button class="btn" id="f-cancel">Annuler</button>'+
    '<button class="btn primary" id="f-save">Enregistrer</button>','wide');

  /* ---- notes horodatées ---- */
  function drawNotes(){
    el('f-notes').innerHTML=notes.length
      ? notes.slice().reverse().map(function(n){
          var j=notes.indexOf(n);
          return '<div class="note-it"><div class="mini">'+(n.old?'note reprise · date inconnue':esc(dateHeure(n.d)))+
            '<button class="btn sm" data-nd="'+j+'" style="float:right;margin-top:-4px">Supprimer</button></div>'+
            '<div>'+esc(n.t).replace(/\n/g,'<br>')+'</div></div>';}).join('')
      : '<div class="mut" style="font-size:12px">Aucune note.</div>';
    el('f-notes').querySelectorAll('[data-nd]').forEach(function(b){
      b.onclick=function(){notes.splice(+this.dataset.nd,1);drawNotes();};});
  }
  el('f-note-add').onclick=function(){
    var t=el('f-note').value.trim();if(!t){el('f-note').focus();return;}
    notes.push({t:t,d:new Date().toISOString()});el('f-note').value='';drawNotes();};

  /* ---- pochette ---- */
  function majPochette(force){
    var box=el('f-cover'),chs=el('f-spotify'),chy=el('f-youtube');
    if(!box||!chs||!chy)return;                       // fiche refermée entre-temps
    var sp=chs.value.trim(),yt=chy.value.trim();
    if(!sp&&!yt){artUrl='';box.innerHTML='<span class="mut">pochette</span>';return;}
    if(!force&&artUrl&&e.artKey===artKey(sp,yt))return;
    box.innerHTML='<span class="mut">…</span>';
    chercherPochette(sp,yt,function(u){
      artUrl=u||'';
      var b2=el('f-cover');if(!b2)return;
      if(!u){b2.innerHTML='<span class="mut">pochette introuvable</span>';return;}
      b2.innerHTML='<img src="'+esc(u)+'" alt="">';
      var im=b2.querySelector('img');
      im.onerror=function(){var b3=el('f-cover');
        if(b3)b3.innerHTML='<span class="mut">pochette indisponible</span>';};});
  }
  el('f-spotify').onchange=function(){majPochette(true);};
  el('f-youtube').onchange=function(){majPochette(true);};

  /* ---- ayants droit : nous d'abord, puis les auteurs, puis les autres éditeurs ---- */
  var triAD={k:'nom',d:1};
  function cmp(k,d){
    return function(x,y){
      if(k==='nom')return (String(x.nom||'').localeCompare(String(y.nom||''),'fr'))*d;
      if(k==='role')return (String(x.role||'').localeCompare(String(y.role||''),'fr'))*d;
      return (((+x[k]||0)-(+y[k]||0))||String(x.nom||'').localeCompare(String(y.nom||''),'fr'))*d;};
  }
  function ligneEd(p,moi){
    return '<tr class="'+(moi?'nous':'')+'"><td class="l mut">'+esc(p.role||'E')+'</td>'+
      '<td class="l'+(moi?' w':' mut')+'">'+esc(p.nom)+(moi?' <span class="tag ok">nous</span>':'')+'</td>'+
      '<td class="num ph'+(moi?'':' mut')+'">'+pv(p.ecrPh)+' %</td>'+
      '<td class="num mut sec">'+pv(p.ecr)+' %</td><td class="num mut sec">'+pv(p.ecrDr)+' %</td>'+
      '<td></td><td></td></tr>';
  }
  function groupe(t){return '<tr class="grp"><td class="l mut" colspan="7">'+t+'</td></tr>';}
  function drawAut(){
    var h='',aSort=lignes.slice().sort(cmp(triAD.k,triAD.d));
    var eSort=eds.slice().sort(cmp(triAD.k,triAD.d));
    h+=groupe('Auteurs et compositeurs');
    h+=aSort.length?aSort.map(function(l){
      return '<tr><td class="l mut">'+esc(l.roles)+'</td>'+
        '<td class="l'+(l.coche?' w':'')+'">'+esc(l.nom)+(l.swId?'':' <span class="tag warn">sans fiche</span>')+
        '<div class="mini">'+esc(l.coad||'')+'</div></td>'+
        '<td class="num ph">'+pv(l.ecrPh)+' %</td>'+
        '<td class="num mut sec">'+pv(l.ecr)+' %</td><td class="num mut sec">'+pv(l.ecrDr)+' %</td>'+
        '<td class="num"><input type="checkbox" data-c="'+l.i+'"'+(l.coche?' checked':'')+'></td>'+
        '<td class="num"><input type="number" step="1" min="0" max="100" data-d="'+l.i+'" value="'+
          (l.deal!=null?l.deal:'')+'"'+(l.coche?'':' disabled')+' style="width:66px"></td></tr>';}).join('')
      :'<tr><td colspan="7" class="mut">Aucun auteur au dépôt — importez le catalogue.</td></tr>';
    h+=groupe('Éditeurs');
    h+=eSort.length?eSort.map(function(p){return ligneEd(p,p.moi);}).join('')
      :'<tr><td colspan="7" class="mut">Aucun éditeur au dépôt.</td></tr>';
    if(!nous.length)h+='<tr class="nous"><td class="l mut">E</td><td class="l w">'+esc(socNom(soc))+
      ' <span class="tag warn">absent du dépôt</span></td><td class="num ph">0 %</td>'+
      '<td class="num mut sec">0 %</td><td class="num mut sec">0 %</td><td></td><td></td></tr>';
    el('aut-body').innerHTML=h;
    el('aut-head').querySelectorAll('[data-ak]').forEach(function(t){
      var k=t.dataset.ak;
      t.innerHTML=t.dataset.lbl+(triAD.k===k?' <span class="car">'+(triAD.d<0?'▼':'▲')+'</span>':'');
      t.onclick=function(){
        if(triAD.k===k)triAD.d=-triAD.d;
        else{triAD.k=k;triAD.d=(k==='nom'||k==='role')?1:-1;}
        drawAut();};});
    el('aut-body').querySelectorAll('[data-c]').forEach(function(c){
      c.onchange=function(){
        var i=+this.dataset.c;lignes[i].coche=this.checked;
        var inp=el('aut-body').querySelector('[data-d="'+i+'"]');
        if(inp){inp.disabled=!this.checked;
          if(this.checked&&(inp.value===''||lignes[i].deal==null)){

        var tr=this.closest('tr');if(tr&&tr.children[1])tr.children[1].classList.toggle('w',this.checked);
        proposer();drawVent();};});
    el('aut-body').querySelectorAll('[data-d]').forEach(function(c){
      c.oninput=function(){lignes[+this.dataset.d].deal=this.value===''?null:+this.value;
        proposer();drawVent();};});
  }
  /* ---- points de notre part phono ---- */
  var A0=alloc(soc,code),pts={};
  A0.list.forEach(function(x){pts[x.id]=x.pt;});
  var manuel=A0.manuel;
  function proposer(){
    var sel=lignes.filter(function(l){return l.coche;}),w=0;
    sel.forEach(function(l){l._w=(PIL==='ph'?(l.ecrPh||0):(l.ecr||0))*(l.deal==null?0:l.deal)/100;w+=l._w;});
    sel.forEach(function(l){pts[l.swId||('tmp'+l.i)]=w>0?TOT*l._w/w:0;});
    manuel=false;
  }
  function eurDe(pt,t){return t>0?(o.net||0)*pt/t:0;}

    var t=0;sel.forEach(function(l){t+=+pts[l.swId||('tmp'+l.i)]||0;});
    var ok=Math.abs(t-TOT)<0.02;
    var nom=PIL==='ph'?'phono':'DEP';
    el('vent').innerHTML=
      (sel.length>1?'<div class="hint" style="margin-bottom:8px">Deux ayants droit représentés ou plus : '+

      '<div class="tscroll"><table><thead><tr><th class="l">Songwriter</th><th class="num">Écriture phono</th>'+

      sel.map(function(l){
        var k=l.swId||('tmp'+l.i),p=+pts[k]||0,r=TOT>0?p/TOT:0;

      '</tbody><tfoot><tr><td class="l">Total réparti</td><td></td><td></td>'+
      '<td class="num">'+pv(t)+' %'+(ok?'':' <span class="tag warn">≠ '+pv(TOT)+' %</span>')+'</td>'+
      '<td class="num sec">'+pv(t>0?partDep*t/TOT:0)+' %</td><td class="num sec">'+pv(t>0?partDr*t/TOT:0)+' %</td>'+
      '<td class="num">'+eur(o.net||0)+'</td></tr></tfoot></table></div>'+
      '<div class="rowline" style="margin-top:8px"><button class="btn sm" id="v-prop">Recalculer la proposition</button>'+
      '<span class="mut" style="font-size:11.5px">'+(manuel?'Répartition saisie à la main.':
        'Proposition : écriture phono × part représentée, ramenée à nos points.')+'</span></div>';
    el('vent').querySelectorAll('[data-pt]').forEach(function(i2){
      i2.oninput=function(){pts[this.dataset.pt]=this.value===''?0:+this.value;manuel=true;majTotaux();};});
    el('v-prop').onclick=function(){proposer();drawVent();};
  }
  function majTotaux(){
    // recalcul des totaux et des euros sans reconstruire les champs de saisie
    var sel=lignes.filter(function(l){return l.coche;}).sort(cmp(triAD.k,triAD.d)),t=0;
    sel.forEach(function(l){t+=+pts[l.swId||('tmp'+l.i)]||0;});
    var tb=el('vent').querySelector('tbody'),tf=el('vent').querySelector('tfoot tr');
    sel.forEach(function(l,idx){
      var p=+pts[l.swId||('tmp'+l.i)]||0,r=TOT>0?p/TOT:0,tr=tb.children[idx];
      if(!tr)return;
      tr.children[4].textContent=pv(partDep*r)+' %';
      tr.children[5].textContent=pv(partDr*r)+' %';

      tf.children[5].textContent=pv(TOT>0?partDr*t/TOT:0)+' %';
    }

  function partLigne(){

      '<b>'+pv(partDep)+' %</b> en DEP · <b>'+pv(partDr)+' %</b> en DR. '+
      'Le phono commande la ventilation, DEP et DR suivent au prorata.';

  drawNotes();drawAut();drawVent();majPochette(false);
  var rel=sortiePourOeuvre(o.titre);
  if(rel){
    el('f-plan').innerHTML='Planning : <b>'+esc(rel.artist||'')+'</b>'+
      (rel.date||rel.dateSortable?' · '+esc(rel.date||rel.dateSortable):'')+
      ' <button class="btn sm" id="f-plan-ok" style="margin-left:6px">Reprendre</button>';
    el('f-plan-ok').onclick=function(){
      if(rel.artist)el('f-artiste').value=rel.artist;
      var d=(rel.dateSortable||'').slice(0,10);
      if(/^\d{4}-\d{2}-\d{2}$/.test(d))el('f-sortie').value=d;

      this.remove();};
  }
  el('f-cancel').onclick=closeModal;
  el('f-save').onclick=async function(){
    var E=store.edits[soc]||(store.edits[soc]={}),ed=E[code]||(E[code]={});

    if(reste)notes.push({t:reste,d:new Date().toISOString()});
    ed.artiste=el('f-artiste').value.trim();ed.spotify=el('f-spotify').value.trim();
    ed.youtube=el('f-youtube').value.trim();ed.sortie=el('f-sortie').value;
    ed.notes=notes.map(function(n){return {t:n.t,d:n.d||''};});
    ed.note=notes.length?notes[notes.length-1].t:'';      // compat affichage rapide
    ed.art=artUrl||'';ed.artKey=artKey(ed.spotify,ed.youtube);
    var manq=lignes.filter(function(l){return l.coche&&!l.swId;});
    for(var i=0;i<manq.length;i++){
      var l=manq[i];
      var sw={id:uid('sw'),nom:l.nom,coad:l.coad||'',ipi:l.ipi||'',societe:soc,
        part:l.deal==null?100:+l.deal,alias:[],note:''};
      store.songwriters[sw.id]=sw;l.swId=sw.id;
      try{await saveSW(sw);}catch(err){}
    }
    ed.sw=lignes.filter(function(l){return l.coche&&l.swId;})
      .map(function(l){return {id:l.swId,part:l.deal==null?0:+l.deal};});
    ed.alloc=lignes.filter(function(l){return l.coche&&l.swId;}).map(function(l){
      var p=pts[l.swId]!=null?pts[l.swId]:(pts['tmp'+l.i]||0);
      return {id:l.swId,pt:Math.round((+p||0)*100)/100};});
    ed.vsig=vsig(ed.alloc);
    ed.vdate=new Date().toISOString();
    o.titre=el('f-titre').value.trim()||o.titre;
    var dp=el('f-depot').value;if(dp)o.depot=dp;
    this.disabled=true;el('f-state').textContent='Enregistrement…';
    try{
      await saveEdit(soc,code);await saveOeuvres(soc);
      closeModal();render();
      toast('Fiche « '+o.titre+' » enregistrée'+(manq.length?' · '+manq.length+' fiche songwriter créée':''));
    }catch(err){el('f-state').textContent='Échec : '+(err&&err.code?err.code:'écriture refusée');this.disabled=false;}
  };
}

/* ---------- rattacher un ayant droit à une fiche ---------- */
function modalLier(cle){
  var soc=state.societe;
  var ad=allAD(soc).filter(function(x){return x.cle===cle;})[0];
  if(!ad)return;
  openModal('<div class="eyebrow">Rapprochement</div><h2>'+esc(ad.nom)+'</h2>',
    '<div class="rowline" style="margin-bottom:10px">'+
      '<span class="pill">COAD '+esc(ad.coad||'—')+'</span>'+
      (ad.ipi?'<span class="pill">IPI '+esc(ad.ipi)+'</span>':'')+
      '<span class="pill">'+ad.oeuvres+' œuvres</span><span class="pill">'+eur(ad.net)+' € liés</span></div>'+
    '<div class="field"><label class="fl">Rattacher à la fiche</label>'+
      '<input type="search" id="l-q" placeholder="Chercher un songwriter…"></div><div id="l-res"></div>',
    '<span class="left"></span><button class="btn" id="l-cancel">Annuler</button>');
  el('l-cancel').onclick=closeModal;
  function draw(){
    var q=norm(el('l-q').value);
    var list=swList(soc).map(function(sw){
      var sc=Math.max(simil(norm(ad.nom),norm(sw.nom)),
        Math.max.apply(null,[0].concat((sw.ads||[]).map(function(x){return simil(norm(ad.nom),norm(x.nom));}))));
      return {sw:sw,sc:sc};})
      .filter(function(x){return !q||norm(x.sw.nom).indexOf(q)>=0||
        (x.sw.ads||[]).some(function(a){return norm(a.nom).indexOf(q)>=0;});})
      .sort(function(a,b){return b.sc-a.sc;}).slice(0,12);
    el('l-res').innerHTML=list.length?('<table><tbody>'+list.map(function(x){
      return '<tr><td class="l w">'+esc(x.sw.nom)+'<div class="mini">'+
        (x.sw.type==='externe'?'externe · ':'')+(x.sw.coad?'COAD '+esc(x.sw.coad):'sans COAD')+'</div></td>'+
        '<td class="num mut">'+(x.sc>0.4?Math.round(x.sc*100)+' % de proximité':'')+'</td>'+
        '<td class="l"><button class="btn sm primary" data-pick="'+esc(x.sw.id)+'">Rattacher</button></td></tr>';
      }).join('')+'</tbody></table>')
      :'<div class="mut" style="font-size:12px">Aucune fiche ne correspond. Créez-en une depuis la file de rapprochement.</div>';
    el('l-res').querySelectorAll('[data-pick]').forEach(function(b){
      b.onclick=async function(){
        var id=this.dataset.pick,sw=store.songwriters[id];
        sw.ads=(sw.ads||[]).concat([{nom:ad.nom,coad:ad.coad||'',ipi:ad.ipi||''}]);
        if(ad.ipi&&(sw.ipis||[]).indexOf(ad.ipi)<0)sw.ipis=(sw.ipis||[]).concat([ad.ipi]);
        (store.liens[soc]||(store.liens[soc]={}))[ad.cle]=id;
        try{await saveSW(sw);await saveLiens();}catch(e){}
        closeModal();render();toast('« '+ad.nom+' » rattaché à '+sw.nom);};});
  }
  el('l-q').oninput=draw;draw();
}

/* ---------- fiche songwriter ---------- */
function ficheSW(id,pre){
  var soc=state.societe;
  var sw=id?store.songwriters[id]:{id:uid('sw'),nom:(pre&&pre.nom)||'',coad:(pre&&pre.coad)||'',
    ipis:(pre&&pre.ipi)?[pre.ipi]:[],ads:(pre&&pre.nom)?[{nom:pre.nom,coad:(pre&&pre.coad)||'',ipi:(pre&&pre.ipi)||''}]:[],
    societe:soc,part:50,type:'roster',alias:[],note:''};
  if(!sw)return;
  sw.ads=sw.ads||[];sw.ipis=sw.ipis||(sw.ipi?[sw.ipi]:[]);
  var ads=sw.ads.slice();
  var st=swRows(soc).filter(function(x){return x.sw.id===sw.id;})[0];
  var TYPES=[['roster','Roster BLZante'],['externe','Externe (part récupérée)'],['artiste','Artiste non signé']];
  var body='<div class="grid2"><div>'+
    '<div class="field"><label class="fl">Nom du songwriter</label>'+
      '<input type="text" id="s-nom" value="'+esc(sw.nom||'')+'"'+(sw.source?' readonly':'')+'>'+
      (sw.source==='roster'?'<div class="hint">Profil du roster'+((sw.roles||[]).length?' · '+esc((sw.roles||[]).join(', ')):'')+
        ' — le nom se modifie dans la fiche roster.</div>'
       :sw.source==='planning'?'<div class="hint">Profil repris du Planning : ce songwriter apparaît sur des sorties '+
        'ou des posts sans avoir de fiche au roster. Le nom se modifie dans le Planning.</div>':'')+'</div>'+
    '<div class="grid2"><div class="field"><label class="fl">Statut</label><select id="s-type">'+
      TYPES.map(function(t){return '<option value="'+t[0]+'"'+((sw.type||'roster')===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label class="fl">Part d\'édition cédée à la société (%)</label>'+
      '<input type="number" id="s-part" step="0.01" min="0" max="100" value="'+(sw.part!=null?sw.part:'')+'">'+
      '<div class="hint" id="s-reste"></div></div></div>'+
    '<div class="grid2"><div class="field"><label class="fl">COAD Sacem (unique)</label>'+
      '<input type="text" id="s-coad" value="'+esc(sw.coad||'')+'" placeholder="ex. 689951"></div>'+
      '<div class="field"><label class="fl">Société</label><select id="s-soc">'+
      SOCIETES.map(function(x){return '<option value="'+x.id+'"'+((sw.societe||soc)===x.id?' selected':'')+'>'+esc(x.nom)+'</option>';}).join('')+
      '</select></div></div>'+
    '<div class="field"><label class="fl">Codes IPI (un par ligne, plusieurs possibles)</label>'+
      '<textarea id="s-ipis" placeholder="686525602">'+esc((sw.ipis||[]).join('\n'))+'</textarea></div>'+
    '<div class="field"><label class="fl">Pseudonymes et autres noms</label>'+
      '<textarea id="s-alias" placeholder="Un nom par ligne">'+esc((sw.alias||[]).join('\n'))+'</textarea></div>'+
    '<div class="field"><label class="fl">Note</label><textarea id="s-note">'+esc(sw.note||'')+'</textarea></div>'+
    '</div><div>'+
    '<div class="field"><label class="fl">Ayants droit rattachés à ce profil</label><div id="s-ads"></div>'+
      '<div class="rowline" style="margin-top:8px"><input type="search" id="s-search" placeholder="Chercher un ayant droit du catalogue…"></div>'+
      '<div id="s-sugg"></div>'+
      '<div class="hint">Un même songwriter peut déposer sous plusieurs identités : rattachez-les toutes ici, '+
      'leurs œuvres et leurs revenus se cumulent sur cette fiche.</div></div>'+
    (st?'<div class="field"><label class="fl">Sur ce catalogue</label><div class="rowline">'+
      '<span class="pill">'+st.oeuvres+' œuvres</span><span class="pill">'+eur(st.net)+' € attribués</span>'+
      '<span class="pill">'+pv(st.moyPh)+' % de phono en moyenne</span>'+
      '<span class="pill mut">'+pv(st.moyDep)+' % de DEP en moyenne</span></div></div>':'')+
    '<div class="field"><label class="fl">Œuvres liées</label><div id="s-oeuvres" class="tscroll"></div></div>'+
    '<div class="field" id="s-plan-wrap" hidden><label class="fl">Sorties au Planning</label>'+
      '<div id="s-plan" class="tscroll"></div></div>'+
    '</div></div>';
  openModal('<div class="eyebrow">Songwriter</div><h2>'+esc(sw.nom||'Nouvelle fiche')+'</h2>',body,
    (id?'<button class="btn left" id="s-del">Supprimer</button>':'<span class="left"></span>')+
    '<span class="mut" id="s-state"></span><button class="btn" id="s-cancel">Annuler</button>'+
    '<button class="btn primary" id="s-save">Enregistrer</button>','wide');

  function drawAds(){
    el('s-ads').innerHTML=ads.length?('<table><tbody>'+ads.map(function(a,i){
      return '<tr><td class="l w">'+esc(a.nom)+'</td><td class="l mut num">'+esc(a.coad||'—')+'</td>'+
        '<td class="l mut num">'+esc(a.ipi||'')+'</td>'+
        '<td class="l"><button class="btn sm" data-rmad="'+i+'">Retirer</button></td></tr>';}).join('')+'</tbody></table>')
      :'<div class="mut" style="font-size:12px">Aucun ayant droit rattaché pour l\'instant.</div>';
    el('s-ads').querySelectorAll('[data-rmad]').forEach(function(b){
      b.onclick=function(){ads.splice(+this.dataset.rmad,1);drawAds();drawSugg();};});
  }
  // Tous les noms connus du profil : son nom, ses pseudonymes saisis dans le formulaire,
  // et les ayants droit déjà rattachés. Un artiste déposant sous son nom civil se retrouve ainsi.
  function nomsConnus(){
    var t=el('s-alias'),al=t?t.value.split('\n'):(sw.alias||[]);
    var n=el('s-nom'),nom=n?n.value:(sw.nom||'');
    return [nom].concat(al).concat(ads.map(function(a){return a.nom;}))
      .map(norm).filter(function(x,i,arr){return x&&arr.indexOf(x)===i;});
  }
  function score(nom){
    var n=norm(nom),noms=nomsConnus(),best=0;
    noms.forEach(function(c){
      var sc=simil(c,n);
      // un nom de scène tient parfois dans le nom civil : « LE SERI » dans « SERI YANNICK ZADI »
      var mots=c.split(' ').filter(function(w){return w.length>2;});
      var dans=mots.length&&mots.every(function(w){return n.indexOf(w)>=0;});
      if(dans)sc=Math.max(sc,0.62);
      if(sc>best)best=sc;});
    return best;
  }
  function drawSugg(){
    var q=norm(el('s-search').value),pris={};
    ads.forEach(function(a){pris[adKey(a)]=1;});
    var list=allAD(soc).filter(function(a){
      if(pris[a.cle])return false;
      if(!q)return score(a.nom)>0.5;
      return norm(a.nom).indexOf(q)>=0||String(a.coad).indexOf(q)>=0;})
      .map(function(a){a._sc=score(a.nom);return a;})
      .sort(function(x,y){return (y._sc-x._sc)||(y.net-x.net);}).slice(0,10);
    el('s-sugg').innerHTML=list.length?('<table><tbody>'+list.map(function(a){
      return '<tr><td class="l">'+esc(a.nom)+
        (a._sc>0.5?'<div class="mini">'+Math.round(a._sc*100)+' % de proximité</div>':'')+'</td>'+
        '<td class="l mut num">'+esc(a.coad||'—')+'</td>'+
        '<td class="num mut">'+a.oeuvres+' œ.</td><td class="num mut">'+eur(a.net,0)+' €</td>'+
        '<td class="l"><button class="btn sm" data-addad="'+esc(a.cle)+'">Rattacher</button></td></tr>';}).join('')+'</tbody></table>')
      :(q?'<div class="mut" style="font-size:12px">Aucun ayant droit ne correspond.</div>'
         :'<div class="mut" style="font-size:12px">Aucune proximité automatique — ajoutez le nom civil '+
          'en pseudonyme ci-dessous, ou cherchez-le ci-dessus.</div>');
    el('s-sugg').querySelectorAll('[data-addad]').forEach(function(b){
      b.onclick=function(){
        var a=allAD(soc).filter(function(x){return x.cle===this.dataset.addad;},this)[0];
        if(a){ads.push({nom:a.nom,coad:a.coad||'',ipi:a.ipi||''});
          if(a.ipi){var t=el('s-ipis');if(t.value.indexOf(a.ipi)<0)t.value=(t.value?t.value.replace(/\s*$/,'')+'\n':'')+a.ipi;}
          if(!el('s-coad').value&&a.coad)el('s-coad').value=a.coad;}
        drawAds();drawSugg();};});
  }
  drawAds();drawSugg();
  el('s-search').oninput=drawSugg;
  if(el('s-alias'))el('s-alias').oninput=drawSugg;
  if(el('s-nom')&&!el('s-nom').readOnly)el('s-nom').oninput=drawSugg;
  function drawReste(){
    var v=el('s-part').value===''?null:+el('s-part').value;
    el('s-reste').innerHTML=v==null?'Non renseignée.'
      :(v>=100?'Édition intégrale par '+esc(socNom(el('s-soc').value))+'.'
      :'<b>'+pv(v)+' %</b> à '+esc(socNom(el('s-soc').value))+' · <b>'+pv(100-v)+
        ' %</b> conservés par le songwriter ou un autre éditeur.');
  }
  el('s-part').oninput=drawReste;el('s-soc').onchange=drawReste;drawReste();

  var O=store.oeuvres[soc]||{},liste=[],parCode={};
  rows(soc).forEach(function(r){parCode[r.code]=r;});
  Object.keys(O).forEach(function(c){
    var m=auteurs(O[c]).filter(function(x){
      return ads.some(function(a){return adKey(a)===adKey(x);})||
        (sw.coad&&String(x.coad)===String(sw.coad))||(sw.nom&&norm(x.nom)===norm(sw.nom));})[0];
    if(!m)return;
    var r=parCode[c],mien=r&&r.sw.filter(function(x){return x.id===sw.id;})[0];
    liste.push({titre:O[c].titre,ph:m.ph||0,dep:m.dep||0,dr:m.dr||0,
      socPh:(O[c].soc&&O[c].soc.ph)||0,
      pt:mien?mien.pt:null,mien:mien?mien.net:null,net:O[c].net||0});});
  liste.sort(function(a,b){return b.net-a.net;});
  el('s-oeuvres').innerHTML=liste.length?('<table><thead><tr><th class="l">Œuvre</th>'+
    '<th class="num">Son phono</th><th class="num">Notre phono</th><th class="num">Ses points</th>'+
    '<th class="num">Ses revenus €</th><th class="num">Revenus œuvre €</th></tr></thead><tbody>'+
    liste.slice(0,15).map(function(x){
      return '<tr><td class="l">'+esc(x.titre)+'</td>'+
        '<td class="num ph">'+pv(x.ph)+' %<div class="mini">'+pv(x.dep)+' % DEP</div></td>'+
        '<td class="num'+(x.socPh?'':' mut')+'">'+(x.socPh?pv(x.socPh)+' %':'·')+'</td>'+
        '<td class="num'+(x.pt?'':' mut')+'">'+(x.pt?pv(x.pt):'·')+'</td>'+
        '<td class="num'+(x.mien?' w':' mut')+'">'+(x.mien?eur(x.mien):'·')+'</td>'+
        '<td class="num mut">'+eur(x.net)+'</td></tr>';}).join('')+'</tbody></table>'+
    (liste.length>15?'<div class="hint">'+(liste.length-15)+' autres œuvres</div>':'')+
    '<div class="hint">« Son phono » est sa part au dépôt, « notre phono » celle de '+esc(socNom(soc))+
    ' sur l\'œuvre. Ses points en sont la fraction qui lui est attribuée, d\'où ses revenus.</div>')
    :'<span class="mut" style="font-size:12px">Aucune œuvre au catalogue pour cette identité.</span>';

  var sorties=sortiesDe(sw);
  if(sorties.length){
    el('s-plan-wrap').hidden=false;
    el('s-plan').innerHTML='<table><thead><tr><th class="l">Sortie</th><th class="l">Artiste</th>'+
      '<th class="l">Date</th><th class="l">Statut</th></tr></thead><tbody>'+
      sorties.slice(0,8).map(function(r){
        return '<tr><td class="l">'+esc(r.track||r.title||'')+'</td><td class="l mut">'+esc(r.artist||'')+'</td>'+
          '<td class="l mut num">'+esc(r.date||r.dateSortable||'')+'</td>'+
          '<td class="l mut">'+esc(r.status||'')+'</td></tr>';}).join('')+'</tbody></table>'+
      (sorties.length>8?'<div class="hint">'+(sorties.length-8)+' autres sorties</div>':'');
  }
  el('s-cancel').onclick=closeModal;
  if(id&&el('s-del'))el('s-del').onclick=async function(){
    if(!confirm('Supprimer la fiche « '+(sw.nom||'')+' » ?'))return;
    delete store.songwriters[sw.id];
    var L=store.liens[soc]||{};Object.keys(L).forEach(function(k){if(L[k]===sw.id)delete L[k];});
    try{await delSW(sw.id);await saveLiens();}catch(e){}
    closeModal();render();toast('Fiche supprimée');};
  el('s-save').onclick=async function(){
    var nom=el('s-nom').value.trim();
    if(!nom){el('s-state').textContent='Le nom est obligatoire';return;}
    sw.nom=nom;sw.part=el('s-part').value===''?null:+el('s-part').value;
    sw.societe=el('s-soc').value;sw.coad=el('s-coad').value.trim();sw.type=el('s-type').value;
    sw.ipis=el('s-ipis').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    sw.alias=el('s-alias').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    sw.note=el('s-note').value.trim();sw.ads=ads;
    store.songwriters[sw.id]=sw;
    var L=store.liens[soc]||(store.liens[soc]={});
    ads.forEach(function(a){L[adKey(a)]=sw.id;});
    this.disabled=true;el('s-state').textContent='Enregistrement…';
    try{await saveSW(sw);await saveLiens();closeModal();render();toast('Fiche « '+nom+' » enregistrée');}
    catch(err){el('s-state').textContent='Échec : '+(err&&err.code?err.code:'écriture refusée');this.disabled=false;}
  };
}
