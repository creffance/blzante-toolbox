<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogues — BLZante Toolbox</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&display=swap');
:root{
  --paper:#0d0d0d; --surface:#141414; --surface-2:#1a1a1a; --surface-3:#242424;
  --ink:#f0ede6; --ink-2:#a8a49c; --ink-3:#777;
  --line:#2a2a2a; --line-2:#3a3a3a;
  --accent:#e8c547; --accent-ink:#0d0d0d; --accent-soft:#2b2510;
  --pos:#7bc47f; --neg:#e07a75; --warn:#e8a03c; --warn-soft:#2e2413;
  --shadow:none;
  --mono:'Syne Mono',ui-monospace,monospace;
  --sans:'Syne',system-ui,sans-serif;
  --disp:'Syne',system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
 min-height:100vh;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
 background-size:60px 60px}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 40px;
 border-bottom:1px solid var(--line);position:relative;z-index:1}
.nav-logo{font-family:var(--disp);font-size:1.4rem;font-weight:800;color:#fff;text-decoration:none;
 letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.nav-logo-img{height:28px;width:auto;display:block}
.nav-right{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:.65rem;color:var(--ink-3);
 letter-spacing:.14em;text-transform:uppercase}
.nav-right a{color:var(--ink-3);text-decoration:none}
.nav-right a:hover{color:var(--ink)}
.nav-sep{color:var(--line-2)}
.deco{background:none;border:1px solid var(--line);color:var(--ink-3);font-family:var(--mono);font-size:.55rem;
 padding:4px 10px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase}
.deco:hover{border-color:#555;color:#fff}
footer.tb{border-top:1px solid var(--line);padding:14px 40px;display:flex;align-items:center;
 justify-content:space-between;gap:12px;position:relative;z-index:1;font-family:var(--mono);font-size:.6rem;
 letter-spacing:.08em;color:var(--ink-3)}
.wrap{position:relative;z-index:1;flex:1;max-width:1360px;width:100%;margin:0 auto;
 padding-inline:40px;padding-block:26px 40px}
@media(max-width:600px){nav,footer.tb{padding-left:24px;padding-right:24px}.wrap{padding-inline:24px}}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.mut{color:var(--ink-3)}
.w{font-weight:600}
a{color:var(--accent)}

.top{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;
 padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:11px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.stateline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 0 0;font-size:12px;color:var(--ink-2)}
.stateline b{font-family:var(--mono);color:var(--ink);font-weight:600}
.dotsep{color:var(--line-2)}

button,select,input,textarea{font-family:inherit}
.btn{font:500 12.5px/1 var(--sans);padding:8px 12px;border:1px solid var(--line-2);background:var(--surface);
 color:var(--ink-2);border-radius:4px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{font:500 12px/1 var(--sans);padding:7px 11px;border:1px solid var(--line-2);background:var(--surface);
 color:var(--ink-2);border-radius:4px;cursor:pointer;transition:.12s}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip:hover{border-color:var(--accent)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],select,textarea{
 font:400 13px/1.3 var(--sans);padding:7px 9px;border:1px solid var(--line-2);border-radius:4px;
 background:var(--surface);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:52px}
label.fl{display:block;font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
 color:var(--ink-3);margin-bottom:5px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:2px;margin:18px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:600 12.5px/1 var(--sans);padding:10px 14px;border:0;background:transparent;color:var(--ink-3);
 cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:1px;background:var(--line);
 border:1px solid var(--line);margin-bottom:20px}
.kpi{background:var(--surface);padding:13px 14px 14px}
.kpi .k{font:600 10px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;margin-top:6px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.kpi.lead{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.kpi.lead .v{color:var(--accent)}
a.kpi-lien{color:inherit;text-decoration:none;cursor:pointer;display:block}
a.kpi-lien:hover{background:var(--surface-2)}
a.kpi-lien .k::after{content:' ›';color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);margin-bottom:18px}
.phead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;
 padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.phead .note{font-size:11.5px;color:var(--ink-3);max-width:70ch}
.pbody{padding:14px}
.split{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}
.modal.wide{width:min(1500px,100%)}
/* splits et ventilation : tout doit tenir dans la largeur, sans défilement horizontal */
#aut-head th,#aut-body td,#vent th,#vent td{padding:6px 7px;font-size:12px}
.t-oeuvres{table-layout:auto}
.t-oeuvres td,.t-oeuvres th{padding:7px 8px}
.t-oeuvres td.l,.t-oeuvres th.l{white-space:normal}
.t-oeuvres td .mini{white-space:normal;line-height:1.35}
.t-oeuvres td:first-child{min-width:230px}
#aut-body td.l,#vent td.l,#aut-head th.l{white-space:normal}
#aut-body td .mini,#vent td .mini{white-space:normal;line-height:1.3}
#aut-body input[type=number],#vent input[type=number]{width:64px!important;padding:4px 5px}
#aut-body input[type=checkbox]{margin:0}
#vent .tscroll,#aut-body{overflow-x:visible}
.modal.wide .split{grid-template-columns:minmax(280px,.82fr) minmax(0,1.5fr);gap:22px}
.modal.wide .grid2{grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:22px}
@media(max-width:980px){.split{grid-template-columns:1fr}}

.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:600 10px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
th.l,td.l{text-align:left}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr.clickable{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--line-2);border-bottom:0;background:var(--surface-2)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.car{font-size:9px;color:var(--accent)}
.bar{display:block;height:4px;border-radius:2px;background:var(--accent);margin-top:3px}
.mini{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}

.tag{display:inline-block;font:600 10px/1.7 var(--sans);letter-spacing:.04em;padding:0 6px;border-radius:3px;
 background:var(--surface-3);color:var(--ink-2);text-transform:uppercase;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.neutral{background:var(--surface-3);color:var(--ink-3)}
.tag.ko{background:rgba(224,122,117,.16);color:var(--neg)}
.swlist{display:flex;flex-wrap:wrap;gap:4px}
.swtag{display:inline-flex;align-items:center;gap:5px;font:500 11px/1.7 var(--sans);padding:0 7px;border-radius:3px;
 background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.swtag b{font-family:var(--mono);font-size:10.5px}
.ext{width:13px;height:13px;border-radius:3px;display:inline-block;flex:none}
.ext.sp{background:#1db954}.ext.yt{background:#ff0000}

.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty h2{margin-bottom:8px}
.empty p{max-width:58ch;margin:0 auto 16px;color:var(--ink-3)}

.scrim{position:fixed;inset:0;background:rgba(10,14,16,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
 width:min(1040px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;
 border-bottom:1px solid var(--line)}
.modal .body{padding:16px;overflow:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);
 background:var(--surface-2);flex-wrap:wrap}
.modal footer .left{margin-right:auto}
.x{border:0;background:transparent;font-size:19px;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 6px}

.drop{border:1.5px dashed var(--line-2);border-radius:6px;padding:24px 18px;text-align:center;background:var(--surface-2);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:6px 0 0;color:var(--ink-3);font-size:12px}
.filelist{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.filerow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;
 border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12.5px}
.prog{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
 font:500 12.5px/1.4 var(--sans);padding:9px 14px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .15s;
 z-index:70;max-width:min(560px,90vw)}
#toast.on{opacity:1}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.sep{height:1px;background:var(--line);margin:14px 0}
.rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.track{display:flex;gap:12px;align-items:flex-start}
.cover{width:104px;height:104px;flex:none;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);
 display:grid;place-items:center;overflow:hidden;font-size:10px;text-align:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.trackf{flex:1;min-width:0}
.trackf .field{margin-bottom:8px}
.note-it{border-left:2px solid var(--line-2);padding:2px 0 6px 9px;margin-bottom:8px;font-size:12.5px}
.note-it .mini{margin-bottom:2px}
tr.nous td{background:var(--accent-soft)}
tr.nous td.ph{color:var(--accent);font-weight:600}
tr.nous td.l{font-weight:600}
.vent-faux{border:1px solid var(--neg);border-radius:4px;padding:8px;background:rgba(224,122,117,.06)}
.alerte-ko{border-left-color:var(--neg);background:rgba(224,122,117,.1)}
.repbande{display:flex;flex-direction:column;gap:10px}
.repan{border-top:1px solid var(--line);padding-top:7px}
.repan-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
 font:600 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
.repan-t b{color:var(--ink);font-size:12px}
.repan-t span{color:var(--ink-2)}
.reptuiles{display:flex;flex-wrap:wrap;gap:6px}
.reptuile{position:relative;overflow:hidden;flex:0 0 auto;min-width:86px;padding:6px 9px 8px;
 border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.rt-n{font:600 10px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.06em}
.rt-p{font:500 10px/1.4 var(--mono);color:var(--ink-3);text-transform:lowercase}
.rt-v{font:600 12.5px/1.5 var(--sans);color:var(--ink);white-space:nowrap}
.rt-b{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);display:block}
.lecture{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-size:13px}
.feats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.feat-l{display:inline-flex;align-items:center;gap:2px}
.feat-l input{width:170px}
.rl{display:inline-block;min-width:34px;font:600 10.5px/1.5 var(--mono);letter-spacing:.04em;
 padding:1px 5px;border-radius:3px;background:var(--surface-3);color:var(--ink-2);text-align:center}
.rl.arr{background:#2a1d3a;color:#c9a6f0;border:1px solid #4a3763}
.rl.ed{background:var(--surface-2);color:var(--ink-3)}
tr.yr td{background:var(--surface-2)}
tr.grp td{background:var(--surface-2);font:600 10px/1.3 var(--sans);letter-spacing:.07em;
 text-transform:uppercase;color:var(--ink-3);padding-top:9px;padding-bottom:9px}
td.ph{font-weight:600}
td.sec,th.sec{font-size:11.5px}
/* vignettes */
.thumb{display:inline-block;flex:none;border-radius:3px;background:var(--surface-3);overflow:hidden;
 border:1px solid var(--line);vertical-align:middle}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tt{display:inline-flex;align-items:center;gap:10px;min-width:0}
/* barres horizontales : un seul ton, valeur au bout, détail au survol */
.bl{display:flex;flex-direction:column;gap:7px}
.bl-r{display:grid;grid-template-columns:minmax(80px,1.1fr) 2fr auto 52px;gap:10px;align-items:center;
 font-size:12.5px;padding:2px 0;border-radius:3px;outline:none}
.bl-r:hover,.bl-r:focus-visible{background:var(--surface-2)}
.bl-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-t{height:8px;display:block}
.bl-t i{display:block;height:8px;background:var(--accent);border-radius:0 4px 4px 0}
.bl-t i.autre{background:var(--ink-3)}
.bl-v{text-align:right;white-space:nowrap}
.bl-p{text-align:right;font-size:11px;white-space:nowrap}
#tip{position:fixed;z-index:80;display:none;max-width:300px;background:var(--surface-3);color:var(--ink);
 border:1px solid var(--line-2);border-radius:5px;padding:8px 10px;font-size:12px;line-height:1.5;
 box-shadow:0 10px 30px -10px rgba(0,0,0,.6);pointer-events:none}
/* pages et fil d'Ariane */
.crumb{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin:2px 0 12px}
.crumb a{color:var(--ink-2);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.crumb b{color:var(--ink);font-weight:600}
.phead-page{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.h-page{font-family:var(--disp);font-size:24px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px;align-items:start}
.grid3 .panel{margin-bottom:0}
@media (max-width:1100px){.grid3{grid-template-columns:1fr}}
/* recherche de l'en-tête */
.gq{position:relative;flex:1;min-width:200px;max-width:320px}
.gq input{width:100%}
.gq-res{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:var(--surface);
 border:1px solid var(--line-2);border-radius:6px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);
 padding:6px;max-height:70vh;overflow:auto;min-width:340px}
.gq-g{font:600 10px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px 5px}
.gq-res a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:4px;color:var(--ink);
 text-decoration:none;font-size:12.5px}
.gq-res a .mini{display:block;margin-top:1px}
.gq-res a:hover,.gq-res a.on{background:var(--surface-2)}
.gq-vide{padding:10px;color:var(--ink-3);font-size:12px}
.evo{width:100%;height:auto;display:block;margin:0 0 10px;overflow:visible}
tr.sel td{background:var(--accent-soft)}
.delta{white-space:nowrap;font-family:var(--mono);font-size:12px}
.plan-box{display:flex;flex-direction:column;gap:6px}
.nonsorti{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;cursor:pointer}
.plan-carte{display:flex;gap:10px;align-items:center;min-width:0}
.plan-choix.deja{border-color:var(--warn)}
.plan-choix{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 8px;
 border:1px solid var(--line);border-radius:4px}
.pc-oe{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pc-res{width:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.soc-diff{color:var(--warn)}
.stot td{background:var(--surface-2);font-weight:600;font-size:12px;border-top:1px solid var(--line-2)}
.stot-g td{border-top:1px solid var(--ink-3)}
.tot-ok{color:var(--ink)}
td.tot-ko,span.tot-ko{color:var(--warn)}
tr.tot-faux td{background:var(--warn-soft)}
.alerte{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 10px;
 font-size:12.5px;margin:4px 0 10px;border-radius:0 4px 4px 0}
.rang{display:inline-block;min-width:22px;color:var(--ink-3);font:500 11px var(--mono)}
.pager{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pager .mut{margin-right:8px;font-size:12px}
.filtres{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 14px}
.filtres label{display:flex;gap:8px;align-items:center;font:600 10.5px/1 var(--sans);letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink-3)}
.filtres select{min-width:200px;text-transform:none;letter-spacing:0;font-weight:400}
.ck{display:inline-block;width:18px;text-align:center;font-weight:700}
.ck.ok{color:var(--ink-3)}.ck.ko{color:var(--warn)}.ck.na{color:var(--line-2)}
th.ckh{text-align:center;font-size:9.5px;padding-left:4px;padding-right:4px}
td.ckc{text-align:center;padding-left:4px;padding-right:4px}
.meter{display:inline-block;width:160px;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ckbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;margin:-4px 0 18px;
 border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12.5px}

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  var head=text.slice(0,4000),cnt={';':0,',':0,'\t':0};
  head.split('\n').slice(0,5).forEach(function(l){Object.keys(cnt).forEach(function(d){cnt[d]+=l.split(d).length-1;});});
  var dl=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];})[0]||';';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===dl){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c!=='\r')cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  rows=rows.filter(function(r){return r.some(function(c){return String(c).trim()!=='';});});
  if(!rows.length)return {head:[],rows:[]};
  return {head:rows[0].map(function(h){return String(h).trim();}),rows:rows.slice(1)};
}

function rangRole(r){
  var l=String(r||'').split(/[\/,\s]+/).filter(Boolean);
  var a=l.indexOf('A')>=0||l.indexOf('AC')>=0,c=l.indexOf('C')>=0||l.indexOf('AC')>=0;
  var ar=l.some(function(x){return x==='AR'||x==='ARR'||x==='ADA';});
  if(a&&c)return 1;
  if(a)return 0;
  if(c)return 2;
  if(ar)return 3;
  if(l.some(function(x){return x==='E'||x==='SE'||x==='CE';}))return 4;
  return 5;
}
function libRole(r){
  var l=String(r||'').split(/[\/,\s]+/).filter(Boolean);
  if(l.indexOf('AC')>=0||(l.indexOf('A')>=0&&l.indexOf('C')>=0)){

  return l.map(function(x){return x==='AR'||x==='ADA'?'ARR':x;}).join('/')||'—';
}

}

/* ---------------- Firebase Realtime Database de la Toolbox ----------------

var FBCFG=window.BLZ_FIREBASE||{apiKey:"AIzaSyBuwwcRdlxLf7-ZdmUAi0ajB5uL3y-m800",
  authDomain:"blzante-toolbox.firebaseapp.com",
  databaseURL:"https://blzante-toolbox-default-rtdb.europe-west1.firebasedatabase.app",

var FBDB=FBCFG.databaseURL, FBTOKEN='', FBUSER=null;
function fbRoot(){return (window.BLZ_PATH||'editions').replace(/^\/+|\/+$/g,'');}
async function fbToken(force){
  try{
    var u=FBUSER||(typeof firebase!=='undefined'&&firebase.auth&&firebase.auth().currentUser);
    if(u){FBUSER=u;FBTOKEN=await u.getIdToken(!!force);window._fbToken=FBTOKEN;}
  }catch(e){}
  return FBTOKEN;
}
async function dbFetch(path,opts){
  if(window.dbFetch&&window.dbFetch!==dbFetch)return window.dbFetch(path,opts);
  var sep=path.indexOf('?')>=0?'&':'?';
  var r=await fetch(FBDB+path+sep+'auth='+FBTOKEN,opts);
  if(r.status===401||r.status===403){                    // jeton périmé : on le renouvelle et on rejoue
    var t=await fbToken(true);
    if(t)r=await fetch(FBDB+path+sep+'auth='+t,opts);
  }
  return r;
}
async function fbMsg(r){
  var t='';
  try{var j=await r.clone().json();t=(j&&(j.error||j.message))||'';}catch(e){}
  if(!t){try{t=String(await r.text()).slice(0,140);}catch(e){}}
  return r.status+(t?' — '+t:'');
}
async function initFirebase(){
  if(location.protocol==='file:')return false;                  // fichier ouvert en local
  if(window._fbToken){FBTOKEN=window._fbToken;return true;}      // jeton déjà posé par la Toolbox
  if(typeof firebase==='undefined'||!firebase.auth)return false;
  if(!firebase.apps.length)firebase.initializeApp(FBCFG);
  var u=await new Promise(function(res){
    var fini=false;
    firebase.auth().onAuthStateChanged(function(user){if(!fini){fini=true;res(user||null);}});
    setTimeout(function(){if(!fini){fini=true;res(null);}},4000);
  });
  if(!u)return false;
  FBUSER=u;FBTOKEN=await u.getIdToken();window._fbToken=FBTOKEN;
  return true;
}
function clean(o){return JSON.parse(JSON.stringify(o===undefined?null:o));}

var SW_RENAME={'LEANDRE':'LEANDRE PICK','YANNICK SERI':'LE SERI','BRO':'BRÖ'};
async function chargerRoster(){
  var r=await dbFetch('/roster.json');
  if(!r.ok)throw new Error('roster illisible ('+r.status+')');
  var data=await r.json();
  if(!data)return [];
  return Object.keys(data).map(function(k){var a=data[k]||{};a.id=a.id||k;a._key=k;return a;})
    .filter(function(a){
      var tp=a.types?(Array.isArray(a.types)?a.types:[a.types]):[];
      return tp.indexOf('Auteur')>=0||tp.indexOf('Compositeur')>=0||tp.indexOf('Topliner')>=0;})
    .sort(function(a,b){return (a.name||'').localeCompare(b.name||'','fr');});
}

// Même personne écrite deux fois ? On ne fusionne d'office que les cas sûrs : même nom,
// ou mêmes mots à un prénom abrégé près (« SEB ROUSSELET » / « SEBASTIEN ROUSSELET »).
// Un nom de famille partagé ne suffit pas : Gabriel et Hadrien Mabilat restent deux fiches.
function memePersonne(x,y){
  var a=norm(x),b=norm(y);
  if(!a||!b)return false;
  if(a===b)return true;
  var ta=a.split(' '),tb=b.split(' ');
  if(ta.length!==tb.length||ta.length<2)return false;
  var libres=tb.slice(),exact=0;
  for(var i=0;i<ta.length;i++){
    var w=ta[i],j=libres.indexOf(w);
    if(j>=0){libres.splice(j,1);if(w.length>=4)exact++;continue;}
    j=-1;
    for(var k=0;k<libres.length;k++){var v=libres[k];
      if(w.length>=3&&v.length>=3&&(w.indexOf(v)===0||v.indexOf(w)===0)){j=k;break;}}
    if(j<0)return false;
    libres.splice(j,1);
  }
  return exact>=1;
}
// Certains songwriters n'ont pas de fiche artiste au Roster : ils n'apparaissent que sur
// les sorties et les posts du Planning. On leur fabrique un profil à partir de ces noms,
// sauf s'ils désignent quelqu'un qui a déjà sa fiche.
function fusionPlanning(){
  var n=0,existants=Object.keys(store.songwriters).map(function(k){return store.songwriters[k];});
  var trouve=function(nom){
    for(var i=0;i<existants.length;i++){var x=existants[i];
      if(memePersonne(nom,x.nom))return x;
      if((x.alias||[]).some(function(al){return memePersonne(nom,al);}))return x;}
    return null;};
  PLANNING.forEach(function(r){

// La base des songwriters de l'outil : Roster × Planning, moins les exclusions, plus les ajouts.

/* ---------- doublons entre Roster, Planning et fiches de l'outil ---------- */
// store.fusions : { idAbsorbé : idConservé }. La fiche absorbée disparaît, son nom
// devient un pseudonyme de celle qu'on garde, avec ses IPI et ses ayants droit.
function appliquerFusions(){
  var F=store.fusions||{};
  Object.keys(F).forEach(function(k){
    var src=store.songwriters[k],cib=store.songwriters[F[k]];
    if(!src)return;
    if(!cib){delete F[k];return;}
    var al=(cib.alias||[]).slice();
    [src.nom].concat(src.alias||[]).forEach(function(n){
      if(n&&norm(n)!==norm(cib.nom)&&al.map(norm).indexOf(norm(n))<0)al.push(n);});
    cib.alias=al;
    (src.ipis||[]).forEach(function(i){if((cib.ipis||[]).indexOf(i)<0)cib.ipis=(cib.ipis||[]).concat([i]);});
    (src.ads||[]).forEach(function(a){
      if(!(cib.ads||[]).some(function(b){return adKey(b)===adKey(a);}))cib.ads=(cib.ads||[]).concat([a]);});
    if(!cib.coad&&src.coad)cib.coad=src.coad;
    delete store.songwriters[k];
  });
}
function mots(n){return norm(n).split(' ').filter(function(w){return w.length>=4;});}
function pairCle(a,b){return [a,b].sort().join('|');}
function doublons(soc){
  var L=swList(soc),out=[],vu={};
  for(var i=0;i<L.length;i++)for(var j=i+1;j<L.length;j++){
    var a=L[i],b=L[j],cle=pairCle(a.id,b.id);
    if(vu[cle]||store.ecartes[cle])continue;
    var na=norm(a.nom),nb=norm(b.nom);
    if(!na||!nb)continue;
    var ma=mots(a.nom),mb=mots(b.nom);
    var communs=ma.filter(function(w){return mb.indexOf(w)>=0;});
    // « SEB » et « SEBASTIEN » : un prénom abrégé reste un préfixe de l'autre
    var prefixe=norm(a.nom).split(' ').some(function(w){
      return norm(b.nom).split(' ').some(function(v){
        return w!==v&&w.length>=3&&v.length>=3&&(w.indexOf(v)===0||v.indexOf(w)===0);});});
    var sc=simil(na,nb);
    var motif=communs.length?'nom commun : '+communs.join(', ')
      :prefixe?'prénom abrégé'
      :sc>=0.72?Math.round(sc*100)+' % de proximité':'';
    if(!motif)continue;
    // on garde de préférence le nom de travail : Roster, puis Planning, puis fiche de l'outil
    var rang=function(x){return x.source==='roster'?0:x.source==='planning'?1:2;};
    var inverse=rang(b)<rang(a);
    vu[cle]=1;out.push({a:inverse?b:a,b:inverse?a:b,cle:cle,motif:motif,sc:sc});
  }
  return out.sort(function(x,y){return y.sc-x.sc;});
}

function isRepartition(head){

// Chaque œuvre garde ses revenus répartition par répartition, avec leur détail
// (famille d'exploitation, type d'utilisation, pays). Réimporter une répartition
// remplace sa part au lieu de s'y ajouter ; les totaux s'en déduisent.
function cleDB(k){return String(k==null?'':k).replace(/[.$#\[\]\/]/g,' ').replace(/\s+/g,' ').trim()||'—';}
// Les œuvres chargées d'une base antérieure reçoivent leur découpage par répartition.
function preparerOeuvres(){
  Object.keys(store.oeuvres||{}).forEach(function(so){var O=store.oeuvres[so]||{};
    Object.keys(O).forEach(function(c){if(O[c]&&!O[c].r)migrerRevenus(O[c]);});});
}
function migrerRevenus(o){
  if(o.r||!(o.net||o.de||o.dr||o.ph))return;
  o.r={};
  var reps=o.reps||{},som=Object.keys(reps).reduce(function(s2,k){return s2+(reps[k]||0);},0);
  Object.keys(reps).forEach(function(k){var q=som?reps[k]/som:0;
    o.r[k]={n:reps[k],de:(o.de||0)*q,dr:(o.dr||0)*q,ph:(o.ph||0)*q};});
  var reste=(o.net||0)-som;
  if(Math.abs(reste)>0.005)o.r['?']={n:reste,de:0,dr:0,ph:0};
}
function deriver(o){
  var R=o.r||{};
  o.net=0;o.de=0;o.dr=0;o.ph=0;o.ans={};o.reps={};o.fam={};o.typ={};o.pays={};o.famTyp={};o.detail=0;
  Object.keys(R).forEach(function(k){var x=R[k]||{};
    o.net+=x.n||0;o.de+=x.de||0;o.dr+=x.dr||0;o.ph+=x.ph||0;
    if(/^\d+$/.test(k)){var an=String(repDate(k).an);
      o.reps[k]=(o.reps[k]||0)+(x.n||0);o.ans[an]=(o.ans[an]||0)+(x.n||0);}
    if(x.f){o.detail+=x.n||0;
      ['f','t','p'].forEach(function(c){var d=x[c]||{},cib=c==='f'?o.fam:c==='t'?o.typ:o.pays;
        Object.keys(d).forEach(function(m){cib[m]=(cib[m]||0)+d[m];});});
      Object.keys(x.ft||{}).forEach(function(m){var i=m.indexOf('|'),f=m.slice(0,i),t=m.slice(i+1);
        var d=o.famTyp[f]||(o.famTyp[f]={});d[t]=(d[t]||0)+x.ft[m];});}
  });
  ['net','de','dr','ph','detail'].forEach(function(c){o[c]=Math.round(o[c]*100)/100;});
}
function importRepartition(soc,head,rws){
  var ic=colIndex(head,"Code de l'oeuvre"),it=colIndex(head,"Titre de l'oeuvre"),
      inet=colIndex(head,'Mes droits en NET (Euros)'),ir=colIndex(head,'Rion paiement'),
      ide=colIndex(head,'Montant DE (Euros)'),idr=colIndex(head,'Montant DR (Euros)'),
      iph=colIndex(head,'Montant Phono (Euros)'),ifa=colIndex(head,'Familles'),
      ity=colIndex(head,"Types d'utilisation"),ipa=colIndex(head,'Pays');
  if(ic<0||inet<0||ir<0)throw new Error('colonnes de répartition introuvables');
  var O=store.oeuvres[soc]||(store.oeuvres[soc]={}),reps={},n=0,dansFichier={};
  rws.forEach(function(r){var rep=String(r[ir]||'').trim();dansFichier[/^\d+$/.test(rep)?rep:'?']=1;});
  // on retire d'abord ce que ces répartitions avaient apporté, sur toutes les œuvres
  Object.keys(O).forEach(function(c){var o=O[c];migrerRevenus(o);
    if(o.r)Object.keys(dansFichier).forEach(function(k){delete o.r[k];});});
  var touches={};
  rws.forEach(function(r){
    var brut=String(r[ic]||'').trim(),titre=it>=0?String(r[it]||'').trim():'';
    var na=(brut==='-1'||brut===''||norm(titre)==='NON RENSEIGNE');
    var code=na?'NA':normCode(brut);
    if(!code)return;
    var net=numFR(r[inet]),rep=String(r[ir]||'').trim();if(!/^\d+$/.test(rep))rep='?';
    var o=O[code]||(O[code]={code:code,titre:na?'Revenus non affectés':'',parts:[],net:0,de:0,dr:0,ph:0,
      ans:{},reps:{},cat:false,na:na,r:{}});
    if(!o.titre&&it>=0)o.titre=titre;
    o.r=o.r||{};
    var x=o.r[rep]||(o.r[rep]={n:0,de:0,dr:0,ph:0,f:{},t:{},p:{},ft:{}});
    x.f=x.f||{};x.t=x.t||{};x.p=x.p||{};x.ft=x.ft||{};
    x.n+=net;
    if(ide>=0)x.de+=numFR(r[ide]);
    if(idr>=0)x.dr+=numFR(r[idr]);
    if(iph>=0)x.ph+=numFR(r[iph]);
    var fa=cleDB(ifa>=0?r[ifa]:''),ty=cleDB(ity>=0?r[ity]:''),pa=cleDB(ipa>=0?r[ipa]:'');
    x.f[fa]=(x.f[fa]||0)+net;x.t[ty]=(x.t[ty]||0)+net;x.p[pa]=(x.p[pa]||0)+net;
    x.ft[fa+'|'+ty]=(x.ft[fa+'|'+ty]||0)+net;
    if(rep!=='?')reps[rep]=(reps[rep]||0)+net;
    touches[code]=1;n++;
  });
  // arrondi au centime des cumuls stockés, puis totaux recalculés partout
  Object.keys(O).forEach(function(c){var o=O[c];
    Object.keys(o.r||{}).forEach(function(k){var x=o.r[k];
      ['n','de','dr','ph'].forEach(function(f2){x[f2]=Math.round((x[f2]||0)*100)/100;});
      ['f','t','p','ft'].forEach(function(f2){if(x[f2])Object.keys(x[f2]).forEach(function(m){
        x[f2][m]=Math.round(x[f2][m]*100)/100;});});});
    if(o.r)deriver(o);});
  return {reps:reps,lignes:n};
}
function importCatalogue(soc,head,rws,fichier){

    var p={r:C.role>=0?String(r[C.role]).trim():'',n:C.nom>=0?String(r[C.nom]).trim():'',

    n++;

  var m=store.meta[soc]||(store.meta[soc]={});

// ---------- filtres de la vue d'ensemble : période (tout, une année, une répartition) et songwriter ----------
function periodeReps(soc,P){
  if(!P)return null;
  var axe=repsSoc(soc);
  if(P.charAt(0)==='a'){var y=+P.slice(1);return axe.filter(function(n){return repDate(n).an===y;});}
  if(P.charAt(0)==='r')return [+P.slice(1)];
  return null;
}
function libPeriode(P){
  if(!P)return 'toutes répartitions';
  if(P.charAt(0)==='a')return 'année '+P.slice(1);
  return 'répartition '+P.slice(1)+' · '+repDate(+P.slice(1)).lbl;
}
// Revenus d'une société vus à travers un filtre. Pour un songwriter, chaque œuvre ne compte
// que pour la part qui lui revient ; reps garde toute la chronologie pour le graphique.
function agregatFiltre(soc,P,S){
  return memo('agf:'+soc+':'+P+':'+S,function(){
    var O=store.oeuvres[soc]||{},set=periodeReps(soc,P),dans=null;
    if(set){dans={};set.forEach(function(n){dans[n]=1;});}
    var parts={};rows(soc).forEach(function(r){parts[r.code]=r;});
    var a={net:0,detail:0,fam:{},famTyp:{},pays:{},reps:{},oe:{},sw:{},nOe:0,set:set};
    Object.keys(O).forEach(function(c){
      var o=O[c],r=parts[c],q=1;
      if(S){var x=r&&r.sw.filter(function(y){return y.id===S;})[0];if(!x||!o.net)return;q=x.net/o.net;}
      var tot=0;
      Object.keys(o.r||{}).forEach(function(k){var z=o.r[k];if(!z)return;
        if(/^\d+$/.test(k))a.reps[k]=(a.reps[k]||0)+(z.n||0)*q;
        if(dans&&!dans[k])return;
        var v=(z.n||0)*q;tot+=v;
        if(z.f){a.detail+=v;
          Object.keys(z.f).forEach(function(m){a.fam[m]=(a.fam[m]||0)+z.f[m]*q;});
          Object.keys(z.p||{}).forEach(function(m){a.pays[m]=(a.pays[m]||0)+z.p[m]*q;});
          Object.keys(z.ft||{}).forEach(function(m){var i=m.indexOf('|'),f=m.slice(0,i),t=m.slice(i+1);
            var d=a.famTyp[f]||(a.famTyp[f]={});d[t]=(d[t]||0)+z.ft[m]*q;});}
      });
      if(Math.abs(tot)<0.005)return;
      a.net+=tot;
      if(!o.na){a.oe[c]=tot;a.nOe++;}
      if(r&&o.net)r.sw.forEach(function(y){if(S&&y.id!==S)return;
        a.sw[y.id]=(a.sw[y.id]||0)+(S?tot:tot*y.net/o.net);});
    });
    return a;});
}

// Pages numérotées pour les longs tableaux : ‹ 1 2 3 … ›
function pages(total,par,page,cle){
  var nb=Math.ceil(total/par);if(nb<=1)return '';
  var b=function(n,lib,on){return '<button class="btn sm'+(on?' primary':'')+'" data-pg="'+cle+':'+n+'"'+
    (n<1||n>nb?' disabled':'')+'>'+lib+'</button>';};
  var h='<div class="pbody pager"><span class="mut">'+((page-1)*par+1)+'–'+Math.min(total,page*par)+' sur '+total+'</span>'+
    b(page-1,'‹',false);
  for(var i=1;i<=nb;i++){
    if(i===1||i===nb||Math.abs(i-page)<=2)h+=b(i,String(i),i===page);
    else if(i===2||i===nb-1)h+='<span class="mut">…</span>';}
  return h+b(page+1,'›',false)+'</div>';
}
// Six points à vérifier sur chaque œuvre. true = fait, false = manque, null = sans objet
// (titre non commercialisé, ou aucune part de la société à dissoudre).
var POINTS=[['artiste','Artiste'],['lien','Lien'],['sortie','Sortie'],['art','Artwork'],
            ['sw','Songwriters'],['vent','Dissolution']];
function checkOeuvre(soc,r){
  var e=(store.edits[soc]||{})[r.code]||{},rel=sortieDe(soc,r.code),hs=!!e.nonSorti;
  var c={
    artiste:hs?null:!!r.artiste,
    lien:hs?null:!!(r.spotify||r.youtube||(rel&&rel.link)),
    sortie:hs?null:!!r.sortie,
    art:hs?null:!!artDe(soc,r.code),
    sw:r.partSocPh>0?r.sw.length>0:null,
    vent:r.sw.length>=2?r.vstat==='valide':r.sw.length===1?true:null};
  c.manques=POINTS.filter(function(p2){return c[p2[0]]===false;}).map(function(p2){return p2[0];});
  return c;
}
function puce(v,lib){
  return v===true?'<span class="ck ok" title="'+lib+' : fait">✓</span>'
    :v===false?'<span class="ck ko" title="'+lib+' : à faire">✕</span>'
    :'<span class="ck na" title="'+lib+' : sans objet">–</span>';
}
// Fiches œuvres à compléter : œuvres qui rapportent, où l'on a une part mais aucun songwriter
// ventilé, ou dont on ne connaît pas l'artiste interprète.
function fichesATraiter(soc){
  return memo('fat:'+soc,function(){
    return rows(soc).filter(function(r){return !r.na;}).map(function(r){return {r:r,c:checkOeuvre(soc,r)};})
      .filter(function(x){return x.c.manques.length;})
      .sort(function(a,b){return (b.r.net-a.r.net)||String(a.r.titre).localeCompare(String(b.r.titre),'fr');});});
}
function nbATraiter(soc){
  var f=fichesATraiter(soc),tot=rows(soc).filter(function(r){return !r.na;}).length;
  return {oeuvres:f.length,vent:ventilationsEnAttente(soc).length,fiches:f.length,total:tot,faites:tot-f.length};
}
function dernierRep(t){var k=Object.keys(t.reps);if(!k.length)return '—';
  k.sort(function(a,b){return (+b)-(+a);});return eur(t.reps[k[0]])+' €';}
function kpi(c,k,v,s){return '<div class="kpi '+c+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';}
// Un profil venu du Roster ou du Planning est un signé BLZante ; un nom qui n'apparaît
// que dans les dépôts Sacem est externe, jusqu'à ce qu'on en décide autrement sur sa fiche.
function typeSW(sw){
  if(sw&&sw.type)return sw.type;
  return (sw&&(sw.source==='roster'||sw.source==='planning'||sw.source==='base'))?'roster':'externe';
}
function estBLZ(sw){return typeSW(sw)==='roster';}
// Le nom affiché d'un artiste du roster vient du Roster et de lui seul : rattacher des
// profils Sacem n'ajoute que des identités, ça ne renomme jamais la fiche.
function nomFige(sw){return !!sw&&sw.source==='roster';}
function origineTag(sw){
  return sw.source==='roster'?'<span class="tag neutral">roster</span>'
    :sw.source==='planning'?'<span class="tag neutral">planning</span>'
    :sw.source==='base'?'<span class="tag neutral">base</span>'
    :'<span class="tag neutral">fiche outil</span>';
}
function swTags(r){
  if(r.na)return '<span class="tag neutral">non affecté</span>';
  if(!r.sw.length)return '<span class="tag warn">à rattacher</span>';
  return '<div class="swlist">'+r.sw.map(function(x){
    return '<span class="swtag">'+esc(x.nom)+' <b>'+pv(x.pt)+'</b></span>';}).join('')+
    (r.swAuto?' <span class="tag neutral">auto</span>':'')+'</div>';
}

// File des ayants droit Sacem à rattacher (onglet Songwriters)
function panneauAD(soc){
  var tous=enAttente(soc);
  if(!tous.length)return '';
  var prop=tous.filter(function(a){return !!a.match.id;}),sans=tous.filter(function(a){return !a.match.id;});
  var f=state.adf||(prop.length?'prop':'aucun');
  var q=norm(state.adq),qb=String(state.adq||'').replace(/\s+/g,'');
  var base=f==='prop'?prop:f==='aucun'?sans:tous;
  var L=base.filter(function(a){
    if(!q&&!qb)return true;
    return norm(a.nom).indexOf(q)>=0||(/\d/.test(qb)&&(String(a.coad).indexOf(qb)>=0||String(a.ipi).indexOf(qb)>=0));})
    .sort(function(a,b){return (b.net-a.net)||String(a.nom).localeCompare(String(b.nom),'fr');});
  var n=state.adn||20;
  var h='<div class="panel" id="p-ad"><div class="phead"><div class="rowline"><h2>Ayants droit Sacem à rattacher</h2>'+
    [['prop','Propositions à confirmer',prop.length],['aucun','Sans fiche',sans.length],['tous','Tous',tous.length]]
      .map(function(x){return '<button class="chip" data-adf="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+
        ' <span class="num mut">'+x[2]+'</span></button>';}).join('')+
    '<input type="search" id="adq" placeholder="Nom, COAD, IPI…" value="'+esc(state.adq)+'" style="width:200px"></div>'+
    '<span class="note">Les identités des dépôts Sacem pas encore reliées à une fiche. '+
    'Un rapprochement ne compte dans les récaps qu\'une fois confirmé.</span></div>'+
    '<div class="tscroll"><table><thead><tr><th class="l">Ayant droit au dépôt</th><th class="l">COAD</th>'+
    '<th class="num">Œuvres</th><th class="num">Revenus liés €</th><th class="l">Proposition</th>'+
    '<th class="l">Décision</th></tr></thead><tbody>';
  L.slice(0,n).forEach(function(ad){
    var m=ad.match,pr='';
    if(m.id){var sw=store.songwriters[m.id];
      pr='<span class="tag '+(m.niveau==='doute'?'warn':'ok')+'">'+(m.niveau==='doute'?'doute':'probable')+'</span> '+
        esc(sw?sw.nom:'')+' <span class="mut">'+esc(m.raison||'')+'</span>';}
    else pr='<span class="mut">aucune fiche proche</span>';
    h+='<tr><td class="l w">'+esc(ad.nom)+(ad.ipi?'<div class="mini">IPI '+esc(ad.ipi)+'</div>':'')+'</td>'+
      '<td class="l mut num">'+esc(ad.coad||'—')+'</td><td class="num">'+ad.oeuvres+'</td>'+
      '<td class="num">'+eur(ad.net)+'</td><td class="l">'+pr+'</td>'+
      '<td class="l"><div class="rowline">'+
        (m.id?'<button class="btn sm primary" data-ok="'+esc(ad.cle)+'" data-id="'+esc(m.id)+'">Confirmer</button>':'')+
        '<button class="btn sm" data-lier="'+esc(ad.cle)+'">Rattacher à…</button>'+
        '<button class="btn sm" data-fiche="'+esc(ad.cle)+'">Créer une fiche</button>'+
        '<button class="btn sm" data-skip="'+esc(ad.cle)+'">Écarter</button>'+
      '</div></td></tr>';});
  if(!L.length)h+='<tr><td colspan="6" class="mut">Aucun ayant droit ne correspond.</td></tr>';
  h+='</tbody></table></div>'+(L.length>n?'<div class="pbody rowline"><span class="mut">'+n+' premiers sur '+L.length+
    '</span><button class="btn sm" id="ad-plus">Afficher 20 de plus</button></div>':'')+'</div>';
  return h;

// Société → Songwriter ou Œuvre. Chaque page a son adresse (#/blzante/sw/…), le bouton
// « retour » du navigateur fonctionne et une page peut se partager.
function lienVue(v){
  if(!v)return '#/'+state.societe+'/'+state.tab;
  return '#/'+state.societe+'/'+(v.t==='sw'?'sw/':'oeuvre/')+encodeURIComponent(v.id);
}
function aller(v){
  state.vue=v||null;
  if(v)state.tab=v.t==='sw'?'songwriters':'oeuvres';
  var h=lienVue(state.vue);
  if(location.hash!==h){try{history.pushState(null,'',h);}catch(e){}}
  render();window.scrollTo(0,0);
}
function lireAdresse(){
  var m=String(location.hash||'').replace(/^#\/?/,'').split('/');
  if(m[0]&&SOCIETES.some(function(x){return x.id===m[0];}))state.societe=m[0];
  if(m[1]==='sw'&&m[2]){state.vue={t:'sw',id:decodeURIComponent(m.slice(2).join('/'))};state.tab='songwriters';}
  else if(m[1]==='oeuvre'&&m[2]){state.vue={t:'oe',id:decodeURIComponent(m[2])};state.tab='oeuvres';}
  else{state.vue=null;if(m[1]&&['apercu','songwriters','oeuvres','repartitions','rappro','imports'].indexOf(m[1])>=0)state.tab=m[1];}
}
window.addEventListener('popstate',function(){lireAdresse();render();});

/* ---------- pochette : lien Spotify/YouTube de la fiche, sinon sortie du Planning ---------- */
function titresSortie(r){
  var t=[r.track,r.title];
  [r.epTrackNames,r.blzTrackNames].forEach(function(x){
    if(Array.isArray(x))t=t.concat(x);else if(x)t=t.concat(String(x).split(/[,\n;]+/));});
  return t.map(norm).filter(Boolean);
}
var TYPES_SORTIE={Single:1,EP:1,Album:1};
function isoVersFR(d){var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
function titreSortie(r){
  if(!r)return '';
  if(r.type==='EP'||r.type==='Album')return r.project||r.title||r.artist||'';
  return r.track||r.title||'';
}
// Titres d'un projet : les titres BLZante d'abord, puis le reste de la tracklist
function pistesProjet(r){
  var l=(Array.isArray(r.blzTracks)?r.blzTracks:[]).map(function(t){return t&&t.title;}).filter(Boolean);
  lignesTitres(r.blzTrackNames).concat(lignesTitres(r.epTrackNames)).forEach(function(t){
    if(l.map(norm).indexOf(norm(t))<0)l.push(t);});

}
function lignesTitres(t){return String(t||'').split(/\n|,|;/).map(function(x){return x.trim();}).filter(Boolean);}
function lienPlanning(r){return 'release_create.html?edit='+encodeURIComponent(r.id!=null?r.id:r._key);}
// Nom d'un songwriter tel que le Planning l'écrit
function nomPlanning(sw){
  var vus={};PLANNING.forEach(function(r){(r._sw||[]).forEach(function(n){vus[n]=1;});});
  var c=[sw.nom].concat(sw.alias||[]).filter(function(n){return vus[norm(n)];})[0];
  return c||sw.nom;
}
function carteSortie(r){

    (r.status?' · '+esc(r.status):'')+'</div><b>'+esc(titreSortie(r))+'</b>'+

    '</div></div>';
}
async function ecrireSortie(r){
  var c=Object.assign({},r);delete c._key;delete c._sw;
  var cle=r._key||String(r.id);
  var rep2=await dbFetch('/releases/'+encodeURIComponent(cle)+'.json',{method:'PUT',body:JSON.stringify(clean(c))});
  if(!rep2.ok)throw new Error('écriture refusée sur /releases ('+(await fbMsg(rep2))+')');
  r._key=cle;
  r._sw=(r.songwriters||[]).map(function(n){return norm(SW_RENAME[n]||n);});
  if(!PLANNING.some(function(x){return x===r;})){
    PLANNING=PLANNING.filter(function(x){return String(x._key)!==String(cle);});PLANNING.push(r);}
  invalide();snapSave();
}
function sortieParId(id){
  if(id==null||id==='')return null;
  return PLANNING.filter(function(r){return String(r.id)===String(id)||String(r._key)===String(id);})[0]||null;
}
function liensSorties(){
  return memo('lsort',function(){var m={};
    PLANNING.forEach(function(r){Object.keys(r.oeuvres||{}).forEach(function(k){var x=r.oeuvres[k]||{};
      if(x.code)m[(x.soc||'')+'|'+x.code]=r;});});
    return m;});
}
function titreDuTrack(soc,code){
  var e=(store.edits[soc]||{})[code]||{},o=(store.oeuvres[soc]||{})[code]||{};
  return e.titreTrack||o.titre||'';
}
/* ---------- sous-titre Sacem, feat, versions ---------- */
// Le « feat » proposé par défaut : la Sacem le range souvent dans le sous-titre.
function featDuSous(sous){
  var m=String(sous||'').match(/\bfeat\.?\s+(.+)$/i)||String(sous||'').match(/\bft\.?\s+(.+)$/i);
  return m?m[1].trim():'';
}
function featDe(soc,code){
  var e=(store.edits[soc]||{})[code]||{};
  return e.feat||'';
}
// « X, Y & Z » → ['X','Y','Z'] pour le champ featurings du Planning
function listeFeat(t){
  return String(t||'').split(/\s*(?:,|&|\bet\b|\bx\b|\/)\s*/i).map(function(x){return x.trim();}).filter(Boolean);
}
// Ligne secondaire des tableaux : code, sous-titre Sacem et feat
function sousLigne(r,avecCode){
  var p=[];
  if(avecCode)p.push(esc(r.code)+(r.cat?'':' · hors catalogue'));
  if(r.feat)p.push('feat. '+esc(r.feat));
  if(r.sous&&norm(r.sous)!==norm(r.titre))p.push('« '+esc(r.sous)+' »');
  return p.length?'<div class="mini">'+p.join(' · ')+'</div>':'';
}
var TYPES_VERSION=[['live','Version live'],['remix','Remix'],['acoustique','Version acoustique'],
  ['instrumentale','Version instrumentale'],['edit','Radio edit'],['autre','Autre version']];
function libVersion(v){var x=TYPES_VERSION.filter(function(y){return y[0]===v;})[0];return x?x[1]:'Autre version';}
// Famille d'une œuvre : l'originale et toutes les versions déposées qui s'y rattachent.
function familleOeuvre(soc,code){
  var E=store.edits[soc]||{},e=E[code]||{};
  var org=e.versionDe&&(store.oeuvres[soc]||{})[e.versionDe]?e.versionDe:code;
  var vers=Object.keys(E).filter(function(c){return c!==org&&E[c]&&E[c].versionDe===org&&(store.oeuvres[soc]||{})[c];})
    .map(function(c){return {code:c,type:E[c].versionType||'autre',titre:titreDuTrack(soc,c)};})
    .sort(function(a,b){return String(a.titre).localeCompare(String(b.titre),'fr');});
  return {origine:org,versions:vers,membres:[org].concat(vers.map(function(x){return x.code;}))};
}
function memeFamille(soc,a,b){return familleOeuvre(soc,a).membres.indexOf(b)>=0;}
// La même œuvre peut vivre dans plusieurs catalogues, avec des parts différentes.
function memesCatalogues(soc,code){
  var o=(store.oeuvres[soc]||{})[code];if(!o)return [];
  return memo('mcat:'+soc+':'+code,function(){
    var out=[];
    SOCIETES.forEach(function(x){
      if(x.id===soc)return;
      var O=store.oeuvres[x.id]||{};
      Object.keys(O).forEach(function(c){
        var b=O[c];
        if(!memeOeuvre({code:code,iswc:o.iswc},{code:c,iswc:b.iswc}))return;
        var P=socParts(b);
        out.push({soc:x.id,nom:x.nom,code:c,titre:b.titre||c,ph:P.ph,dep:P.dep,dr:P.dr,
          parCode:normCode(c)===normCode(code)});});});
    return out;});
}
// Carte d'identité courte d'une œuvre, pour choisir sans se tromper
function ficheLigne(r){
  var p=[];
  if(r.artiste)p.push(esc(r.artiste));
  if(r.sortie)p.push('sortie '+frDate(r.sortie));
  if(r.depot)p.push('dépôt '+frDate(r.depot));
  p.push('code '+esc(r.code));
  if(r.sous&&norm(r.sous)!==norm(r.titre))p.push('« '+esc(r.sous)+' »');
  if(r.titreTrack&&norm(r.titreTrack)!==norm(r.titre))p.push('déposée « '+esc(r.titre)+' »');
  var aut=(r.nAut?r.nAut+' ayant'+(r.nAut>1?'s':'')+' droit'+(r.nAut>1?'s':''):'');
  if(aut)p.push(aut);
  if(r.partSocPh)p.push(pv(r.partSocPh)+' % phono');
  return '<div class="mini">'+p.join(' · ')+'</div>';
}
function sortieDe(soc,code){
  var e=(store.edits[soc]||{})[code]||{};
  if(e.release){var r=sortieParId(e.release);if(r)return r;}
  var l=liensSorties()[soc+'|'+code];if(l)return l;
  var o=(store.oeuvres[soc]||{})[code];if(!o)return null;
  return (e.titreTrack&&sortiePourOeuvre(e.titreTrack))||sortiePourOeuvre(o.titre);
}
function sortieLiee(soc,code){          // lien explicite, d'un côté ou de l'autre
  var e=(store.edits[soc]||{})[code]||{};
  return (e.release&&sortieParId(e.release))||liensSorties()[soc+'|'+code]||null;
}
// Œuvres déjà liées à une sortie (toutes sociétés)
// Deux œuvres ne sont la même que si le code Sacem ou l'ISWC coïncide : jamais sur le titre.
function normISWC(x){return String(x==null?'':x).toUpperCase().replace(/[^A-Z0-9]/g,'');}
function memeOeuvre(a,b){
  if(!a||!b)return false;
  if(a.code&&b.code&&normCode(a.code)===normCode(b.code))return true;
  var i1=normISWC(a.iswc),i2=normISWC(b.iswc);
  return !!(i1&&i2&&i1===i2);
}
// Une même piste peut porter plusieurs entrées : la même œuvre dans deux catalogues,
// ou — cas à signaler — deux œuvres différentes.
function oeuvresDuTrack(r,cle){
  var v=(r.oeuvres||{})[cle];
  if(!v)return [];
  return (Array.isArray(v)?v:[v]).filter(function(x){return x&&x.code;});
}
// Carte d'identité d'une œuvre liée, telle qu'elle est écrite sur la sortie
function ficheDe(x){
  var o=x&&x.soc?((store.oeuvres[x.soc]||{})[x.code]||null):null;
  return {code:x.code,iswc:(o&&o.iswc)||x.iswc||'',titre:(o&&o.titre)||x.titre||x.code,soc:x.soc};
}
function oeuvresDeSortie(r){
  var out={};
  Object.keys(r.oeuvres||{}).forEach(function(k){
    oeuvresDuTrack(r,k).forEach(function(x){out[(x.soc||'')+'|'+x.code]=x.titre||x.code;});});
  Object.keys(store.edits).forEach(function(so){var E=store.edits[so]||{};
    Object.keys(E).forEach(function(c){if(E[c]&&String(E[c].release)===String(r.id))
      out[so+'|'+c]=((store.oeuvres[so]||{})[c]||{}).titre||c;});});
  return out;
}
// Statut Sacem d'un track de sortie
// « Contrats signés » : l'œuvre apparaîtra dans les prochains exports de nos catalogues
var STATUTS_SACEM=[['a_lancer','À lancer'],['en_cours','En cours'],
  ['en_signature','En cours de signature'],['contrats_signes','Contrats signés'],
  ['depose','Déposé à la Sacem'],['bloque','Bloqué'],['non_editeur','Non éditeur sur l\'œuvre']];
// « À définir » a disparu : les anciennes fiches basculent sur « À lancer »
function statutOk(v){return v==='a_definir'||!v?'a_lancer':v;}
function libSacem(v){var x=STATUTS_SACEM.filter(function(y){return y[0]===statutOk(v);})[0];return x?x[1]:'À lancer';}
function tonSacem(v){return v==='depose'||v==='contrats_signes'?'ok':v==='bloque'?'ko':v==='en_signature'?'warn':v==='non_editeur'?'neutral':v==='en_cours'||v==='a_lancer'?'warn':'neutral';}
// Écrit le lien œuvre ↔ sortie dans la sortie : œuvre, statut Sacem, titre BLZante, et ce qui manque à l'événement
// C'est la fiche œuvre qui fait foi : son titre et son artiste sont écrits sur l'événement.
function lierDansSortie(r,soc,code,info){
  var o=(store.oeuvres[soc]||{})[code]||{},t=info.track||o.titre,cle=norm(t),chg=false;
  r.oeuvres=r.oeuvres||{};r.sacem=r.sacem||{};
  // l'œuvre ne pointe que vers un seul titre de la sortie
  Object.keys(r.oeuvres).forEach(function(k){
    if(k===cle)return;
    var l=oeuvresDuTrack(r,k),reste=l.filter(function(x){return !(x.code===code&&x.soc===soc);});
    if(reste.length===l.length)return;
    if(reste.length)r.oeuvres[k]=reste.length>1?reste:reste[0];
    else{delete r.oeuvres[k];if(r.sacem[k]==='depose')delete r.sacem[k];}
    chg=true;});
  var liste=oeuvresDuTrack(r,cle);
  var moi={soc:soc,code:code,titre:o.titre||t,iswc:o.iswc||''};
  var deja=liste.filter(function(x){return x.code===code&&x.soc===soc;})[0];
  if(!deja){liste=liste.concat([moi]);chg=true;}
  else if(deja.titre!==moi.titre||deja.iswc!==moi.iswc){
    liste=liste.map(function(x){return (x.code===code&&x.soc===soc)?moi:x;});chg=true;}
  if(chg)r.oeuvres[cle]=liste.length>1?liste:liste[0];
  var st=o.cat?'depose':statutOk(info.statut||r.sacem[cle]);
  if(r.sacem[cle]!==st){r.sacem[cle]=st;chg=true;}
  var seul=Object.keys(r.oeuvres).length<=1;
  if(r.type==='EP'||r.type==='Album'){
    var lb=lignesTitres(r.blzTrackNames);
    if(lb.map(norm).indexOf(cle)<0){lb.push(t);r.blzTrackNames=lb.join('\n');r.blzTrackCount=String(lb.length);chg=true;}
    var le=lignesTitres(r.epTrackNames);
    if(le.length&&le.map(norm).indexOf(cle)<0){le.push(t);r.epTrackNames=le.join('\n');chg=true;}
  }else if(seul&&t&&norm(r.track||'')!==cle){
    var avant=norm(r.track||r.title||'');
    r.track=t;chg=true;
    if(!r.title||norm(r.title)===avant)r.title=t;
  }
  if(info.artiste&&r.artist!==info.artiste&&seul){r.artist=info.artiste;chg=true;}
  else if(info.artiste&&!r.artist){r.artist=info.artiste;chg=true;}
  // le featuring de la fiche : sur la sortie pour un single, sur le track pour un projet
  var fts=listeFeat(info.feat);
  if(fts.length){
    if(r.type==='EP'||r.type==='Album'){
      var bt=Array.isArray(r.blzTracks)?r.blzTracks.slice():[];
      var i2=-1;bt.forEach(function(z,j){if(norm(z&&z.title)===cle)i2=j;});
      var ligne={title:t,featurings:fts};
      if(i2<0){bt.push(ligne);chg=true;}
      else if((bt[i2].featurings||[]).join('|')!==fts.join('|')){bt[i2]=ligne;chg=true;}
      r.blzTracks=bt;
    }else if(seul&&(r.featurings||[]).join('|')!==fts.join('|')){r.featurings=fts;chg=true;}
  }
  if(!r.artwork&&info.art){r.artwork=info.art;chg=true;}
  if(!r.link&&info.lien){r.link=info.lien;chg=true;}
  return chg;
}
// Statut Sacem d'une œuvre sur sa sortie
function statutSacem(soc,code,r){
  var o=(store.oeuvres[soc]||{})[code]||{};
  if(o.cat)return 'depose';
  if(!r)return 'a_lancer';
  var k=norm(titreDuTrack(soc,code));
  return statutOk((r.sacem||{})[k]);
}
function delierDansSortie(r,soc,code){
  var chg=false;
  Object.keys(r.oeuvres||{}).forEach(function(k){
    var l=oeuvresDuTrack(r,k),reste=l.filter(function(x){return !(x.code===code&&x.soc===soc);});
    if(reste.length===l.length)return;
    if(reste.length)r.oeuvres[k]=reste.length>1?reste:reste[0];
    else{delete r.oeuvres[k];if(r.sacem&&r.sacem[k]==='depose')delete r.sacem[k];}
    chg=true;});
  return chg;
}
function sortiePourOeuvre(titre){
  if(!PLANNING.length||!titre)return null;
  var t=norm(titre);
  return memo('sortie:'+t,function(){
    return PLANNING.filter(function(r){return TYPES_SORTIE[r.type]&&titresSortie(r).indexOf(t)>=0;})
      .sort(function(a,b){return (a.dateSortable||'').localeCompare(b.dateSortable||'');})[0]||null;});
}
function artDe(soc,code){
  var e=(store.edits[soc]||{})[code]||{};
  if(e.art)return e.art;
  var o=(store.oeuvres[soc]||{})[code];if(!o)return '';
  var rel=sortieDe(soc,code);
  return rel&&rel.artwork?rel.artwork:'';
}
function vignette(url,taille){
  var t=taille||28;
  return '<span class="thumb" style="width:'+t+'px;height:'+t+'px">'+
    (url?'<img src="'+esc(url)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</span>';
}

/* ---------- barres : type d'exploitation, territoire ---------- */
function casse(s){
  return String(s||'').toLocaleLowerCase('fr').replace(/(^|[\s\-'’(])([a-zà-ÿ])/g,function(m,a,b){
    return a+b.toLocaleUpperCase('fr');});
}
// items : {cle:valeur} · on garde les n premiers, le reste va dans « Autres »
function barres(items,opts){
  opts=opts||{};
  var n=opts.n||7,det=opts.detail||{};
  var L=Object.keys(items||{}).map(function(k){return {k:k,v:items[k]};})
    .filter(function(x){return Math.abs(x.v)>=0.005;}).sort(function(a,b){return b.v-a.v;});
  if(!L.length)return '<div class="mut" style="font-size:12px">'+(opts.vide||'Pas de détail disponible.')+'</div>';
  var tot=L.reduce(function(s2,x){return s2+x.v;},0);
  if(L.length>n+1){
    var reste=L.slice(n),autres={k:'Autres',v:0,autre:true,liste:reste};
    reste.forEach(function(x){autres.v+=x.v;});L=L.slice(0,n).concat([autres]);}
  var mx=Math.max.apply(null,L.map(function(x){return x.v;}).concat([0.01]));
  return '<div class="bl">'+L.map(function(x){
    var lib=opts.casse?casse(x.k):x.k;
    var tip='<b>'+esc(lib)+'</b> · '+eur(x.v)+' € · '+pct(tot?100*x.v/tot:0);
    if(x.autre)tip+='<br>'+x.liste.slice(0,12).map(function(y){
      return esc(opts.casse?casse(y.k):y.k)+' '+eur(y.v)+' €';}).join('<br>')+(x.liste.length>12?'<br>…':'');
    else if(det[x.k])tip+='<br>'+Object.keys(det[x.k]).map(function(y){return {k:y,v:det[x.k][y]};})
      .sort(function(a,b){return b.v-a.v;}).slice(0,8)
      .map(function(y){return esc(y.k)+' '+eur(y.v)+' €';}).join('<br>');
    return '<div class="bl-r" tabindex="0" data-tip="'+esc(tip)+'">'+
      '<span class="bl-l">'+esc(lib)+'</span>'+
      '<span class="bl-t"><i class="'+(x.autre?'autre':'')+'" style="width:'+Math.max(1.5,100*x.v/mx)+'%"></i></span>'+
      '<span class="bl-v num">'+eur(x.v,Math.abs(x.v)<10?2:0)+' €</span>'+
      '<span class="bl-p num mut">'+pct(tot?100*x.v/tot:0)+'</span></div>';}).join('')+'</div>';
}
// l'infobulle commune aux barres
(function(){
  var tip=null;
  function montre(t,cible){
    if(!tip){tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);}
    tip.innerHTML=t;tip.style.display='block';
    var r=cible.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
    var x=Math.min(window.innerWidth-w-8,Math.max(8,r.left+r.width/2-w/2));
    var y=r.top-h-8;if(y<8)y=r.bottom+8;
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  function cache(){if(tip)tip.style.display='none';}
  document.addEventListener('mouseover',function(e){var c=e.target.closest&&e.target.closest('[data-tip]');
    if(c)montre(c.getAttribute('data-tip'),c);else cache();});
  document.addEventListener('focusin',function(e){var c=e.target.closest&&e.target.closest('[data-tip]');
    if(c)montre(c.getAttribute('data-tip'),c);});
  document.addEventListener('focusout',cache);
  window.addEventListener('scroll',cache,true);
})();

/* ---------- agrégats : une société, un songwriter ---------- */
// liste de {o, q} : q est la fraction des revenus de l'œuvre qui revient à l'entité
function agreger(liste){
  var a={net:0,detail:0,fam:{},typ:{},pays:{},reps:{},ans:{},famTyp:{}};
  liste.forEach(function(it){var o=it.o,q=it.q;if(!o||!q)return;
    a.net+=(o.net||0)*q;a.detail+=(o.detail||0)*q;
    [['fam','fam'],['typ','typ'],['pays','pays'],['reps','reps'],['ans','ans']].forEach(function(c){
      var src=o[c[0]]||{};Object.keys(src).forEach(function(k){a[c[1]][k]=(a[c[1]][k]||0)+src[k]*q;});});
    Object.keys(o.famTyp||{}).forEach(function(f){var d=a.famTyp[f]||(a.famTyp[f]={});
      Object.keys(o.famTyp[f]).forEach(function(t){d[t]=(d[t]||0)+o.famTyp[f][t]*q;});});
  });
  return a;
}
function agregatSoc(soc){
  return memo('ags:'+soc,function(){var O=store.oeuvres[soc]||{};
    return agreger(Object.keys(O).map(function(c){return {o:O[c],q:1};}));});
}
function agregatSW(soc,id){
  return memo('agw:'+soc+':'+id,function(){
    var O=store.oeuvres[soc]||{},l=[];
    rows(soc).forEach(function(r){r.sw.forEach(function(x){
      if(x.id!==id)return;var o=O[r.code];
      if(o&&o.net)l.push({o:o,q:x.net/o.net});});});
    return agreger(l);});
}
function famTypOeuvre(o){return o.famTyp||{};}
function couverture(a){
  if(!a.net)return '';
  var c=a.detail/a.net;
  if(c>0.995)return '';
  return '<div class="hint">Détail connu pour '+pct(100*c)+' des revenus : les répartitions importées avant '+
    'cette version n\'en gardaient pas trace. Réimportez-les pour tout voir — les montants ne seront pas doublés.</div>';
}

/* ---------- recherche transversale ---------- */
function chercher(q){
  var soc=state.societe,n=norm(q),brut=String(q||'').replace(/\s+/g,'');
  if(!n&&!brut)return {sw:[],oe:[]};
  var sw=swList(soc).filter(function(x){
    return norm(x.nom).indexOf(n)>=0||(x.alias||[]).some(function(a){return norm(a).indexOf(n)>=0;})||
      (x.ads||[]).some(function(a){return norm(a.nom).indexOf(n)>=0||(brut&&/\d/.test(brut)&&
        (String(a.coad).indexOf(brut)>=0||String(a.ipi).indexOf(brut)>=0));})||
      (brut&&/\d/.test(brut)&&(String(x.coad||'').indexOf(brut)>=0||(x.ipis||[]).some(function(i){return String(i).indexOf(brut)>=0;})));
  }).slice(0,6);
  var oe=rows(soc).filter(function(r){
    return norm(r.titre).indexOf(n)>=0||norm(r.artiste).indexOf(n)>=0||norm(r.sous).indexOf(n)>=0||norm(r.titreTrack).indexOf(n)>=0||
      (brut&&(String(r.code).indexOf(brut.replace(/\D/g,''))>=0&&/\d{3,}/.test(brut)))||
      (r.iswc&&norm(r.iswc).replace(/ /g,'').indexOf(n.replace(/ /g,''))>=0&&n.length>=4);
  }).sort(function(a,b){return b.net-a.net;}).slice(0,8);
  return {sw:sw,oe:oe};
}
function brancherRecherche(){
  var inp=el('gq'),box=el('gq-res');if(!inp||inp._ok)return;inp._ok=1;
  var sel=-1,items=[];
  function dessine(){
    var R=chercher(inp.value);items=[];
    var h='';
    if(R.sw.length){h+='<div class="gq-g">Songwriters</div>';
      R.sw.forEach(function(x){items.push({t:'sw',id:x.id});
        h+='<a href="'+lienVue({t:'sw',id:x.id})+'" data-i="'+(items.length-1)+'"><b>'+esc(x.nom)+'</b> '+origineTag(x)+
          '<span class="mini">'+(identite(x)||'')+'</span></a>';});}
    if(R.oe.length){h+='<div class="gq-g">Œuvres</div>';
      R.oe.forEach(function(r){items.push({t:'oe',id:r.code});
        h+='<a href="'+lienVue({t:'oe',id:r.code})+'" data-i="'+(items.length-1)+'">'+vignette(artDe(state.societe,r.code),24)+
          '<span><b>'+esc(r.titre)+'</b><span class="mini">'+(r.artiste?esc(r.artiste)+' · ':'')+eur(r.net,0)+' €</span></span></a>';});}
    if(!h&&inp.value.trim())h='<div class="gq-vide">Rien dans '+esc(socNom(state.societe))+' pour « '+esc(inp.value)+' ».</div>';
    box.innerHTML=h;box.hidden=!h;sel=-1;
    box.querySelectorAll('a').forEach(function(a){a.onclick=function(e){e.preventDefault();
      var it=items[+this.dataset.i];inp.value='';box.hidden=true;aller(it);};});
  }
  inp.addEventListener('input',dessine);
  inp.addEventListener('focus',function(){if(inp.value)dessine();});
  inp.addEventListener('keydown',function(e){
    var liens=box.querySelectorAll('a');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!liens.length)return;
      sel=(sel+(e.key==='ArrowDown'?1:-1)+liens.length)%liens.length;
      liens.forEach(function(a,i){a.classList.toggle('on',i===sel);});}
    else if(e.key==='Enter'){var it=items[sel>=0?sel:0];if(it){inp.value='';box.hidden=true;aller(it);}}
    else if(e.key==='Escape'){box.hidden=true;inp.blur();}});
  document.addEventListener('click',function(e){if(!e.target.closest('.gq'))box.hidden=true;});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();inp.focus();}});
}

// Évolution par répartition : colonnes d'un seul ton, la dernière étiquetée, le détail au survol
function courbeReps(reps,axe,opt){opt=opt||{};
  var k=(axe&&axe.length?axe:Object.keys(reps||{}).filter(function(x){return /^\d+$/.test(x);})
    .map(Number).sort(function(a,b){return a-b;})).slice(-(opt.max||16));
  if(k.length<2)return '';
  var v=k.map(function(n){return (reps||{})[n]||0;});
  var mx=Math.max.apply(null,v.concat([0]));if(mx<=0)return '';
  var pas=Math.pow(10,Math.floor(Math.log10(mx))),haut=Math.ceil(mx/pas)*pas;
  if(haut/pas>5&&haut%(2*pas))haut=Math.ceil(mx/(2*pas))*2*pas;
  var W=opt.W||340,H=(opt.H||118)+12,g=34,d=6,top=16,bas=H-30,band=(W-g-d)/k.length,bw=Math.min(opt.bw||22,band*0.62);
  var per=function(n){var q=((n-665)%4+4)%4,an=String(repDate(n).an).slice(2);
    return band>=44?['janv.','avr.','juil.','oct.'][q]+' '+an:band>=24?['01','04','07','10'][q]+'/'+an:'';};
  var y=function(x){return bas-(bas-top)*x/haut;};
  var fk=function(x){return x>=1000?(Math.round(x/100)/10).toLocaleString('fr-FR')+' k':Math.round(x).toLocaleString('fr-FR');};
  var svg='<svg class="evo" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution des revenus par répartition">'+
    '<line x1="'+g+'" x2="'+(W-d)+'" y1="'+y(haut)+'" y2="'+y(haut)+'" class="evo-grid"/>'+
    '<line x1="'+g+'" x2="'+(W-d)+'" y1="'+y(haut/2)+'" y2="'+y(haut/2)+'" class="evo-grid"/>'+
    '<text x="'+(g-6)+'" y="'+(y(haut)+3)+'" class="evo-ax" text-anchor="end">'+fk(haut)+'</text>'+
    '<text x="'+(g-6)+'" y="'+(y(haut/2)+3)+'" class="evo-ax" text-anchor="end">'+fk(haut/2)+'</text>'+
    '<text x="'+(g-6)+'" y="'+(bas+3)+'" class="evo-ax" text-anchor="end">0</text>';
  k.forEach(function(n,i){
    var cx=g+band*i+band/2,x0=cx-bw/2,h=Math.max(0,bas-y(v[i])),r=Math.min(4,h,bw/2);
    var dern=opt.sel?!!opt.sel[n]:i===k.length-1;
    var etiq=opt.sel?(dern&&!k.slice(i+1).some(function(m){return opt.sel[m];})):i===k.length-1;
    if(h>0.5)svg+='<path class="evo-col'+(dern?' dern':'')+'" d="M'+x0+','+bas+'V'+(bas-h+r)+
      'Q'+x0+','+(bas-h)+' '+(x0+r)+','+(bas-h)+'H'+(x0+bw-r)+'Q'+(x0+bw)+','+(bas-h)+' '+(x0+bw)+','+(bas-h+r)+'V'+bas+'Z"/>';
    if(etiq&&v[i]>0)svg+='<text x="'+cx+'" y="'+(bas-h-5)+'" class="evo-v" text-anchor="'+(i>0?'end':'middle')+'" dx="'+(i>0?bw/2:0)+'">'+
      eur(v[i],0)+' €</text>';
    if(k.length<=12||i%2===k.length%2||etiq)
      svg+='<text x="'+cx+'" y="'+(H-16)+'" class="evo-ax" text-anchor="middle">'+n+'</text>'+
        '<text x="'+cx+'" y="'+(H-4)+'" class="evo-ax per" text-anchor="middle">'+per(n)+'</text>';
    svg+='<rect class="evo-hit" x="'+(g+band*i)+'" y="'+top+'" width="'+band+'" height="'+(bas-top+16)+'" tabindex="0" '+
      'data-tip="'+esc('<b>Répartition '+n+'</b> · '+repDate(n).lbl+'<br>'+eur(v[i])+' €')+'"/>';
  });
  svg+='<line x1="'+g+'" x2="'+(W-d)+'" y1="'+bas+'" y2="'+bas+'" class="evo-base"/></svg>';
  return svg;
}
// Tableau des répartitions : les plus récentes d'abord, regroupées par année
function tableReps(reps,axe,opt){opt=opt||{};

// Une répartition à la fois, comparée à la précédente et au même trimestre de l'an passé.
function detailRep(soc,n){
  return memo('drep:'+soc+':'+n,function(){
    var O=store.oeuvres[soc]||{},d={net:0,oeuvres:[],fam:{},famTyp:{},pays:{},sw:{},detail:0};
    var parts={};rows(soc).forEach(function(r){parts[r.code]=r;});
    Object.keys(O).forEach(function(c){var o=O[c],x=(o.r||{})[n];if(!x||!x.n)return;
      d.net+=x.n;if(!o.na)d.oeuvres.push({code:c,titre:o.titre,v:x.n});
      if(x.f){d.detail+=x.n;
        Object.keys(x.f).forEach(function(k){d.fam[k]=(d.fam[k]||0)+x.f[k];});
        Object.keys(x.p||{}).forEach(function(k){d.pays[k]=(d.pays[k]||0)+x.p[k];});
        Object.keys(x.ft||{}).forEach(function(m){var i=m.indexOf('|'),f=m.slice(0,i),t=m.slice(i+1);
          var z=d.famTyp[f]||(d.famTyp[f]={});z[t]=(z[t]||0)+x.ft[m];});}
      var r=parts[c];
      if(r&&o.net)r.sw.forEach(function(s2){var sw=store.songwriters[s2.id];if(!sw)return;
        d.sw[s2.id]=(d.sw[s2.id]||0)+x.n*s2.net/o.net;});
    });
    d.oeuvres.sort(function(a,b){return b.v-a.v;});
    return d;});
}

/* ---------- fiche œuvre ---------- */
function repsSoc(soc){
  var s={},O=store.oeuvres[soc]||{};
  Object.keys(O).forEach(function(c){Object.keys(O[c].reps||{}).forEach(function(r){s[r]=1;});});
  return Object.keys(s).map(Number).filter(function(x){return !isNaN(x);})
    .sort(function(x,y){return x-y;});
}
function ficheOeuvre(code){
  var soc=state.societe,o=(store.oeuvres[soc]||{})[code];if(!o)return;
  var e=(store.edits[soc]||{})[code]||{};
  var a=attach(soc,code),aut=a.aut;
  var ix=swIndex(soc),moiCoad=String(socCoad(soc));
  var P=socParts(o),partDep=P.dep,partDr=P.dr,partPh=P.ph;
  var PIL=pilote(P),TOT=PIL==='ph'?partPh:partDep;
  var notes=notesDe(e),artUrl=e.art||'';
  var aValider=(rows(soc).filter(function(x){return x.code===code;})[0]||{}).vstat==='attente';
  var lignes=aut.map(function(x,i){
    var swId=ix[String(x.coad)]||ix['n:'+norm(x.nom)]||'';
    var cur=a.list.filter(function(l){return l.id===swId;})[0];
    var sw=swId?store.songwriters[swId]:null;
    return {i:i,coad:x.coad,nom:x.nom,ipi:x.ipi,nf:x.nf||'',sde:x.sde||'',sdr:x.sdr||'',ecr:x.dep,ecrDr:x.dr||0,ecrPh:x.ph,
      roles:Object.keys(x.roles).join('/'),swId:swId,coche:!!cur,role:Object.keys(x.roles).join('/'),
      deal:cur?(cur.part!=null?cur.part:100):(sw&&sw.part!=null?sw.part:100)};});
  // ventilés sur l'œuvre mais plus reliés à une ligne du dépôt (rattachement Sacem à refaire)
  a.list.forEach(function(x){
    if(lignes.some(function(l){return l.swId===x.id;}))return;
    var sw=store.songwriters[x.id];if(!sw)return;
    lignes.push({i:lignes.length,coad:'',nom:sw.nom,ipi:'',nf:'',ecr:0,ecrDr:0,ecrPh:0,roles:'—',
      role:'—',swId:x.id,coche:true,orphelin:true,deal:x.part!=null?x.part:(sw.part!=null?sw.part:100)});});
  // éditeurs regroupés par identité, avec la nôtre repérée sur place
  var eds=(function(){
    var m={};
    editeurs(o).forEach(function(p){
      var k=p.c||('n:'+norm(p.n));
      var x=m[k]||(m[k]={nom:p.n,coad:p.c||'',role:p.r||'E',ecr:0,ecrDr:0,ecrPh:0,
        moi:String(p.c)===moiCoad});
      x.ecr+=p.dep||0;x.ecrDr+=p.dr||0;x.ecrPh+=p.ph||0;});
    return Object.keys(m).map(function(k){return m[k];});
  })();
  var nous=eds.filter(function(p){return p.moi;});

  /* ---- revenus : total + détail sur les répartitions dont on a l'historique ---- */
  var toutes=repsSoc(soc),parAn={};
  toutes.forEach(function(n){var y=repDate(n).an;(parAn[y]||(parAn[y]=[])).push(n);});
  var anneesDispo=Object.keys(parAn).sort();

    : '<div class="tscroll"><table><tbody>'+anneesDispo.map(function(y){
        var ta=parAn[y].reduce(function(s2,n){return s2+((o.reps||{})[n]||0);},0);
        return '<tr class="yr"><td class="l w">'+y+'</td><td class="num w">'+eur(ta)+' €</td><td></td></tr>'+
          parAn[y].map(function(n){
            var v=(o.reps||{})[n]||0,mx=Math.max.apply(null,toutes.map(function(z){return (o.reps||{})[z]||0;}).concat([0.01]));
            return '<tr><td class="l mut" style="padding-left:18px">'+n+' <span class="mini">'+repDate(n).lbl+'</span></td>'+
              '<td class="num'+(v?'':' mut')+'">'+(v?eur(v)+' €':'—')+'</td>'+
              '<td style="width:88px">'+(v>0?'<i class="bar" style="width:'+Math.max(3,Math.round(100*v/mx))+'%"></i>':'')+'</td></tr>';
          }).join('');}).join('')+
      '</tbody><tfoot><tr><td class="l">Total sur '+toutes.length+' répartition'+(toutes.length>1?'s':'')+
        ' ('+toutes[0]+'–'+toutes[toutes.length-1]+')</td>'+
        '<td class="num">'+eur(o.net||0)+' €</td><td></td></tr></tfoot></table></div>'+
      (o.de||o.dr||o.ph?'<div class="hint">Dont '+eur(o.de||0)+' € de droit d\'exécution · '+
        eur(o.dr||0)+' € de droits de reproduction · '+eur(o.ph||0)+' € de phono.</div>':'');

  var body='<div class="split"><div>'+
    /* --- la sortie au Planning d'abord, le titre commercialisé ensuite --- */

          '<input type="text" id="f-artiste" value="'+esc(e.artiste||'')+'" placeholder="Nom de l\'artiste"></div>'+
        '<div class="field"><label class="fl">Featuring</label>'+
          '<input type="hidden" id="f-feat" value="'+esc(e.feat||'')+'"><div id="f-feats" class="feats"></div></div>'+
        '<div class="field"><label class="fl">Date de sortie</label>'+
          '<input type="date" id="f-sortie" value="'+esc(e.sortie||'')+'"></div>'+
        '<div class="field"><label class="fl">ISRC</label>'+
          '<input type="text" id="f-isrc" value="'+esc(e.isrc||'')+'" placeholder="FRX932600123" maxlength="15"></div>'+
      '</div></div>'+
      (featDuSous(o.sous)&&!e.feat?'<div class="hint">Le sous-titre Sacem mentionne « feat. '+esc(featDuSous(o.sous))+

    /* --- l'œuvre déposée --- */

    if(verRole==='ver'&&verDe){
      ed.versionDe=verDe;ed.versionType=(el('fv-type')?el('fv-type').value:verType)||'autre';}
    else{delete ed.versionDe;delete ed.versionType;}
    if(MODE==='firebase'){
      try{
        if(relAvant&&String(relAvant)!==String(relId)){var ra=sortieParId(relAvant);
          if(ra&&delierDansSortie(ra,soc,code))await ecrireSortie(ra);}
        if(relId){var rn=sortieParId(relId);
          var pj2=rn&&(rn.type==='EP'||rn.type==='Album');
          if(rn&&lierDansSortie(rn,soc,code,{track:(pj2&&pisteSel)||ed.titreTrack||o.titre,art:artUrl||'',feat:ed.feat||'',
            lien:ed.spotify||ed.youtube||'',artiste:ed.artiste,statut:statutSel}))
            await ecrireSortie(rn);}
      }catch(err){toast('Lien avec le Planning non enregistré : '+((err&&err.message)||err),6000);}
    }
    ed.notes=notes.map(function(n){return {t:n.t,d:n.d||''};});
    ed.note=notes.length?notes[notes.length-1].t:'';      // compat affichage rapide
    ed.art=artUrl||'';ed.artKey=artKey(ed.spotify,ed.youtube);
    var manq=lignes.filter(function(l){return l.coche&&!l.swId;});
    for(var i=0;i<manq.length;i++){
      var l=manq[i];
      var sw={id:uid('sw'),nom:l.nom,coad:l.coad||'',ipi:l.ipi||'',societe:soc,type:'externe',
        part:l.deal==null?100:+l.deal,alias:[],note:'',
        ads:[{nom:l.nom,coad:l.coad||'',ipi:l.ipi||'',nf:l.nf||''}],ipis:l.ipi?[l.ipi]:[]};
      store.songwriters[sw.id]=sw;l.swId=sw.id;
      try{await saveSW(sw);}catch(err){}
    }
    var uniq={},coches=lignes.filter(function(l){if(!l.coche||!l.swId||uniq[l.swId])return false;uniq[l.swId]=1;return true;});
    ed.sw=coches.map(function(l){return {id:l.swId,part:l.deal==null?0:+l.deal};});
    ed.alloc=coches.map(function(l){
      var p=pts[l.swId]!=null?pts[l.swId]:(pts['tmp'+l.i]||0);
      return {id:l.swId,pt:Math.round((+p||0)*100)/100};});
    ed.vsig=vsig(ed.alloc);
    if(ed.alloc.length>=2)ed.vok=true;else delete ed.vok;
    ed.vdate=new Date().toISOString();
    this.disabled=true;el('f-state').textContent='Enregistrement…';
    try{
      // les œuvres rattachées comme versions de celle-ci
      if(ed.versionDe)verAjouts={};
      var cs=Object.keys(verAjouts).concat(Object.keys(verRetraits));
      for(var iv=0;iv<cs.length;iv++){var cv2=cs[iv],ev=E[cv2]||(E[cv2]={});
        if(verRetraits[cv2]){if(ev.versionDe===code){delete ev.versionDe;delete ev.versionType;}}
        else{ev.versionDe=code;ev.versionType=verAjouts[cv2];if(relId&&!ev.release)ev.release=relId;}
        await saveEdit(soc,cv2);}
      await saveEdit(soc,code);await saveOeuvres(soc);
      closeModal();render();
      toast((aValider&&ed.vok?'Dissolution validée · ':'')+'Fiche « '+o.titre+' » enregistrée'+(manq.length?' · '+manq.length+' fiche songwriter créée':''));
    }catch(err){el('f-state').textContent='Échec : '+(err&&err.code?err.code:'écriture refusée');this.disabled=false;}
  };
}

  function drawAds(){

      var mots=c.split(' ').filter(function(w){return w.length>2;});
      var dans=mots.length&&mots.every(function(w){return n.indexOf(w)>=0;});

      sorties.slice(0,8).map(function(r){
        return '<tr><td class="l">'+esc(r.track||r.title||'')+'</td><td class="l mut">'+esc(r.artist||'')+'</td>'+
          '<td class="l mut num">'+esc(r.date||r.dateSortable||'')+'</td>'+
          '<td class="l mut">'+esc(r.status||'')+'</td></tr>';}).join('')+'</tbody></table>'+
      (sorties.length>8?'<div class="hint">'+(sorties.length-8)+' autres sorties</div>':'');
  }
  el('s-cancel').onclick=closeModal;
  if(id&&el('s-del'))el('s-del').onclick=function(){
    var derive=!!sw.source,nom=sw.nom||'';
    var n=0;Object.keys(store.edits).forEach(function(so){var E=store.edits[so]||{};
      Object.keys(E).forEach(function(c){if((E[c].sw||[]).some(function(x){return x.id===sw.id;}))n++;});});
    el('s-state').innerHTML='';

      '<div class="hint">'+(derive
        ?'L\'artiste reste au '+(sw.source==='roster'?'Roster':sw.source==='planning'?'Planning':'roster de base')+
         ' de la Toolbox ; il ne sera simplement plus proposé ici. Ses rattachements Sacem sont effacés. '+

        :'La fiche et ses rattachements Sacem sont effacés définitivement.')+
        (n?' Il figure dans la ventilation de '+n+' œuvre'+(n>1?'s':'')+', qui sera recalculée sans lui.':'')+'</div>'+
      '<div class="rowline" style="margin-top:9px"><button class="btn sm primary" id="s-del-ok">'+

    sw.ipis=el('s-ipis').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    sw.alias=el('s-alias').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    sw.note=el('s-note').value.trim();sw.ads=ads;
    if(!id&&!sw.source&&sw.type==='roster'){
      var B=baseCfg(),cle=norm(nom);
      B.ajouts[cle]={nom:nom};delete B.exclus[cle];
      sw.id='b:'+cle;sw.source='base';
      try{await saveMeta();}catch(e){}
    }
    store.songwriters[sw.id]=sw;
    var L=store.liens[soc]||(store.liens[soc]={});
    ads.forEach(function(a){L[adKey(a)]=sw.id;});
    this.disabled=true;el('s-state').textContent='Enregistrement…';
    try{await saveSW(sw);await saveLiens();closeModal();render();toast('Fiche « '+nom+' » enregistrée');}
    catch(err){el('s-state').textContent='Échec : '+(err&&err.code?err.code:'écriture refusée');this.disabled=false;}
  };
}

/* ---------- réinitialisation des songwriters ---------- */
// Une fiche créée à la main qui désigne quelqu'un du Roster ou du Planning est un doublon.
function doublonDeBase(x){
  return Object.keys(store.songwriters).some(function(k){var d=store.songwriters[k];
    if(!d.source||d===x)return false;
    return [d.nom].concat(d.alias||[]).some(function(n){
      return memePersonne(n,x.nom)||(x.alias||[]).some(function(al){return memePersonne(n,al);});});});
}
function modalReset(){

  var outils=tout.filter(function(x){return !x.source;});

  var ext=outils.filter(function(x){return !estBLZ(x)&&dbl.indexOf(x)<0;});
  var nbAds=tout.reduce(function(n,x){return n+(x.ads||[]).length;},0);
  openModal('<div class="eyebrow">Songwriters</div><h2>Réinitialiser la liste</h2>',
    '<p style="margin:0 0 10px">La liste est reconstruite à partir des artistes du <b>Roster</b> et des songwriters du '+
    '<b>Planning</b> de la Toolbox, sans doublons : un même nom écrit de deux façons (« Seb » / « Sébastien ») '+
    'ne donne plus qu\'une fiche. Le duo MAB laisse la place à Gabriel et Hadrien Mabilat, Malaka est ajouté, '+
    'et vos retraits restent en place.</p>'+
    '<div class="grid2"><div><label class="fl">Effacé</label><ul style="margin:4px 0 0 18px;padding:0;font-size:12.5px">'+
      '<li>les rattachements aux profils Sacem ('+nbAds+' ayant'+(nbAds>1?'s':'')+' droit rattaché'+(nbAds>1?'s':'')+
        ', COAD, IPI, pseudonymes ajoutés)</li>'+

      '<li>les '+(outils.length-ext.length)+' fiche'+(outils.length-ext.length>1?'s':'')+' créée'+
        (outils.length-ext.length>1?'s':'')+' à la main qui font doublon'+
        (dbl.length?' ('+dbl.map(function(x){return esc(x.nom);}).join(', ')+')':'')+'</li></ul></div>'+
    '<div><label class="fl">Conservé</label><ul style="margin:4px 0 0 18px;padding:0;font-size:12.5px">'+
      '<li>catalogue, revenus et fiches œuvres</li>'+
