      '<li>les ventilations des œuvres : elles restent comptées et se raccrochent d\'elles-mêmes '+
        'au dépôt dès que le profil Sacem est rattaché de nouveau</li></ul></div></div>'+
    (ext.length?'<label class="rowline" style="margin-top:12px;font-size:12.5px;cursor:pointer">'+
      '<input type="checkbox" id="rz-ext" checked> Garder les '+ext.length+' fiche'+(ext.length>1?'s':'')+
      ' externe'+(ext.length>1?'s':'')+' créée'+(ext.length>1?'s':'')+' à la main, avec leurs rattachements '+
      '<span class="mut">('+ext.slice(0,6).map(function(x){return esc(x.nom);}).join(', ')+(ext.length>6?'…':'')+')</span></label>':'')+
    '<div class="hint" style="margin-top:12px">Par précaution, téléchargez une sauvegarde avant : '+
      '« Restaurer » la remettra telle quelle.</div>',
    '<button class="btn left" id="rz-dl">Télécharger une sauvegarde</button><span class="mut" id="rz-state"></span>'+
    '<button class="btn" id="rz-no">Annuler</button><button class="btn primary" id="rz-go">Réinitialiser</button>');
  el('rz-dl').onclick=exportBase;el('rz-no').onclick=closeModal;

    catch(e){el('rz-state').textContent='Échec : '+((e&&e.message)||e);this.disabled=false;}

}
async function reinitialiserSW(garderExt){
  var avant={};Object.keys(store.songwriters).forEach(function(k){
    var x=store.songwriters[k];avant[k]={nom:x.nom,alias:x.alias||[]};});
  // 1. ce qu'on garde de chaque fiche : le contrat, pas l'identité Sacem
  var contrat=function(x){return {part:x.part==null?null:x.part,type:x.type||'',note:x.note||'',societe:x.societe||''};};
  var garde={},overlays={};
  Object.keys(store.songwriters).forEach(function(k){
    var x=store.songwriters[k];
    if(!x.source){if(garderExt&&!estBLZ(x)&&!doublonDeBase(x))garde[k]=x;return;}
    if(x.source==='roster')return;                        // réécrit plus bas, sur sa fiche Roster
    overlays[k]=Object.assign(contrat(x),{nom:x.nom,source:x.source});});
  // 2. rapprochements : on ne garde que ceux des externes conservés
  Object.keys(store.liens).forEach(function(so){var L=store.liens[so]||{},N={};
    Object.keys(L).forEach(function(c){if(garde[L[c]])N[c]=L[c];});store.liens[so]=N;});
  store.fusions={};store.ecartes={};
  // 3. écriture
  if(MODE==='firebase'){
    var corps={};
    Object.keys(garde).forEach(function(k){var x=Object.assign({},garde[k]);delete x.id;corps[k]=x;});
    Object.keys(overlays).forEach(function(k){corps[k]=overlays[k];});
    await rtSet('songwriters',corps);
    await Promise.all(ROSTER.map(function(a){
      var sw=store.songwriters['r:'+a.id],c=sw?contrat(sw):null;
      a.edition=c;
      return dbFetch('/roster/'+encodeURIComponent(a._key||a.id)+'/edition.json',
        c?{method:'PUT',body:JSON.stringify(clean(c))}:{method:'DELETE'});}));
    await saveMeta();
    await loadAll();
  }else{
    store.overlays=overlays;
    Object.keys(store.songwriters).forEach(function(k){if(!garde[k])delete store.songwriters[k];});
    construireBase();
    localSave();
  }
  // 4. ventilations : une fiche disparue est remplacée par celle qui porte désormais son nom
  var touches=[];
  var retrouve=function(id){
    if(store.songwriters[id])return id;
    var a=avant[id];if(!a)return null;
    var noms=[a.nom].concat(a.alias);
    var k=Object.keys(store.songwriters).filter(function(k2){var x=store.songwriters[k2];
      return noms.some(function(n){return memePersonne(n,x.nom)||(x.alias||[]).some(function(al){return memePersonne(n,al);});});})[0];
    return k||null;};
  Object.keys(store.edits).forEach(function(so){var E=store.edits[so]||{};
    Object.keys(E).forEach(function(c){var ed=E[c]||{};if(!ed.sw&&!ed.alloc)return;
      var avantJ=JSON.stringify([ed.sw,ed.alloc]);
      var map=function(l){return (l||[]).map(function(x){var n=retrouve(x.id);return n?Object.assign({},x,{id:n}):null;})
        .filter(Boolean).filter(function(x,i,arr){return arr.findIndex(function(y){return y.id===x.id;})===i;});};
      if(ed.sw)ed.sw=map(ed.sw);if(ed.alloc)ed.alloc=map(ed.alloc);
      if(JSON.stringify([ed.sw,ed.alloc])!==avantJ){delete ed.vsig;touches.push([so,c]);}});});
  await enregistrerEdits(touches);
  invalide();snapSave();
}

/* ---------- import ---------- */
function modalImport(){
  var TYPES=[['catalogue','Catalogue « Mes œuvres »','Œuvres, splits, ISWC et dates de dépôt'],
             ['repartition','Répartition « Toutes œuvres »','Revenus nets par œuvre et par trimestre']];
  var typeChoisi='',files=[];
  var body='<div class="field"><label class="fl">1 · Type de données à importer</label>'+
    '<div class="rowline" id="i-types">'+TYPES.map(function(t){
      return '<button class="chip" data-t="'+t[0]+'" aria-pressed="false" style="text-align:left">'+
        '<b>'+t[1]+'</b><div class="mini" style="margin-top:2px">'+t[2]+'</div></button>';}).join('')+'</div></div>'+
    '<div class="field"><label class="fl">2 · Société à qui appliquer l\'import</label>'+
    '<div class="rowline" id="i-socs">'+SOCIETES.map(function(x){
      return '<button class="chip" data-s="'+x.id+'" aria-pressed="'+(state.societe===x.id)+'">'+esc(x.nom)+'</button>';}).join('')+
    '</div><div class="hint" id="i-sochint"></div></div>'+
    '<div class="field"><label class="fl">3 · Fichiers</label>'+
    '<div class="drop" id="drop"><b>Déposez vos fichiers CSV ici</b>'+
    '<p id="drop-sub">Choisissez d\'abord le type et la société.</p>'+
    '<p><button class="btn" id="i-pick" disabled>Choisir des fichiers</button></p>'+
    '<input type="file" id="i-file" accept=".csv,text/csv" multiple hidden></div></div>'+
    '<div class="filelist" id="i-list"></div><div class="prog" id="i-prog" hidden><i></i></div>'+
    '<div id="i-err"></div>'+
    '<div class="hint">Chaque fichier est vérifié : s\'il ne correspond pas au type annoncé, il est signalé '+
    'et laissé de côté. Le catalogue fait foi sur les splits, les répartitions n\'apportent que les montants. '+
    'Les songwriters viennent du roster de la Toolbox, il n\'y a rien à importer pour eux.</div>';
  openModal('<div class="eyebrow">Import</div><h2>Ajouter des données</h2>',body,
    '<span class="left mut" id="i-state"></span><button class="btn" id="i-cancel">Fermer</button>'+
    '<button class="btn primary" id="i-go" disabled>Importer</button>');

  var socChoisie=state.societe;
  var drop=el('drop');
  function majEtat(){
    el('i-types').querySelectorAll('[data-t]').forEach(function(b2){
      b2.setAttribute('aria-pressed',b2.dataset.t===typeChoisi);});
    el('i-socs').querySelectorAll('[data-s]').forEach(function(b2){
      b2.setAttribute('aria-pressed',b2.dataset.s===socChoisie);});
    var pret=!!typeChoisi&&!!socChoisie;
    el('i-pick').disabled=!pret;
    el('drop-sub').textContent=pret
      ? TYPES.filter(function(t){return t[0]===typeChoisi;})[0][1]+' → '+socNom(socChoisie)
      : 'Choisissez d\'abord le type et la société.';
    var m=store.meta[socChoisie]||{};
    el('i-sochint').innerHTML=typeChoisi==='catalogue'&&m.catalogueDate
      ? 'Dernier catalogue importé le '+frDate(m.catalogueDate)+' — un nouvel import met à jour les splits sans toucher aux saisies.'
      :typeChoisi==='repartition'&&m.lastRep
      ? 'Dernière répartition connue : '+m.lastRep+' ('+repDate(m.lastRep).lbl+').'
      :'';
    draw();
  }
  el('i-types').querySelectorAll('[data-t]').forEach(function(b2){
    b2.onclick=function(){typeChoisi=this.dataset.t;majEtat();};});
  el('i-socs').querySelectorAll('[data-s]').forEach(function(b2){
    b2.onclick=function(){socChoisie=this.dataset.s;majEtat();};});
  el('i-pick').onclick=function(){el('i-file').click();};
  el('i-file').onchange=function(){add(this.files);};
  ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){
    e.preventDefault();if(typeChoisi&&socChoisie)drop.classList.add('over');});});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){
    e.preventDefault();drop.classList.remove('over');});});
  drop.addEventListener('drop',function(e){
    if(!typeChoisi||!socChoisie){toast('Choisissez le type et la société avant de déposer');return;}
    if(e.dataTransfer&&e.dataTransfer.files)add(e.dataTransfer.files);});

  function add(fl){
    Array.prototype.forEach.call(fl,function(f){
      if(!/\.csv$/i.test(f.name)){toast('Ignoré : '+f.name);return;}
      var x={file:f,detect:null,head:null,rows:null,force:false};files.push(x);
      var fr=new FileReader();
      fr.onload=function(){var p=parseCSV(String(fr.result));
        x.head=p.head;x.rows=p.rows;
        x.detect=isRepartition(p.head)?'repartition':isCatalogue(p.head)?'catalogue':'inconnu';
        draw();};
      fr.onerror=function(){toast('Lecture impossible : '+f.name);};
      fr.readAsText(f,'utf-8');});
    draw();
  }
  function libelle(t){var x=TYPES.filter(function(y){return y[0]===t;})[0];
    return x?x[1]:'format non reconnu';}
  function retenus(){return files.filter(function(x){
    return x.head&&(x.detect===typeChoisi||x.force);});}
  function draw(){
    el('i-list').innerHTML=files.map(function(x,i){
      var etat;
      if(!x.head)etat='<span class="mut">lecture…</span>';
      else if(x.detect===typeChoisi)etat='<span class="tag ok">conforme</span>';
      else if(x.force)etat='<span class="tag warn">forcé</span>';
      else etat='<span class="tag warn">semble être : '+libelle(x.detect)+'</span>'+
        '<button class="btn sm" data-force="'+i+'">Importer quand même</button>';
      return '<div class="filerow"><div><b>'+esc(x.file.name)+'</b><div class="mini">'+
        (x.head?x.rows.length+' lignes · '+x.head.length+' colonnes':'…')+'</div></div>'+
        '<div class="rowline">'+etat+
        '<button class="btn sm" data-rm="'+i+'">Retirer</button></div></div>';}).join('');
    el('i-list').querySelectorAll('[data-rm]').forEach(function(b2){
      b2.onclick=function(){files.splice(+this.dataset.rm,1);draw();};});
    el('i-list').querySelectorAll('[data-force]').forEach(function(b2){
      b2.onclick=function(){files[+this.dataset.force].force=true;draw();};});
    var n=retenus().length;
    el('i-go').disabled=!n;
    el('i-go').textContent=n?('Importer '+n+' fichier'+(n>1?'s':'')):'Importer';
  }
  majEtat();

  el('i-cancel').onclick=closeModal;
  el('i-go').onclick=async function(){
    var soc=socChoisie,btn=this;btn.disabled=true;
    var prog=el('i-prog');prog.hidden=false;
    var liste=retenus(),resume=[],done=0;
    for(var i=0;i<liste.length;i++){
      var f=liste[i];
      el('i-state').textContent=f.file.name+'…';
      try{
        if(typeChoisi==='catalogue'){
          var c=importCatalogue(soc,f.head,f.rows,f.file.name);
          await logImport({type:'catalogue',societe:soc,fichier:f.file.name,date:new Date().toISOString(),
            n:c.lignes,detail:c.oeuvres+' œuvres · '+c.nouvelles+' nouvelles · COAD '+c.coad});
          resume.push(f.file.name+' : '+c.oeuvres+' œuvres');
        }else{
          var r=importRepartition(soc,f.head,f.rows);
          var rs=Object.keys(r.reps).map(Number).sort(function(x,y){return x-y;});
          var m=store.meta[soc]||(store.meta[soc]={});
          var last=rs.length?rs[rs.length-1]:null;
          if(last&&(!m.lastRep||last>+m.lastRep)){m.lastRep=last;m.lastRepDate=repDate(last).iso;}
          await logImport({type:'repartition',societe:soc,fichier:f.file.name,date:new Date().toISOString(),
            n:r.lignes,detail:'répartitions '+rs.join(', ')});
          resume.push(f.file.name+' : '+r.lignes+' lignes');
        }
      }catch(err){resume.push(f.file.name+' : échec — '+(err.message||err));}
      done++;prog.querySelector('i').style.width=Math.round(100*done/liste.length)+'%';
    }
    el('i-state').textContent='Enregistrement…';
    try{
      await saveOeuvres(soc);
      el('i-err').innerHTML='';
    }catch(err){
      prog.hidden=true;el('i-state').textContent='';btn.disabled=false;
      echecEnregistrement((err&&err.message)||String(err),soc);
      return;
    }
    state.societe=soc;closeModal();render();toast(resume.join(' · '),5500);
  };
  // L'import a réussi en mémoire mais la base refuse d'écrire : on le dit, on garde tout,
  // et on laisse réessayer ou sortir une sauvegarde.
  function echecEnregistrement(msg,soc){
    var droits=/401|403|[Pp]ermission|denied/.test(msg);
    el('i-err').innerHTML='<div class="filerow" style="display:block;border-color:var(--warn)">'+
      '<b>Les données sont importées mais la base refuse de les enregistrer.</b>'+
      '<div class="mini" style="white-space:normal;margin-top:5px">'+esc(msg)+'</div>'+
      (droits?'<div class="hint">La Realtime Database n\'autorise pas l\'écriture sous <b>/'+esc(fbRoot())+
        '</b>. Il faut ouvrir ce chemin aux utilisateurs connectés dans les règles de la base '+
        '(le roster et le planning, eux, ont leur règle).</div>':
        '<div class="hint">Vérifiez la connexion, puis réessayez.</div>')+
      '<div class="rowline" style="margin-top:9px">'+
        '<button class="btn sm primary" id="i-retry">Réessayer l\'enregistrement</button>'+
        '<button class="btn sm" id="i-dl">Télécharger une sauvegarde</button>'+
        '<button class="btn sm" id="i-keep">Continuer sans enregistrer</button></div></div>';
    el('i-retry').onclick=async function(){
      this.disabled=true;el('i-state').textContent='Enregistrement…';
      try{await saveOeuvres(soc);el('i-err').innerHTML='';el('i-state').textContent='';
        state.societe=soc;closeModal();render();toast('Enregistré');}
      catch(e2){el('i-state').textContent='';echecEnregistrement((e2&&e2.message)||String(e2),soc);}
    };
    el('i-dl').onclick=exportBase;
    el('i-keep').onclick=function(){state.societe=soc;closeModal();render();
      toast('Données chargées pour cette session seulement — elles disparaîtront au rechargement',6000);};
  }
}
