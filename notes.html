<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLZ — Notes NDA / NDD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#0d0d0d;
  --card:#0f0f0f;
  --ink:#f0ede6;
  --ink2:#8a8a82;
  --ink3:#5f5f59;
  --rule:#2a2a2a;
  --rule2:#1c1c1c;
  --accent:#e8c547;
  --nda:#8fd0bf;
  --nda-bg:#14201c;
  --ndd:#9db0ef;
  --ndd-bg:#161a26;
  --warn:#e0a86a;
  --danger:#e07a7a;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Syne',system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;
  background-image:linear-gradient(#2a2a2a 1px,transparent 1px),linear-gradient(90deg,#2a2a2a 1px,transparent 1px);
  background-size:60px 60px;
}
h1,h2,h3,h4{font-family:'Syne',system-ui,sans-serif;margin:0;letter-spacing:-0.02em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ---------- shell (header Toolbox) ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(13,13,13,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:20px;padding:0 30px;flex-wrap:wrap;
}
.nav-logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;color:#fff;
  text-decoration:none;letter-spacing:.06em;display:flex;align-items:center;gap:9px;padding:15px 0;white-space:nowrap;
}
.nav-logo-img{height:24px;width:auto;display:block}
.nav-label{font-family:'Syne Mono',monospace;font-size:.66rem;color:#aaa;letter-spacing:.18em;text-transform:uppercase}
.nav{display:flex;gap:2px;flex:1}
.nav button{
  background:none;border:0;color:#8a8a82;cursor:pointer;font-family:'Syne',sans-serif;
  padding:16px 12px;font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;
}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-bottom-color:var(--accent)}
.util{display:flex;gap:6px;align-items:center}
.topbar .btn{background:#161616;border-color:#2f2f2f;color:#cfccc4;font-size:12px;padding:5px 10px}
.topbar .btn:hover{background:#1e1e1e;color:#fff;border-color:#444}
.wrap{max-width:1180px;margin:0 auto;padding:24px 30px 80px;position:relative;z-index:1}

/* ---------- atoms ---------- */
.btn{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);color:var(--ink);
  padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s;
}
.btn:hover{border-color:#555}
.btn.pri{background:var(--accent);color:#0d0d0d;border-color:var(--accent)}
.btn.pri:hover{background:#f0d15c;border-color:#f0d15c}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.dgr{color:var(--danger);border-color:#4a2a2a}
.btn.dgr:hover{background:#241717;border-color:var(--danger)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
label.f .req{color:var(--accent)}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--r);
  background:#141414;color:var(--ink);outline:0;
}
input::placeholder,textarea::placeholder{color:#5f5f59}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,197,71,.15)}
input.err{border-color:var(--danger);background:#1c1414}
select option{background:#141414;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
.tag{
  display:inline-block;padding:2px 7px;border-radius:3px;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;font-family:'IBM Plex Mono',monospace;
}
.tag.nda{background:var(--nda-bg);color:var(--nda)}
.tag.ndd{background:var(--ndd-bg);color:var(--ndd)}
.tag.gy{background:#1e1e1e;color:var(--ink2)}
.tag.av{background:#2a2113;color:var(--accent)}

/* ---------- home ---------- */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.home-head h1{font-size:26px;font-weight:800}
.home-head p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--card)}
.chips button{
  background:none;border:0;border-right:1px solid var(--rule);
  padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink2);
}
.chips button:last-child{border-right:0}
.chips button:hover{color:var(--ink)}
.chips button.on{background:var(--accent);color:#0d0d0d}
.filters input[type=text]{width:220px;padding:6px 9px}
.tbl{width:100%;border-collapse:collapse;background:var(--card)}
.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink2);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--rule);
  background:#131313;white-space:nowrap;
}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#151515}
.tbl .num{text-align:right;white-space:nowrap}
.row-acts{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.tbl td.actcell,.tbl th.actcell{position:sticky;right:0;background:var(--card);box-shadow:-10px 0 10px -10px rgba(0,0,0,.5)}
.tbl th.actcell{background:#131313}
.tbl tbody tr:hover td.actcell{background:#151515}
.empty{padding:56px 20px;text-align:center;color:var(--ink2);background:var(--card)}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--ink)}

/* ---------- editor ---------- */
.editor{display:grid;grid-template-columns:1fr 350px;gap:20px;align-items:start}
.sec{padding:18px}
.sec+.sec{margin-top:14px}
.sec h3{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);
  font-weight:700;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--rule2);
  display:flex;justify-content:space-between;align-items:center;
}
.per-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.per-grid label{
  border:1px solid var(--rule);border-radius:var(--r);padding:6px 4px;text-align:center;
  cursor:pointer;font-size:12px;font-weight:600;background:#141414;
}
.per-grid label:has(input:checked){background:var(--accent);color:#0d0d0d;border-color:var(--accent)}
.per-grid input{position:absolute;opacity:0;pointer-events:none}
.toggle{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:#141414}
.toggle button{flex:1;background:none;border:0;border-right:1px solid var(--rule);padding:10px 8px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2)}
.toggle button:last-child{border-right:0}
.toggle button:hover{background:#1a1a1a;color:var(--ink)}
.toggle button.on{background:var(--accent);color:#0d0d0d}
.toggle button.on.nda{background:var(--nda);color:#0d1a15}
.toggle button.on.ndd{background:var(--ndd);color:#0d1226}

/* ---------- ledger (signature) ---------- */
.rail{position:sticky;top:66px;max-height:calc(100vh - 84px);display:flex;flex-direction:column}
.rail-acts{flex:none}
.ledger{background:#131313;border:1px solid var(--rule);color:var(--ink);border-radius:var(--r);overflow:auto;flex:1 1 auto;min-height:0}
@media(max-width:920px){.rail{position:static;max-height:none}.ledger{overflow:visible}}
.ledger-h{padding:13px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline}
.ledger-h .k{font-family:'Syne';font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ledger-h .n{font-size:11px;color:var(--ink2);font-family:'IBM Plex Mono',monospace}
.lg{padding:14px 16px}
.lg-l{display:flex;justify-content:space-between;gap:10px;padding:3.5px 0;font-size:12.5px;color:#a8a89e;align-items:baseline}
.lg-l .lb{display:flex;align-items:baseline;gap:6px;min-width:0}
.lg-l .lb i{font-style:normal;font-size:10px;color:#6a6a62;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.lg-l .v{font-family:'IBM Plex Mono',monospace;white-space:nowrap;font-size:12.5px}
.lg-l.head{color:var(--ink);font-weight:700;font-size:13px}
.lg-l.sub{padding-left:10px}
.lg-l.neg .v{color:var(--warn)}
.lg-sep{height:1px;background:var(--rule);margin:9px 0}
.lg-tot{
  background:var(--accent);color:#0d0d0d;margin:12px -16px -14px;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;
}
.lg-tot .k{font-family:'Syne';font-weight:800;font-size:12px;letter-spacing:.04em;line-height:1.2}
.lg-tot .k small{display:block;font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#4a4526}
.lg-tot .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:23px;letter-spacing:-.02em}
.lg-foot{background:#181818;padding:10px 16px;font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.lg-foot .v{font-family:'IBM Plex Mono',monospace;color:#cfccc4}
.lg-diff{background:#181818;padding:11px 16px 13px}
.lg-diff-h{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#6a6a62;font-weight:700;margin-bottom:6px}
.lg-diff .lg-l{padding:2.5px 0}
.ledger-acts{display:flex;gap:8px;margin-top:12px}
.ledger-acts .btn{flex:1;justify-content:center}
.warnbox{background:#2a2113;border:1px solid #4a3e10;color:var(--warn);border-radius:var(--r);padding:9px 11px;font-size:12px;margin-top:12px}

/* ---------- settings ---------- */
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.subnav button{
  background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  padding:9px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2);font-family:'Syne';
}
.subnav button:hover{color:var(--ink)}
.subnav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.rates th{font-size:10.5px}
.rates td{padding:5px 8px}
.rates input{padding:5px 7px}
.rates input.tx{width:78px;text-align:right}
.rates .lbl{width:100%}
.grp-h{font-family:'Syne';font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:14px 0 8px;color:var(--ink2)}
.bar2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:820px){.bar2{grid-template-columns:1fr;gap:8px}}
.mini{font-size:12px;color:var(--ink2)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:100}
.mdl{background:#141414;border:1px solid var(--rule);border-radius:var(--r);width:100%;max-width:600px}
.mdl-h{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.mdl-h h3{font-size:16px;font-weight:800}
.mdl-b{padding:20px}
.mdl-f{padding:14px 20px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:8px;background:#101010}
.x{background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:2px 6px}
.x:hover{color:var(--ink)}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:#1c1c1c;color:var(--ink);border:1px solid var(--accent);padding:10px 18px;border-radius:var(--r);
  font-size:13px;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.5);
}

/* ---------- document preview / print (toujours noir sur blanc) ---------- */
#doc{background:#fff;color:#000}
.pv .ovl{padding:24px 20px}
.pv-mdl{background:#141414;border:1px solid var(--rule);border-radius:var(--r);width:100%;max-width:850px}
.pv-b{padding:0;max-height:none;background:#333;padding:20px;display:flex;justify-content:center}
.pv-page{background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;font-size:9.5pt;line-height:1.32;width:210mm;min-height:250mm;padding:18mm 16mm;box-shadow:0 3px 18px rgba(0,0,0,.55)}
.pv-page table,.pv-page tr,.pv-page td,.pv-page th{color:#000}
@media(max-width:920px){.pv-page{width:100%;padding:10mm}}
.d-hd{display:flex;justify-content:space-between;gap:30px}
.d-hd .l{max-width:55%}
.d-hd .r{text-align:left;min-width:180px}
.d-logo{width:auto;margin-bottom:8pt;display:block}
.d-nom{font-weight:bold}
.d-date{text-align:right;margin:26pt 0 30pt}
.d-title{text-align:center;font-weight:bold;font-size:11.5pt;margin-bottom:22pt}
.d-desc{margin-bottom:26pt}
.d-desc .h{font-weight:bold;margin-bottom:2pt;font-size:8.5pt}
.d-tb{width:100%;border-collapse:collapse}
.d-tb td{padding:2.2pt 4pt;vertical-align:bottom}
.d-tb td.n{text-align:right;white-space:nowrap}
.d-tb tr.b td{font-weight:bold}
.d-tb tr.i td{font-style:italic}
.d-tb tr.rl td{border-bottom:.7pt solid #000}
.d-box{border:.7pt solid #000;margin:9pt 0}
.d-box td{padding:2.6pt 5pt}
.d-box .hd td{font-weight:bold;font-style:italic;text-decoration:underline;padding-bottom:5pt}
.d-box .tt td{font-weight:bold;border-top:.7pt solid #000}
.d-net{display:flex;justify-content:space-between;align-items:center;margin:12pt 0 4pt;gap:20px}
.d-net .k{font-weight:bold;font-size:10.5pt}
.d-net .v{border:1pt solid #000;padding:5pt 12pt;font-weight:bold;font-size:10.5pt;min-width:110pt;text-align:right}
.d-fisc{display:flex;gap:26pt;font-style:italic;margin:9pt 0 0;padding-left:40pt}
.d-cond{margin-top:34pt;font-size:7.5pt}
.d-cond .h{font-weight:bold}
.d-sig{margin-top:40pt;display:flex;justify-content:space-around;font-size:8pt;color:#555}
.d-sig div{border-top:.5pt solid #999;padding-top:4pt;width:150pt;text-align:center}
.d-foot{margin-top:14pt;font-size:7pt;font-style:italic}
.cess{font-family:'Times New Roman',Georgia,serif;font-size:11pt;line-height:1.55;color:#000}
.cess-t{text-align:center;font-weight:bold;text-decoration:underline;letter-spacing:.02em;margin-top:20pt}
.cess-st{text-align:center;font-style:italic;margin-bottom:34pt}
.cess p{text-align:justify;margin:11pt 0}
.cess-c{text-align:center;margin:14pt 0;line-height:1.5}
.cess-sig{margin-top:34pt;text-align:right;padding-right:40pt;font-style:italic}
.pv-tabs{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pv-tabs button{background:#141414;border:0;border-right:1px solid var(--rule);padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink2)}
.pv-tabs button:last-child{border-right:0}
.pv-tabs button.on{background:var(--accent);color:#0d0d0d}

@media print{
  body{background:#fff}
  body::before{display:none !important}
  body>*{display:none !important}
  body>#printroot{display:block !important}
  #printroot{position:static}
  .pv-page{width:auto;min-height:0;padding:0;box-shadow:none;background:#fff !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pv-page *{color:#000 !important}
  @page{size:A4;margin:16mm}
}
#printroot{display:none}
</style>
<body style="visibility:hidden">

<div class="topbar">
  <a class="nav-logo" href="index.html"><img src="blzante_spiral_white.png" alt="BLZante" class="nav-logo-img" onerror="this.style.display='none'" /><span>BLZante</span></a>
  <span class="nav-label">Notes</span>
  <nav class="nav" id="nav"></nav>
  <div class="util">
    <span id="sync" style="font-size:.62rem;font-family:'Syne Mono',monospace;letter-spacing:.08em;margin-right:4px;align-self:center">○ Local</span>
    <button class="btn" onclick="exportJSON()">Exporter</button>
    <button class="btn" onclick="document.getElementById('imp').click()">Importer</button>
    <input type="file" id="imp" accept=".json" hidden onchange="importJSON(this)">
    <button class="btn" onclick="logout()">Déconnexion</button>
  </div>
</div>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="printroot"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

============================================================ */
const KEY='blz_notes_v1';
const FIREBASE_CONFIG={apiKey:"AIzaSyBuwwcRdlxLf7-ZdmUAi0ajB5uL3y-m800",authDomain:"blzante-toolbox.firebaseapp.com",databaseURL:"https://blzante-toolbox-default-rtdb.europe-west1.firebasedatabase.app",projectId:"blzante-toolbox",storageBucket:"blzante-toolbox.firebasestorage.app",messagingSenderId:"599088931653",appId:"1:599088931653:web:34f936e8302e894afb942c"};
const DB_PATH='notes';   // noeud RTDB où l'historique complet est stocké

function fbInit(){
  if(typeof firebase==='undefined'||!FIREBASE_CONFIG.apiKey)return false;
  try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);return true;}catch(e){console.warn('Firebase init KO',e);return false;}
}

const Store={
  mode:'local', ref:null, _t:null,
  async init(){
    if(!fbInit()){this.mode='local';return;}
    try{this.ref=firebase.database().ref(DB_PATH);this.mode='cloud';}
    catch(e){console.warn('RTDB indisponible — mode local.',e);this.mode='local';}
  },
  _cacheLocal(d){
    try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}
    if(window.storage){try{window.storage.set(KEY,JSON.stringify(d))}catch(e){}}
  },
  _readLocal(){
    if(window.storage){try{const r=window.storage.get(KEY);if(r&&r.then){return r.then(v=>v?JSON.parse(v.value):null)}}catch(e){}}
    try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}
  },
  async get(){
    if(this.mode==='cloud'){
      try{const snap=await this.ref.child('state').once('value');const v=snap.val();if(v)return v;}catch(e){console.warn('Lecture cloud KO',e);}
    }
    return await this._readLocal();
  },
  async set(d){
    this._cacheLocal(d);                       // cache/offline systématique
    if(this.mode==='cloud'&&this.ref){
      clearTimeout(this._t);
      this._t=setTimeout(()=>{this.ref.set({state:d,updated:Date.now()}).catch(e=>console.warn('Écriture cloud KO',e));},400);
    }
  },
  subscribe(cb){
    if(this.mode!=='cloud'||!this.ref)return;
    this.ref.child('state').on('value',snap=>{const v=snap.val();if(v)cb(v);},e=>console.warn('Écoute cloud KO',e));
  }
};

function dateFR(iso,jour){
  if(!iso)return'';
  const d=new Date(iso+'T12:00:00');
  const J=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return (jour?J[d.getDay()]+' ':'')+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
}

/* Trimestre de rattachement URSSAF (NDA) — ex. "2026-T3" */
function trimestreDefaut(iso){
  if(!iso)iso=new Date().toISOString().slice(0,10);
  const an=iso.slice(0,4), mo=parseInt(iso.slice(5,7),10);
  return an+'-T'+(Math.floor((mo-1)/3)+1);
}
const trimestreLabel=t=>t?t.replace('-T',' · T'):'—';
function trimestreOptions(n){
  const sel=n.trimestre||trimestreDefaut(n.date);
  const anRef=parseInt((n.date||new Date().toISOString()).slice(0,4),10);
  const opts=[];
  for(let y=anRef+1;y>=anRef-2;y--)for(let q=4;q>=1;q--)opts.push(y+'-T'+q);
  if(!opts.includes(sel))opts.unshift(sel);
  return opts.map(o=>`<option value="${o}" ${o===sel?'selected':''}>${o.slice(0,4)} — T${o.slice(-1)} (${['janv.–mars','avr.–juin','juil.–sept.','oct.–déc.'][+o.slice(-1)-1]})</option>`).join('');
}

/* ============================================================
   CALCUL
============================================================ */
function calc(n){
  const b=bar(n.baremeId), a=art(n.artisteId), brut=Number(n.brut)||0;
  const tva=a?!!a.tvaAssujetti:false;
  const horsUE=a?!!a.horsUE:false;
  if(n.type==='NDD'){
    const cfg=b.ndd;
    const mtva=(tva&&!horsUE)?r2(brut*cfg.tvaTaux/100):0;
    const ttc=r2(brut+mtva);
    const lignes=horsUE?[]:cfg.lignes.map(l=>{const x=brut*(l.base/100)*(l.taux/100);return{...l,exact:x,m:r2(x)}});
    const ret=r2(lignes.reduce((s,l)=>s+l.exact,0));
    const csgd=lignes.filter(l=>l.deduct).reduce((s,l)=>s+l.exact,0);
    return{tva,horsUE,brut,mtva,ttc,lignes,ret,net:r2(ttc-ret),netImp:r2(brut-csgd),tvaTaux:cfg.tvaTaux,seuil:cfg.seuilFranchise};
  }
  const cfg=b.nda;
  const tvaColl=horsUE?0:r2(brut*cfg.tvaCollectee/100);
  const tvaDed=(tva||horsUE)?0:r2(brut*cfg.tvaDeductible/100);
  const ttc=r2(brut+tvaColl-tvaDed);
  const lignes=horsUE?[]:cfg.lignes.map(l=>{
    const base=(l.plafonne?Math.min(brut,cfg.plafond):brut)*(l.base/100);
    const x=base*(l.taux/100);
    return{...l,exact:x,m:r2(x)};
  });
  const ret=r2(lignes.reduce((s,l)=>s+l.exact,0));
  const fisc=lignes.filter(l=>l.fiscal).reduce((s,l)=>s+l.exact,0);
  const diff=cfg.diffuseur.map(l=>{const x=brut*(l.base/100)*(l.taux/100);return{...l,exact:x,m:r2(x)}});
  const urssaf=r2(diff.reduce((s,l)=>s+l.exact,0)+ret);
  return{tva,horsUE,brut,tvaColl,tvaDed,ttc,lignes,ret,net:r2(ttc-ret),netFisc:r2(ttc-fisc),diff,urssaf,
         tauxColl:cfg.tvaCollectee,tauxDed:cfg.tvaDeductible,plafond:cfg.plafond};
}

   type · société · année · mois · séquence.
   Compteur remis à 001 chaque mois (réglable en annuel).
============================================================ */
const RX_NUM=/^(NDA|NDD)-(.+)-(\d{4})-(\d{2})-(\d{3})$/;
function numero(type,societeId,date,selfId){
  const s=soc(societeId); if(!s||!date)return'';
  const an=date.slice(0,4), mo=date.slice(5,7);
  const mensuel=(D.reglages?.compteur||'mois')==='mois';
  const pre=type+'-'+(s.code||'XXX')+'-'+an+'-'+mo+'-';
  const scope=type+'|'+(s.code||'XXX')+'|'+an+'|'+(mensuel?mo:'');
  let max=0;
  D.notes.forEach(n=>{
    if(n.id===selfId||!n.numero)return;
    const m=n.numero.match(RX_NUM); if(!m)return;
    if(m[1]+'|'+m[2]+'|'+m[3]+'|'+(mensuel?m[4]:'')!==scope)return;
    const v=parseInt(m[5],10); if(v>max)max=v;
  });
  return pre+String(max+1).padStart(3,'0');
}
function montantFichier(v){return (Math.round((Number(v)||0)*100)/100).toFixed(2).replace('.','-');}
function fichier(n){
  const a=art(n.artisteId),c=calc(n);
  return (n.date||'').replace(/-/g,'')+'_'+montantFichier(c.net)+'_'+montantFichier(c.brut)+'_'+(n.numero||'note')+(a?'_'+slug(nomArt(a)):'')+'.pdf';
}
function fichierCession(n){
  const a=art(n.artisteId),s=soc(n.societeId);
  return (n.date||'').replace(/-/g,'')+'_cession_de_creance'+(a?'_'+slug(nomArt(a)):'')+(s?'_'+slug(s.code):'')+'.pdf';
}

/* Nombre entier -> lettres (français, jusqu'aux millions) */
function enLettres(n){
  n=Math.floor(Math.abs(n));
  if(n===0)return'zéro';
  const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const t=['','','vingt','trente','quarante','cinquante','soixante'];
  const b100=x=>{
    if(x<20)return u[x];
    if(x<70){const d=Math.floor(x/10),r=x%10;return t[d]+(r===1?' et un':r?'-'+u[r]:'');}
    if(x<80){const r=x-60;return (r===11?'soixante et onze':'soixante-'+u[r]);}
    if(x<100){const r=x-80;return r===0?'quatre-vingts':'quatre-vingt-'+u[r];}
  };
  const b1000=x=>{
    if(x<100)return b100(x);
    const c=Math.floor(x/100),r=x%100;
    if(c===1)return r===0?'cent':'cent '+b100(r);
    return u[c]+(r===0?' cents':' cent '+b100(r));
  };
  const parts=[];
  const mi=Math.floor(n/1000000);n%=1000000;
  const mille=Math.floor(n/1000),reste=n%1000;
  if(mi)parts.push(mi===1?'un million':b1000(mi)+' millions');
  if(mille)parts.push(mille===1?'mille':b1000(mille)+' mille');
  if(reste)parts.push(b1000(reste));
  return parts.join(' ');
}
/* Montant € -> "chiffres (lettres)" façon cession */
function montantMots(v){
  v=Math.round((Number(v)||0)*100)/100;
  const ent=Math.floor(v),cts=Math.round((v-ent)*100);
  const chiffres=cts?v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\u202f|\u00a0/g,' ')
                    :ent.toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ');
  const lettres=enLettres(ent)+(cts?' virgule '+enLettres(cts):'');
  return{chiffres,lettres};
}
/* Montant retenu pour la cession (brut HT du contrat par défaut) */
function cessionMontant(n){
  return (n.cessionMontant!==undefined&&n.cessionMontant!=='')?Number(n.cessionMontant):(Number(n.brut)||0);
}
/* Une cession de créance n'existe que pour une NDA (droits d'auteur SACEM) en avance */
function hasCession(n){return n.type==='NDA'&&n.versement==='avance';}

  ].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');

  view=v;render();window.scrollTo(0,0);

function toast(m){
  const t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

function newNote(){
  ed={id:uid(),type:'NDA',societeId:D.societes[0]?.id||'',artisteId:'',baremeId:D.baremes[0].id,
      date:new Date().toISOString().slice(0,10),versement:'du',brut:'',objet:'',periodes:[],trimestre:'',cessionMontant:'',cessionLieu:'Paris',numero:'',cree:Date.now(),nouveau:true};
  ed.numero=numero(ed.type,ed.societeId,ed.date,ed.id);
}
function edit(id){ed={...D.notes.find(n=>n.id===id),nouveau:false};view='new';render();window.scrollTo(0,0)}
function dup(id){
  const s=D.notes.find(n=>n.id===id);
  ed={...s,id:uid(),date:new Date().toISOString().slice(0,10),cree:Date.now(),nouveau:true};
  ed.numero=numero(ed.type,ed.societeId,ed.date,ed.id);
  view='new';render();window.scrollTo(0,0);toast('Note dupliquée — vérifiez le montant et l’objet');
}
function del(id){
  const n=D.notes.find(x=>x.id===id);
  if(!confirm('Supprimer la note '+(n.numero||'')+' ? Cette action est définitive.'))return;
  D.notes=D.notes.filter(x=>x.id!==id);save();render();toast('Note supprimée');
}

function refreshLight(){
  const c=calc(ed);
  const lg=document.getElementById('ledger'); if(lg)lg.innerHTML=ledgerHTML(ed,c);
  const w=document.getElementById('warn'); if(w)w.innerHTML=warnHTML(ed);
  const nh=document.getElementById('numHead'); if(nh)nh.textContent=ed.numero||'Numéro attribué à l’enregistrement';
  const cb=document.getElementById('cessBox'); if(cb){const m=montantMots(cessionMontant(ed));

function setEd(k,v,light){
  ed[k]=v;
  if(k==='type'){                              // change la structure du formulaire → rebuild
    if(ed.nouveau)ed.numero=numero(ed.type,ed.societeId,ed.date,ed.id);
    render();return;
  }
  if(k==='societeId'||k==='date'){             // maj légère : n'écrase pas le champ en cours de saisie
    if(ed.nouveau)ed.numero=numero(ed.type,ed.societeId,ed.date,ed.id);
    refreshLight();return;
  }
  if(light){refreshLight();return;}
  render();
}
function togglePer(p){
  ed.periodes=ed.periodes.includes(p)?ed.periodes.filter(x=>x!==p):[...ed.periodes,p];
  ed.periodes.sort();
  const c=calc(ed);document.getElementById('ledger').innerHTML=ledgerHTML(ed,c);
}
function saveNote(){
  if(!ed.societeId)return toast('Choisissez une société émettrice');
  if(!ed.artisteId)return toast('Choisissez une fiche artiste');
  if(!Number(ed.brut))return toast('Renseignez le montant brut HT');
  if(!ed.objet.trim())return toast(ed.type==='NDA'?'Décrivez les droits cédés':'Renseignez l’objet de la note');
  if(!ed.numero)ed.numero=numero(ed.type,ed.societeId,ed.date,ed.id);
  const n={...ed};delete n.nouveau;
  const i=D.notes.findIndex(x=>x.id===n.id);
  i>=0?D.notes[i]=n:D.notes.push(n);
  save();view='home';render();toast('Note '+n.numero+' enregistrée');
}

function preview(id){
  const n=id?D.notes.find(x=>x.id===id):ed;
  if(!n.artisteId)return toast('Choisissez une fiche artiste pour générer le document');
  if(!n.societeId)return toast('Choisissez une société émettrice');
  const nm=numero(n.type,n.societeId,n.date,n.id);
  const nn={...n,numero:n.numero||nm};
  window._pn=nn;
  window._pv=(window._pvForce==='cess'&&hasCession(nn))?'cess':'note';
  window._pvForce=null;
  drawPreview();
}
function drawPreview(){
  const nn=window._pn, isCess=window._pv==='cess', avance=hasCession(nn);
  const titre=isCess?'Cession de créance — SACEM':(nn.type==='NDA'?'Note de droits d’auteur':'Note de débit');
  const fic=isCess?fichierCession(nn):fichier(nn);
  const body=isCess?cessionHTML(nn):docHTML(nn);
  const tabs=avance?`<div class="pv-tabs">
      <button class="${!isCess?'on':''}" onclick="switchPv('note')">Note</button>
      <button class="${isCess?'on':''}" onclick="switchPv('cess')">Cession de créance</button>
    </div>`:'';
  document.getElementById('modal').innerHTML=`<div class="pv"><div class="ovl" onclick="if(event.target===this)closeM()">
    <div class="pv-mdl">
      <div class="mdl-h">
        <div><h3>${titre}</h3>

        <div style="display:flex;gap:8px;align-items:center">

          <button class="x" onclick="closeM()">×</button>

      </div>
      <div class="pv-b"><div class="pv-page" id="doc">${body}</div></div>
    </div></div></div>`;
}
function switchPv(v){window._pv=v;drawPreview()}
function printDoc(){
  const nn=window._pn, isCess=window._pv==='cess';
  document.title=(isCess?fichierCession(nn):fichier(nn)).replace(/\.pdf$/,'');
  document.getElementById('printroot').innerHTML='<div class="pv-page">'+(isCess?cessionHTML(nn):docHTML(nn))+'</div>';
  window.print();
  setTimeout(()=>{document.title='BLZ — Notes NDA / NDD';document.getElementById('printroot').innerHTML=''},500);
}

const pathOf=(b,t)=>t==='nddL'?b.ndd.lignes:t==='ndaL'?b.nda.lignes:b.nda.diffuseur;
function setB(id,k,v){bar(id)[k]=v;save()}
function setB2(id,g,k,v){bar(id)[g][k]=Number(v);save();render()}
function setL(id,t,lid,k,v){
  const l=pathOf(bar(id),t).find(x=>x.id===lid);
  l[k]=(k==='taux'||k==='base')?Number(v):v;save();
  if(k==='taux'||k==='base')return;render();
}
function addL(id,t){
  const d=t==='nddL'?{deduct:false}:t==='ndaL'?{plafonne:false,fiscal:false}:{};
  pathOf(bar(id),t).push({id:uid(),libelle:'Nouvelle ligne',taux:0,base:100,...d});save();render();
}
function delL(id,t,lid){
  const arr=pathOf(bar(id),t),i=arr.findIndex(x=>x.id===lid);
  if(!confirm('Supprimer « '+arr[i].libelle+' » de ce barème ?'))return;
  arr.splice(i,1);save();render();
}
function addB(){D.baremes.push({...baremeDefaut(),nom:'Barème '+(new Date().getFullYear()+1)});save();render()}
function dupB(id){
  const b=JSON.parse(JSON.stringify(bar(id)));
  b.id=uid();b.annee=(b.annee||2026)+1;b.nom='Barème '+b.annee;
  [b.ndd.lignes,b.nda.lignes,b.nda.diffuseur].forEach(a=>a.forEach(l=>l.id=uid()));
  D.baremes.push(b);save();render();toast('Barème dupliqué — mettez les taux à jour');
}
function delB(id){
  const b=bar(id);
  if(D.notes.some(n=>n.baremeId===id))return toast('Barème utilisé par des notes existantes — impossible de le supprimer');
  if(!confirm('Supprimer « '+b.nom+' » ?'))return;
  D.baremes=D.baremes.filter(x=>x.id!==id);save();render();
}

function okSoc(id,exist){
  const g=k=>document.getElementById(k).value.trim();
  if(!g('s_nom'))return toast('Le nom est obligatoire');
  if(!g('s_code'))return toast('Le code est obligatoire');
  const o={id,nom:g('s_nom'),nomCom:g('s_nc'),code:g('s_code').toUpperCase(),adresse:g('s_adr'),
    siret:g('s_siret'),siren:g('s_siren'),tva:g('s_tva'),diffuseur:g('s_dif'),logo:document.getElementById('s_logo').value};
  exist?D.societes[D.societes.findIndex(x=>x.id===id)]=o:D.societes.push(o);
  save();closeM();render();toast(exist?'Société mise à jour':'Société ajoutée');
}
function delSoc(id){
  if(D.notes.some(n=>n.societeId===id))return toast('Société utilisée par des notes existantes — impossible de la supprimer');
  if(!confirm('Supprimer « '+soc(id).nom+' » ?'))return;
  D.societes=D.societes.filter(x=>x.id!==id);save();render();
}

/* ============================================================
   EXPORT / IMPORT
============================================================ */
function logout(){
  try{if(typeof firebase!=='undefined'&&firebase.auth){firebase.auth().signOut().then(()=>location.href='login.html');return;}}catch(e){}
  location.href='index.html';
}
function exportJSON(){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='blz-notes_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  URL.revokeObjectURL(u);toast('Données exportées');
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.baremes||!d.societes)throw 0;
      if(!confirm('Remplacer toutes les données actuelles par le contenu de ce fichier ?'))return;
      D=d;await save();render();toast('Données importées');
    }catch(e){toast('Fichier illisible — export attendu au format JSON')}
    inp.value='';
  };
  r.readAsText(f);
}

/* ============================================================
   INIT
============================================================ */
function migrate(D){
  D.baremes=D.baremes?.length?D.baremes:[baremeDefaut()];
  D.societes=D.societes||[];D.artistes=D.artistes||[];D.notes=D.notes||[];
  D.reglages=D.reglages||{compteur:'mois'};
  D.societes.forEach(s=>{s.nomCom=s.nomCom||'';s.siren=s.siren||'';s.diffuseur=s.diffuseur||'';
    if(s.logo===undefined)s.logo=/ante/i.test(s.nom)?'blzante':'blz';
    if(!s.siren){if(/ante/i.test(s.nom))s.siren='940 394 877 R.C.S. Paris';else if(/publishing/i.test(s.nom))s.siren='RCS Paris 537 373 524';}});
  if(!D.societes.some(s=>/rossinante/i.test(s.nom)||(s.siren||'').includes('817 959 315')))
    D.societes.push({id:uid(),nom:'Rossinante',nomCom:'Les Autres MGMT',code:'ROSS',adresse:'76 rue du Ruisseau\n75018 Paris',siret:'817 959 315 00018',siren:'817 959 315 R.C.S. Paris',tva:'FR87817959315',diffuseur:'',logo:''});
  D.baremes.forEach(b=>{
    if(!b.nda.tvaSwapV2){
      if(b.nda.tvaDeductible>b.nda.tvaCollectee){const t=b.nda.tvaDeductible;b.nda.tvaDeductible=b.nda.tvaCollectee;b.nda.tvaCollectee=t;}
      b.nda.tvaSwapV2=true;
    }
  });
  return D;
}
function syncPill(){
  const el=document.getElementById('sync'); if(!el)return;
  el.textContent=Store.mode==='cloud'?'● Partagé (cloud)':'○ Local';
  el.title=Store.mode==='cloud'?'Historique synchronisé via Firebase':'Données locales à ce navigateur';
  el.style.color=Store.mode==='cloud'?'#7BD88F':'#8A93A0';
}
function boot(){
  (async()=>{
    await Store.init();
    D=migrate(await Store.get()||seed());
    save();
    render();syncPill();
    Store.subscribe(remote=>{                  // maj temps réel (autre poste)
      if(view==='new')return;                  // ne pas perturber une saisie en cours
      D=migrate(remote);
      render();syncPill();
    });
  })();
}
/* Accès protégé par l'authentification de la Toolbox (comme les autres outils) */
(function(){
  if(!fbInit()){document.body.style.visibility='visible';boot();return;}
  let booted=false;
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){location.href='login.html';return;}
    document.body.style.visibility='visible';
    if(!booted){booted=true;boot();}
  });
})();
</script>
