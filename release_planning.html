<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Release Planning — BLZante Toolbox</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&display=swap');
:root { --bg: #0a0a0a; --surface: #141414; --border: #262626; --text: #e8e8e8; --muted: #777; --accent: #e8c547; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Syne Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 60px 60px; opacity: 0.3; pointer-events: none; z-index: 0; }


/* ---- passage d'un outil à l'autre ---- */
nav{z-index:40}
.tsw{position:relative}
.tsw-btn{display:inline-flex;align-items:center;gap:7px;background:none;cursor:pointer;
 border:1px solid var(--border);color:var(--text);font-family:'Syne Mono',monospace;font-size:.6rem;
 letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;transition:border-color .15s,color .15s}
.tsw-btn:hover,.tsw-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.tsw-car{font-size:.55rem;opacity:.7}
.tsw-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;backdrop-filter:blur(2px);min-width:230px;
 background:var(--surface);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:5px}
.tsw-menu[hidden]{display:none}
.tsw-t{font-family:'Syne Mono',monospace;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;
 color:var(--muted);padding:7px 9px 3px}
.tsw-menu a{display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:7px 9px;text-decoration:none;color:var(--text);font-size:.7rem;border-left:2px solid transparent}
.tsw-menu a:hover{background:rgba(255,255,255,.055)}
.tsw-menu a.on{border-left-color:var(--accent);color:var(--accent)}
.tsw-menu a .k{font-family:'Syne Mono',monospace;font-size:.5rem;color:var(--muted);letter-spacing:.08em}

nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
.nav-logo { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; }
.nav-logo-img { height: 28px; width: auto; display: block; }
.nav-right { display: flex; align-items: center; gap: 12px; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
.nav-back { color: var(--muted); text-decoration: none; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.15s; }
.nav-back:hover { color: #fff; }
.nav-sep { color: var(--border); }

.container { max-width: 900px; margin: 0 auto; padding: 40px 40px 60px; position: relative; z-index: 1; flex: 1; width: 100%; }

.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
.header-row h1 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--text); line-height: 1.3; }
.add-btn { font-family: 'Syne', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); color: var(--text); text-decoration: none; transition: all 0.2s; }
.add-btn:hover { border-color: #555; color: #fff; }

/* Filters */
.filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-btn {
  font-family: 'Syne Mono', monospace; font-size: 0.62rem; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 5px 12px; background: transparent;
  border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.filter-btn:hover { border-color: #555; color: var(--text); }
.filter-btn.active { border-color: var(--accent); color: var(--accent); }
.sw-filters { margin-top: 4px; }
.filter-label { font-size: 0.55rem; color: #444; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 4px; }

/* Stats */
.stats { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 16px; }
.date-range-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.date-label {
  font-family: 'Syne Mono', monospace; font-size: 0.6rem; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.date-input {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  font-family: 'Syne Mono', monospace; font-size: 0.65rem; padding: 5px 8px;
  outline: none; transition: border-color 0.15s;
}
.date-input:focus { border-color: var(--accent); }
.date-clear {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font-size: 0.7rem; padding: 4px 8px; cursor: pointer; transition: all 0.15s;
  font-family: 'Syne Mono', monospace; display: none;
}
.date-clear.visible { display: inline-block; }
.date-clear:hover { color: var(--text); border-color: var(--text); }

/* Dashboard */
.dashboard-wrap { margin-bottom: 28px; }
.dashboard-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.dashboard-title { font-family: 'Syne', sans-serif; font-size: 0.9rem; font-weight: 800; color: #fff; letter-spacing: 0.02em; }
.dashboard-title span { color: var(--accent); }
.period-btns { display: flex; gap: 1px; background: var(--border); border: 1px solid var(--border); }
.period-btn {
  background: var(--bg); border: none; color: var(--muted); font-family: 'Syne Mono', monospace;
  font-size: 0.52rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 5px 12px; cursor: pointer; transition: all 0.15s;
}
.period-btn:hover { color: #fff; background: #111; }
.period-btn.active { color: var(--accent); background: #1a1708; }
.dashboard-recap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.dashboard-recap:empty { display: none; }
.dash-card { background: var(--bg); padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; }
.dash-num { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; color: #fff; line-height: 1; }
.dash-num.accent { color: var(--accent); }
.dash-num.orange { color: #f59e0b; }
.dash-num.green { color: #4ade80; }
.dash-num.red { color: #FF2D3A; }
.dash-label { font-family: 'Syne Mono', monospace; font-size: 0.48rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.3; }
.intl-short { display: none; }
.intl-full { display: inline; }

/* Month groups */
.month-group { margin-bottom: 20px; }
.month-label {
  font-family: 'Syne', sans-serif; font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
}

/* Release items - cleaner grid */
.release-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
.release-item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 0 14px;
  align-items: center; padding: 10px 14px; background: var(--bg); font-size: 0.72rem;
  transition: background 0.15s;
}
.release-item.has-art {
  grid-template-columns: auto auto 1fr auto;
}
.release-item:hover { background: #111; }
.release-item.annule { opacity: 0.3; text-decoration: line-through; }

.rel-artwork { width: 42px; height: 42px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; border-radius: 2px; }

.rel-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.rel-date { color: #888; font-size: 0.62rem; font-family: 'Syne Mono', monospace; min-width: 68px; }
.rel-type {
  font-family: 'Syne Mono', monospace;
  font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 6px; border: 1px solid var(--border); text-align: center; color: var(--muted); white-space: nowrap;
}
.rel-status {
  font-family: 'Syne Mono', monospace;
  font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 6px; text-align: center; min-width: 48px; white-space: nowrap;
}
.rel-status.confirme { color: #4ade80; border: 1px solid #1a3a1a; }
.rel-status.tbc { color: #f1c40f; border: 1px solid #4a3e10; }
.rel-status.annule { color: #ff6b6b; border: 1px solid #4a1a1a; }
.rel-sacem {
  font-family: 'Syne Mono', monospace;
  font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 6px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
}
.rel-sacem.depose { color: #4ade80; border-color: #1a3a1a; }
.rel-sacem.en_cours { color: #f1c40f; border-color: #4a3e10; }
.rel-sacem.a_lancer { color: #ff9f6b; border-color: #4a2e1a; }
.rel-sacem.a_definir { color: #777; border-color: var(--border); }
.rel-sacem.non_editeur { color: #888; border-color: var(--border); font-style: italic; }
.rel-tracks .dot.non_editeur { background: #555; }
.rel-tracks { color: #666; font-size: 0.55rem; font-family: 'Syne Mono', monospace; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.rel-tracks .pt { display: inline-flex; align-items: center; gap: 4px; }
.rel-tracks .dot { width: 5px; height: 5px; border-radius: 50%; background: #444; flex-shrink: 0; }
.rel-tracks .dot.depose { background: #4ade80; }
.rel-tracks .dot.en_cours { background: #f1c40f; }
.rel-tracks .dot.a_lancer { background: #ff9f6b; }
.rel-tracks .tt { color: #bbb; }
.rel-flag { font-size: 0.65rem; flex-shrink: 0; white-space: nowrap; color: #999; }
.rel-flag img { vertical-align: middle; margin-right: 2px; }


.rel-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rel-artist { color: #fff; font-weight: 700; font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel-title { color: #999; font-size: 0.62rem; font-family: 'Syne Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel-sw { color: #444; font-size: 0.55rem; font-family: 'Syne Mono', monospace; }
.rel-desc { color: #888; font-size: 0.58rem; font-style: italic; }
.rel-blz { color: #bbb; font-size: 0.55rem; font-family: 'Syne Mono', monospace; font-weight: 600; }

.rel-edit {
  cursor: pointer; color: #333; font-size: 0.55rem; letter-spacing: 0.06em;
  text-decoration: none; transition: color 0.15s; text-transform: uppercase;
  font-family: 'Syne Mono', monospace; padding: 4px 8px; border: 1px solid transparent;
}
.rel-edit:hover { color: var(--text); border-color: var(--border); }

.empty-msg { text-align: center; padding: 48px 20px; color: #444; font-size: 0.78rem; }
.empty-msg a { color: var(--accent); text-decoration: none; }
.empty-msg a:hover { text-decoration: underline; }
.load-more-indicator { text-align: center; padding: 24px 0 40px; }
.load-more-text { font-family: 'Syne Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

.today-marker { border-left: 2px solid var(--accent); }

@media (max-width: 560px) {
  nav { padding: 16px 20px; }
  .container { padding: 28px 20px 40px; }
  .dashboard-header { flex-direction: column; align-items: flex-start; gap: 8px; }
  .dashboard-recap { grid-template-columns: repeat(3, 1fr); }
  .intl-full { display: none; }
  .intl-short { display: inline; }
  .release-item {
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 2px 8px;
    padding: 10px 12px;
  }
  .release-item.has-art {
    grid-template-columns: auto 1fr auto;
  }
  .rel-artwork { width: 36px; height: 36px; grid-row: 1 / 3; align-self: center; }
  .rel-meta { gap: 4px; flex-wrap: wrap; grid-row: 1; }
  .rel-info { grid-column: 1 / -1; }
  .release-item.has-art .rel-info { grid-column: 2 / -1; }
  .rel-edit { grid-row: 1; align-self: center; }
  .rel-date { font-size: 0.58rem; }
  .rel-type, .rel-status { font-size: 0.46rem; padding: 1px 4px; }
}
</style>

<script>
const DB = 'https://blzante-toolbox-default-rtdb.europe-west1.firebasedatabase.app';
const FIREBASE_CONFIG={apiKey:"AIzaSyBuwwcRdlxLf7-ZdmUAi0ajB5uL3y-m800",authDomain:"blzante-toolbox.firebaseapp.com",databaseURL:"https://blzante-toolbox-default-rtdb.europe-west1.firebasedatabase.app",projectId:"blzante-toolbox",storageBucket:"blzante-toolbox.firebasestorage.app",messagingSenderId:"599088931653",appId:"1:599088931653:web:34f936e8302e894afb942c"};

window._fbToken='';
function dbFetch(path,opts){const sep=path.includes('?')?'&':'?';return fetch(DB+path+sep+'auth='+window._fbToken,opts);}
function _waitAuth(){return new Promise((res,rej)=>{firebase.auth().onAuthStateChanged(async u=>{if(!u){window.location.href='login.html';rej();}else{window._fbToken=await u.getIdToken();document.body.style.visibility='visible';res(u);}});});}


/* ---- passage d'un outil à l'autre, depuis n'importe quelle page ---- */
(function(){
  var OUTILS=[
    ['Principaux',[['roster.html','Roster','R'],['release_planning.html','Planning','P'],
      ['ig_generator.html','IG Content','I'],['catalogues.html','Catalogues','C']]],
    ['Créer',[['roster_create.html','+ Fiche artiste',''],['release_create.html','+ Event planning',''],
      ['sacem_depot.html','SACEM Dépôt','']]],
    ['Admin',[['notes.html','Notes NDA / NDD',''],['onid_blzante.html','ONID BLZante',''],
      ['infos_sacem.html','Infos Sacem',''],['infos_facturation.html','Infos facturation',''],
      ['index.html','Toutes les pages','']]]
  ];
  var b=document.getElementById('tswBtn'),m=document.getElementById('tswMenu');
  if(!b||!m)return;
  var ici=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  m.innerHTML=OUTILS.map(function(g){
    return '<div class="tsw-t">'+g[0]+'</div>'+g[1].map(function(o){
      return '<a href="'+o[0]+'"'+(o[0].toLowerCase()===ici?' class="on"':'')+'>'+o[1]+
        (o[2]?'<span class="k">'+o[2]+'</span>':'')+'</a>';}).join('');}).join('');
  function ouvrir(v){m.hidden=!v;b.setAttribute('aria-expanded',v?'true':'false');}
  b.addEventListener('click',function(e){e.stopPropagation();ouvrir(m.hidden);});
  document.addEventListener('click',function(e){if(!m.hidden&&!m.contains(e.target))ouvrir(false);});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')return ouvrir(false);
    var t=e.target&&e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;
    var k=String(e.key||'').toUpperCase();
    if(k==='O')return ouvrir(m.hidden);
    var dest={R:'roster.html',P:'release_planning.html',I:'ig_generator.html',C:'catalogues.html'}[k];
    if(dest&&dest.toLowerCase()!==ici)location.href=dest;
  });
})();

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// ─── Statut Sacem des titres BLZante (posé par l'outil Catalogues ou la fiche event) ───
const SACEM_LIB = { a_definir: 'À définir', a_lancer: 'À lancer', en_cours: 'En cours',
  depose: 'Déposé à la Sacem', non_editeur: "Non éditeur sur l'œuvre" };
const SACEM_FAIT = { depose: 1, non_editeur: 1 };   // rien à lancer sur ces deux-là
// Même normalisation que l'outil Catalogues : les clés doivent correspondre des deux côtés.
const normT = s => String(s == null ? '' : s).replace(/œ/g, 'oe').replace(/Œ/g, 'OE').replace(/æ/g, 'ae').replace(/Æ/g, 'AE')
  .replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
// Une piste par titre BLZante, avec son featuring et son statut de dépôt
function pistesSacem(r) {
  if (!['Single', 'EP', 'Album'].includes(r.type)) return [];
  const sacem = r.sacem || {}, oeuvres = r.oeuvres || {};
  const feats = {};
  (Array.isArray(r.blzTracks) ? r.blzTracks : []).forEach(t => {
    if (t && t.title) feats[normT(t.title)] = (t.featurings || []).join(', '); });
  let titres = (Array.isArray(r.blzTracks) ? r.blzTracks : []).map(t => t && t.title).filter(Boolean);
  if (!titres.length) titres = r.type === 'Single'
    ? [r.track || r.title || ''].filter(Boolean)
    : String(r.blzTrackNames || '').split(/\n|,|;/).map(x => x.trim()).filter(Boolean);
  const vus = {};
  titres.forEach(t => { vus[normT(t)] = 1; });
  // un titre connu seulement côté Sacem / œuvres (lien posé depuis le Catalogue)
  Object.keys(sacem).concat(Object.keys(oeuvres)).forEach(k => {
    if (vus[k]) return; vus[k] = 1;
    titres.push((oeuvres[k] && oeuvres[k].titre) || k);
  });
  if (!titres.length) return [];
  return titres.map(t => {
    const k = normT(t);
    return { titre: t, feat: feats[k] || '', statut: SACEM_LIB[sacem[k]] ? sacem[k] : 'a_definir' };
  });
}
function sacemResume(r) {
  const p = pistesSacem(r);
  if (!p.length) return null;
  const n = v => p.filter(x => x.statut === v).length;
  const faits = p.filter(x => SACEM_FAIT[x.statut]).length;
  if (n('non_editeur') === p.length) return { cls: 'non_editeur', lbl: 'Non éditeur' };
  if (faits === p.length) return { cls: 'depose', lbl: 'Sacem ✓' };
  const cls = n('a_definir') ? 'a_definir' : n('a_lancer') ? 'a_lancer' : 'en_cours';
  const lbl = n('a_definir') === p.length ? 'Sacem à définir' : 'Sacem ' + faits + '/' + p.length;
  return { cls, lbl };
}

// Songwriter rename mapping: old name → new name
const SW_RENAME = {
  'LEANDRE': 'LEANDRE PICK',
  'YANNICK SERI': 'LE SERI',
  'BRO': 'BRÖ'
};
function mapSwName(name) { return SW_RENAME[name] || name; }

let activeFilter = 'all';
let activeSw = 'all';
let dateFrom = '';
let dateTo = '';
let cachedReleases = [];
const PAGE_INITIAL = 50;
const PAGE_INCREMENT = 30;
let displayLimit = PAGE_INITIAL;
let totalFiltered = 0;

function applyDateFilter(releases) {
  if (!dateFrom && !dateTo) return releases;
  return releases.filter(r => {
    if (dateFrom && r.dateSortable < dateFrom) return false;
    if (dateTo && r.dateSortable > dateTo) return false;
    return true;
  });
}

async function fetchReleases() {
  try {
    const res = await dbFetch('/releases.json');
    const data = await res.json();
    if (!data) { cachedReleases = []; return; }
    cachedReleases = Object.values(data).sort((a, b) => (a.dateSortable || '').localeCompare(b.dateSortable || ''));
    // Apply songwriter renames to cached data
    cachedReleases.forEach(r => {
      if (r.songwriters) {
        const sw = Array.isArray(r.songwriters) ? r.songwriters : [r.songwriters];
        r.songwriters = sw.map(mapSwName);
      }
    });
  } catch (err) {
    document.getElementById('stats').textContent = '⚠ Erreur de connexion';
  }
}

// Songwriters signés chez BLZante, publiés par l'outil Catalogues
let SIGNES = null;
async function chargerSignes() {
  try {
    const r = await dbFetch('/editions/signes.json');
    const d = r.ok ? await r.json() : null;
    SIGNES = d && Object.keys(d).length ? d : null;
  } catch (e) { SIGNES = null; }
}
function estSigne(nom) { return !SIGNES || !!SIGNES[normT(nom)]; }
function buildSwFilters() {
  const swSet = new Set();
  cachedReleases.forEach(r => {
    if (r.songwriters) {
      const sw = Array.isArray(r.songwriters) ? r.songwriters : [r.songwriters];
      sw.forEach(s => { if (estSigne(s)) swSet.add(s); });
    }
  });
  const sorted = [...swSet].sort();
  const container = document.getElementById('swFilters');
  container.innerHTML = '<button class="filter-btn active" data-sw="all">Tout</button>' +
    sorted.map(sw => `<button class="filter-btn" data-sw="${sw}">${sw}</button>`).join('');
}

// ─── Dashboard recap ───
let dashPeriod = 6; // 6, 12, 'all', or 'upcoming'

function buildDashboard() {
  const dash = document.getElementById('dashboardRecap');
  if (!cachedReleases.length) { dash.innerHTML = ''; return; }

  const now = new Date();
  const today = now.toISOString().slice(0, 10);

  let recent;
  if (dashPeriod === 'upcoming') {
    // Only future events
    recent = cachedReleases.filter(r => r.dateSortable > today && r.status !== 'Annulé');
  } else if (dashPeriod === 'all') {
    // All events (past + future)
    recent = cachedReleases.filter(r => r.status !== 'Annulé');
  } else {
    // Last N months, past only (cutoff to today)
    const ago = new Date(now.getFullYear(), now.getMonth() - dashPeriod, 1);
    const cutoff = ago.toISOString().slice(0, 10);
    recent = cachedReleases.filter(r => r.dateSortable >= cutoff && r.dateSortable <= today && r.status !== 'Annulé');
  }

  // Apply date range filter to dashboard
  recent = applyDateFilter(recent);

  // Apply songwriter filter to dashboard
  if (activeSw !== 'all') {
    recent = recent.filter(r => {
      if (!r.songwriters) return false;
      const sw = Array.isArray(r.songwriters) ? r.songwriters : [r.songwriters];
      return sw.includes(activeSw);
    });
  }

  const sorties = recent.filter(r => ['Single','EP','Album'].includes(r.type));
  const hasNonFR = (r) => r.country && r.country.split(',').some(c => c && c !== 'FR');
  const isFR = (r) => !hasNonFR(r);
  const isINTL = (r) => hasNonFR(r);
  const sortiesFR = sorties.filter(r => isFR(r));
  const sortiesINTL = sorties.filter(r => isINTL(r));
  const certsSingle = recent.filter(r => r.type === 'Certification' && r.certType === 'Single');
  const certsAlbum = recent.filter(r => r.type === 'Certification' && r.certType === 'Album');
  const synchros = recent.filter(r => r.type === 'Synchro');

  // Count tracks not releases: EP/Album counts per-track, Single as 1
  // When a songwriter filter is active, only count tracks where that SW appears
  const countTracks = (list) => list.reduce((sum, r) => {
    if ((r.type === 'EP' || r.type === 'Album') && r.blzTrackCount && parseInt(r.blzTrackCount) > 0) {
      if (activeSw !== 'all' && r.blzTracks && Array.isArray(r.blzTracks)) {
        // Count only tracks where this songwriter is credited
        const swTracks = r.blzTracks.filter(t => t.songwriters && Array.isArray(t.songwriters) && t.songwriters.includes(activeSw));
        return sum + swTracks.length;
      }
      return sum + parseInt(r.blzTrackCount);
    }
    return sum + 1;
  }, 0);
  const totalTracks = countTracks(sorties);
  const tracksFR = countTracks(sortiesFR);
  const tracksINTL = countTracks(sortiesINTL);

  // Update period label
  const label = document.getElementById('dashPeriodLabel');
  if (label) {
    const swLabel = activeSw !== 'all' ? ` · ${activeSw}` : '';
    const periodText = dashPeriod === 'upcoming' ? 'À venir' : dashPeriod === 'all' ? 'All Time' : `Last ${dashPeriod} Months`;
    label.textContent = periodText + swLabel;
  }

  let h = '';
  h += `<div class="dash-card"><div class="dash-num">${totalTracks}</div><div class="dash-label">Placements</div></div>`;
  h += `<div class="dash-card"><div class="dash-num">${tracksFR}</div><div class="dash-label">🇫🇷 France</div></div>`;
  h += `<div class="dash-card"><div class="dash-num${tracksINTL ? ' green' : ''}">${tracksINTL}</div><div class="dash-label">🌍 <span class="intl-full">International</span><span class="intl-short">Inter</span></div></div>`;
  h += `<div class="dash-card"><div class="dash-num${certsSingle.length ? ' accent' : ''}">${certsSingle.length}</div><div class="dash-label">Certifs Singles</div></div>`;
  h += `<div class="dash-card"><div class="dash-num${certsAlbum.length ? ' orange' : ''}">${certsAlbum.length}</div><div class="dash-label">Certifs Albums</div></div>`;
  h += `<div class="dash-card"><div class="dash-num">${synchros.length}</div><div class="dash-label">Synchros</div></div>`;
  // dépôts Sacem restants sur la période
  const aDeposer = sorties.reduce((n, r) => n + pistesSacem(r).filter(p => !SACEM_FAIT[p.statut]).length, 0);
  h += `<div class="dash-card"><div class="dash-num${aDeposer ? ' red' : ' green'}">${aDeposer}</div><div class="dash-label">Dépôts Sacem à faire</div></div>`;
  dash.innerHTML = h;
}

// Period toggle
document.querySelector('.period-btns').addEventListener('click', (e) => {

// Date range filter
const dateFromEl = document.getElementById('dateFrom');
const dateToEl = document.getElementById('dateTo');
const dateClearEl = document.getElementById('dateClear');

function updateDateFilter() {
  dateFrom = dateFromEl.value || '';
  dateTo = dateToEl.value || '';
  dateClearEl.classList.toggle('visible', !!(dateFrom || dateTo));
  resetPagination();
  buildDashboard();
  render();
}
dateFromEl.addEventListener('change', updateDateFilter);
dateToEl.addEventListener('change', updateDateFilter);
dateClearEl.addEventListener('click', () => {
  dateFromEl.value = '';
  dateToEl.value = '';
  updateDateFilter();
});

function applyTypeFilter(releases) {
  const today = new Date().toISOString().slice(0, 10);
  let result;
  if (activeFilter === 'all') result = releases;
  else if (activeFilter === 'Passé') result = releases.filter(r => r.dateSortable <= today);
  else if (activeFilter === 'À venir') result = releases.filter(r => r.dateSortable > today);
  else if (activeFilter === 'Sorties') result = releases.filter(r => ['Single','EP','Album'].includes(r.type));
  else if (activeFilter === 'Sacem') result = releases.filter(r => pistesSacem(r).some(p => !SACEM_FAIT[p.statut]));
  else if (activeFilter === 'France') result = releases.filter(r => ['Single','EP','Album'].includes(r.type) && (!r.country || !r.country.split(',').some(c => c && c !== 'FR')));
  else if (activeFilter === 'International') result = releases.filter(r => ['Single','EP','Album'].includes(r.type) && r.country && r.country.split(',').some(c => c && c !== 'FR'));
  else result = releases.filter(r => r.type === activeFilter);
  return applyDateFilter(result);
}

function render() {
  let filtered = applyTypeFilter(cachedReleases);
  if (activeSw !== 'all') {
    filtered = filtered.filter(r => {
      if (!r.songwriters) return false;
      const sw = Array.isArray(r.songwriters) ? r.songwriters : [r.songwriters];
      return sw.includes(activeSw);
    });
  }
  const content = document.getElementById('planningContent');
  const stats = document.getElementById('stats');

  totalFiltered = filtered.length;
  const showing = Math.min(displayLimit, totalFiltered);
  stats.textContent = totalFiltered <= displayLimit
    ? `${totalFiltered} event${totalFiltered > 1 ? 's' : ''}`
    : `${showing} / ${totalFiltered} events`;

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-msg">Aucun event pour le moment.<br><a href="release_create.html">Ajouter →</a></div>';
    return;
  }

  // Sort all filtered events by date descending, then slice to displayLimit
  const allSorted = [...filtered].sort((a, b) => (b.dateSortable || '').localeCompare(a.dateSortable || ''));
  const visible = allSorted.slice(0, displayLimit);

  const groups = {};
  const today = new Date().toISOString().slice(0, 10);

  visible.forEach(r => {
    const parts = (r.dateSortable || '').split('-');
    const key = parts[0] + '-' + parts[1];
    if (!groups[key]) groups[key] = [];
    groups[key].push(r);
  });

  const sortedKeys = Object.keys(groups).sort().reverse();

  let html = '';
  sortedKeys.forEach(key => {
    const [year, month] = key.split('-');
    const monthName = MONTHS_FR[parseInt(month) - 1];
    html += `<div class="month-group">`;
    html += `<div class="month-label">${monthName} ${year}</div>`;
    html += `<div class="release-list">`;

    groups[key].forEach(r => {
      const isToday = r.dateSortable === today;
      const isPast = r.dateSortable < today;
      const isAnnule = r.status === 'Annulé';
      const swArr = r.songwriters ? (Array.isArray(r.songwriters) ? r.songwriters : [r.songwriters]) : [];
      const swText = swArr.join(', ');
      const st = r.status || 'Confirmé';
      const stClass = st === 'TBC' ? 'tbc' : st === 'Annulé' ? 'annule' : 'confirme';

      const COUNTRY_FLAGS = {FR:'🇫🇷',US:'🇺🇸',GB:'🇬🇧',DE:'🇩🇪',ES:'🇪🇸',IT:'🇮🇹',BE:'🇧🇪',CH:'🇨🇭',CA:'🇨🇦',JP:'🇯🇵',KR:'🇰🇷',BR:'🇧🇷',AR:'🇦🇷',MX:'🇲🇽',NG:'🇳🇬',CI:'🇨🇮',SN:'🇸🇳',MA:'🇲🇦',DZ:'🇩🇿',CM:'🇨🇲',GN:'🇬🇳',ML:'🇲🇱',CV:'🇨🇻',NL:'🇳🇱',GA:'🇬🇦',BJ:'🇧🇯',CD:'🇨🇩',INTL:'🌍'};
      const COUNTRY_NAMES = {FR:'France',US:'USA',GB:'UK',DE:'Allemagne',ES:'Espagne',IT:'Italie',BE:'Belgique',CH:'Suisse',CA:'Canada',JP:'Japon',KR:'Corée du Sud',BR:'Brésil',AR:'Argentine',MX:'Mexique',NG:'Nigeria',CI:"Côte d'Ivoire",SN:'Sénégal',MA:'Maroc',DZ:'Algérie',CM:'Cameroun',GN:'Guinée',ML:'Mali',CD:'RD Congo',INTL:'International'};
      const countryCodes = r.country ? r.country.split(',').filter(Boolean) : [];
      const flagParts = countryCodes.map(c => {
        const code = c === 'INTL' ? '' : c.toLowerCase();
        return code ? '<img src="https://flagcdn.com/20x15/' + code + '.png" style="vertical-align:middle" />' : '🌍';
      });
      const flagDisplay = flagParts.join(' ');

      html += `<div class="release-item${isToday ? ' today-marker' : ''}${isAnnule ? ' annule' : ''}${r.artwork ? ' has-art' : ''}" data-id="${r.id}" style="${isPast && !isAnnule ? 'opacity:0.5' : ''}">`;
      if (r.artwork) html += `<img class="rel-artwork" src="${r.artwork}" />`;
      html += `<div class="rel-meta">`;
      html += `<span class="rel-date">${r.date}</span>`;
      html += `<span class="rel-type">${r.type}</span>`;
      html += `<span class="rel-status ${stClass}">${st}</span>`;
      const sacemR = sacemResume(r);
      if (sacemR) html += `<span class="rel-sacem ${sacemR.cls}" title="Statut Sacem des titres BLZante">${sacemR.lbl}</span>`;
      if (flagDisplay) html += `<span class="rel-flag">${flagDisplay}</span>`;
      html += `</div>`;
      html += `<div class="rel-info">`;
      // Build feat display
      const featList = r.featurings && Array.isArray(r.featurings) && r.featurings.length ? ' <span style="color:var(--muted);font-size:0.65rem">feat. ' + r.featurings.join(', ') + '</span>' : '';
      html += `<span class="rel-artist">${r.artist}${featList}</span>`;
      if (r.type === 'Certification' && r.track) {
        html += `<span class="rel-title">${r.track}</span>`;
        html += `<span class="rel-blz">${r.certType || ''} — ${r.certLevel || ''}</span>`;
      } else {
        html += `<span class="rel-title">${r.title}</span>`;
      }
      if (r.actuDesc) html += `<span class="rel-desc">${r.actuDesc}</span>`;
      if (r.blzTrackCount) html += `<span class="rel-blz">${r.blzTrackCount} titre${r.blzTrackCount > 1 ? 's' : ''} BLZante</span>`;
      // Titres BLZante : featuring et pastille de statut Sacem
      const pistes = pistesSacem(r);
      if (pistes.length) {
        html += `<span class="rel-tracks">` + pistes.map(p =>
          `<span class="pt" title="Sacem : ${SACEM_LIB[p.statut]}"><i class="dot ${p.statut}"></i>` +
          `<span class="tt">${p.titre}</span>${p.feat ? ' feat. ' + p.feat : ''}</span>`).join('') + `</span>`;
      } else if (r.blzTrackNames) {
        html += `<span class="rel-sw">${r.blzTrackNames.replace(/\n/g, ' · ')}</span>`;
      }
      if (r.epTrackNames && !r.blzTrackNames && !pistes.length) html += `<span class="rel-sw">${r.epTrackNames.replace(/\n/g, ' · ')}</span>`;
      if (swText) html += `<span class="rel-sw">${swText}</span>`;
      html += `</div>`;
      html += `<a class="rel-edit" href="release_create.html?edit=${r.id}" title="Modifier">edit</a>`;
      html += `</div>`;
    });

    html += `</div></div>`;
  });

  if (totalFiltered > displayLimit) {
    html += `<div class="load-more-indicator" id="loadMoreIndicator">` +
      `<span class="load-more-text">Scroll pour charger plus · ${totalFiltered - displayLimit} restants</span>` +
      `</div>`;
  }

  content.innerHTML = html;
}

function resetPagination() {
  displayLimit = PAGE_INITIAL;
}

// Infinite scroll
window.addEventListener('scroll', () => {
  if (displayLimit >= totalFiltered) return;
  const scrollBottom = window.innerHeight + window.scrollY;
  const docHeight = document.documentElement.scrollHeight;
  if (scrollBottom >= docHeight - 300) {
    displayLimit += PAGE_INCREMENT;
    render();
  }
});

document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  btn.textContent = '⏳ Génération...';
  btn.disabled = true;

  try {
    // Get filtered data (same as what's displayed)
    let filtered = applyTypeFilter(cachedReleases);
    if (activeSw !== 'all') {
      filtered = filtered.filter(r => {
        if (!r.songwriters) return false;
        const sw = Array.isArray(r.songwriters) ? r.songwriters : [r.songwriters];
        return sw.includes(activeSw);
      });
    }
    if (!filtered.length) { alert('Aucun event à exporter'); btn.textContent = '⚡ Export PDF'; btn.disabled = false; return; }

    // Group by month
    const groups = {};
    filtered.forEach(r => {
      const parts = (r.dateSortable || '').split('-');
      const key = parts[0] + '-' + parts[1];
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    const sortedKeys = Object.keys(groups).sort().reverse();

    // Build PDF HTML
    const render = document.getElementById('pdfRender');
    render.style.width = '794px';
    render.style.minHeight = '1123px';
    render.style.height = 'auto';

    let h = '';
    // Background grid
    h += '<div style="position:absolute;inset:0;background-color:#0a0a0a;background-image:linear-gradient(rgba(38,38,38,0.4) 1px,transparent 1px),linear-gradient(90deg,rgba(38,38,38,0.4) 1px,transparent 1px);background-size:60px 60px;z-index:0"></div>';
    h += '<div style="position:relative;z-index:1;padding:36px 40px 30px;font-family:Syne,Arial,sans-serif;color:#e8e8e8">';

    // Header
    h += '<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">';
    h += `<img src="${NAV_LOGO}" style="height:34px;width:auto" crossorigin="anonymous" />`;
    const pdfTitle = activeSw !== 'all' ? `Sorties ${activeSw}` : 'Planning BLZante';
    h += `<div style="font-size:1.4rem;font-weight:800;letter-spacing:0.04em;color:#fff">${pdfTitle}</div>`;
    h += '</div>';
    // Add artist photo + socials if filtered by songwriter
    if (activeSw !== 'all' && window._rosterForPlanning) {
      const artistData = window._rosterForPlanning[activeSw];
      if (artistData) {
        h += '<div style="position:absolute;top:30px;right:40px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:2">';
        if (artistData.photoSrc) {
          h += `<img src="${artistData.photoSrc}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.15)" crossorigin="anonymous" />`;
        }

        h += '</div>';
      }
    }

    // Period info
    let periodInfo = '';
    if (dateFrom || dateTo) {
      periodInfo = (dateFrom ? dateFrom.split('-').reverse().join('/') : '...') + ' → ' + (dateTo ? dateTo.split('-').reverse().join('/') : '...');
    } else if (dashPeriod === 6) periodInfo = '6 derniers mois';
    else if (dashPeriod === 12) periodInfo = '12 derniers mois';
    else if (dashPeriod === 'all') periodInfo = 'All Time';
    else if (dashPeriod === 'upcoming') periodInfo = 'À venir';

    // Subtitle with filter info
    let subtitle = '';
    if (activeFilter !== 'all') subtitle += activeFilter;
    if (periodInfo) subtitle += (subtitle ? ' · ' : '') + periodInfo;
    if (!subtitle) subtitle = 'Toutes les sorties';
    const today = new Date();
    const dateStr = today.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    h += `<div style="font-family:Syne Mono,monospace;font-size:0.58rem;color:#666;letter-spacing:0.1em;margin-bottom:4px">${subtitle} — ${dateStr}</div>`;
    h += '<div style="height:1px;background:linear-gradient(90deg,rgba(232,197,71,0.4),rgba(255,255,255,0.08) 50%,transparent);margin-bottom:12px"></div>';

    // Dashboard recap in PDF (when filtered by songwriter or always)
    const pdfSorties = filtered.filter(r => ['Single','EP','Album'].includes(r.type) && r.status !== 'Annulé');
    const pdfCountTracks = (list) => list.reduce((sum, r) => {
      if ((r.type === 'EP' || r.type === 'Album') && r.blzTrackCount && parseInt(r.blzTrackCount) > 0) {
        if (activeSw !== 'all' && r.blzTracks && Array.isArray(r.blzTracks)) {
          const swTracks = r.blzTracks.filter(t => t.songwriters && Array.isArray(t.songwriters) && t.songwriters.includes(activeSw));
          return sum + swTracks.length;
        }
        return sum + parseInt(r.blzTrackCount);
      }
      return sum + 1;
    }, 0);
    const pdfHasNonFR = (r) => r.country && r.country.split(',').some(c => c && c !== 'FR');
    const pdfSortiesFR = pdfSorties.filter(r => !pdfHasNonFR(r));
    const pdfSortiesINTL = pdfSorties.filter(r => pdfHasNonFR(r));
    const pdfCertsSingle = filtered.filter(r => r.type === 'Certification' && r.certType === 'Single' && r.status !== 'Annulé');
    const pdfCertsAlbum = filtered.filter(r => r.type === 'Certification' && r.certType === 'Album' && r.status !== 'Annulé');
    const pdfSynchros = filtered.filter(r => r.type === 'Synchro' && r.status !== 'Annulé');

    const totalTr = pdfCountTracks(pdfSorties);
    const trFR = pdfCountTracks(pdfSortiesFR);
    const trINTL = pdfCountTracks(pdfSortiesINTL);

    if (totalTr || pdfCertsSingle.length || pdfCertsAlbum.length || pdfSynchros.length) {
      h += '<div style="display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap">';
      if (totalTr) h += `<div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:1.3rem;font-weight:800;color:#fff">${totalTr}</span><span style="font-family:Syne Mono,monospace;font-size:0.48rem;color:#888;letter-spacing:0.06em">PLACEMENTS</span></div>`;
      if (trFR) h += `<div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:1.3rem;font-weight:800;color:#fff">${trFR}</span><span style="font-family:Syne Mono,monospace;font-size:0.48rem;color:#888;letter-spacing:0.06em">🇫🇷 FRANCE</span></div>`;
      if (trINTL) h += `<div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:1.3rem;font-weight:800;color:#4ade80">${trINTL}</span><span style="font-family:Syne Mono,monospace;font-size:0.48rem;color:#888;letter-spacing:0.06em">🌍 INTERNATIONAL</span></div>`;
      if (pdfCertsSingle.length) h += `<div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:1.3rem;font-weight:800;color:#e8c547">${pdfCertsSingle.length}</span><span style="font-family:Syne Mono,monospace;font-size:0.48rem;color:#888;letter-spacing:0.06em">CERTIFS SINGLES</span></div>`;
      if (pdfCertsAlbum.length) h += `<div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:1.3rem;font-weight:800;color:#f59e0b">${pdfCertsAlbum.length}</span><span style="font-family:Syne Mono,monospace;font-size:0.48rem;color:#888;letter-spacing:0.06em">CERTIFS ALBUMS</span></div>`;
      if (pdfSynchros.length) h += `<div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:1.3rem;font-weight:800;color:#fff">${pdfSynchros.length}</span><span style="font-family:Syne Mono,monospace;font-size:0.48rem;color:#888;letter-spacing:0.06em">SYNCHROS</span></div>`;
      h += '</div>';
      h += '<div style="height:1px;background:rgba(255,255,255,0.06);margin-bottom:12px"></div>';
    }

    const PDF_FLAGS = {FR:'🇫🇷',US:'🇺🇸',GB:'🇬🇧',DE:'🇩🇪',ES:'🇪🇸',IT:'🇮🇹',BE:'🇧🇪',CH:'🇨🇭',CA:'🇨🇦',JP:'🇯🇵',KR:'🇰🇷',BR:'🇧🇷',AR:'🇦🇷',MX:'🇲🇽',NG:'🇳🇬',CI:'🇨🇮',SN:'🇸🇳',MA:'🇲🇦',DZ:'🇩🇿',CM:'🇨🇲',GN:'🇬🇳',ML:'🇲🇱',CV:'🇨🇻',NL:'🇳🇱',GA:'🇬🇦',BJ:'🇧🇯',CD:'🇨🇩',INTL:'🌍'};
    const PDF_NAMES = {FR:'France',US:'USA',GB:'UK',DE:'Allemagne',ES:'Espagne',IT:'Italie',BE:'Belgique',CH:'Suisse',CA:'Canada',JP:'Japon',KR:'Corée du Sud',BR:'Brésil',AR:'Argentine',MX:'Mexique',NG:'Nigeria',CI:"Côte d'Ivoire",SN:'Sénégal',MA:'Maroc',DZ:'Algérie',CM:'Cameroun',GN:'Guinée',ML:'Mali',CD:'RD Congo',INTL:'International'};

    // Months
    sortedKeys.forEach(key => {
      const [year, month] = key.split('-');
      const monthName = MONTHS_FR[parseInt(month) - 1];
      h += `<div style="font-size:0.72rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#888;margin-bottom:8px;margin-top:16px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.08)">${monthName} ${year}</div>`;

      groups[key].reverse().forEach(r => {
        const st = r.status || 'Confirmé';
        const stColor = st === 'TBC' ? '#f1c40f' : st === 'Annulé' ? '#ff6b6b' : '#4ade80';
        const stBorder = st === 'TBC' ? '#4a3e10' : st === 'Annulé' ? '#4a1a1a' : '#1a3a1a';
        const isAnnule = st === 'Annulé';
        const swArr = r.songwriters ? (Array.isArray(r.songwriters) ? r.songwriters : [r.songwriters]) : [];
        const pdfCodes = r.country ? r.country.split(',').filter(Boolean) : [];
        const pdfFlag = pdfCodes.map(c => c === 'INTL' ? '🌍' : '<img src="https://flagcdn.com/16x12/' + c.toLowerCase() + '.png" crossorigin="anonymous" style="vertical-align:middle" />').join(' ');

        h += `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);margin-bottom:3px;${isAnnule ? 'opacity:0.3;text-decoration:line-through;' : ''}">`;

        // Artwork
        if (r.artwork) h += `<img src="${r.artwork}" style="width:38px;height:38px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);flex-shrink:0" crossorigin="anonymous" />`;

        // Date
        h += `<div style="font-family:Syne Mono,monospace;font-size:0.65rem;color:#bbb;min-width:70px;flex-shrink:0">${r.date}</div>`;

        // Type badge
        h += `<div style="font-family:Syne Mono,monospace;font-size:0.52rem;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border:1px solid rgba(255,255,255,0.12);color:#999;min-width:48px;text-align:center;flex-shrink:0">${r.type}</div>`;

        // Status badge
        h += `<div style="font-family:Syne Mono,monospace;font-size:0.52rem;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border:1px solid ${stBorder};color:${stColor};min-width:48px;text-align:center;flex-shrink:0">${st}</div>`;

        // Statut Sacem
        const pdfSacem = sacemResume(r);
        if (pdfSacem) {
          const cS = pdfSacem.cls === 'depose' ? '#4ade80' : pdfSacem.cls === 'en_cours' ? '#f1c40f' : pdfSacem.cls === 'a_lancer' ? '#ff9f6b' : '#777';
          h += `<div style="font-family:Syne Mono,monospace;font-size:0.52rem;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border:1px solid rgba(255,255,255,0.12);color:${cS};white-space:nowrap;flex-shrink:0">${pdfSacem.lbl}</div>`;
        }

        // Flag
        if (pdfFlag) h += `<div style="font-size:0.58rem;color:#999;flex-shrink:0">${pdfFlag}</div>`;

        // Info
        h += '<div style="flex:1;min-width:0">';
        const pdfFeat = r.featurings && Array.isArray(r.featurings) && r.featurings.length ? ' <span style="color:#777;font-size:0.6rem">feat. ' + r.featurings.join(', ') + '</span>' : '';
        h += `<div style="font-weight:700;color:#fff;font-size:0.72rem">${r.artist}${pdfFeat}</div>`;
        h += `<div style="color:#aaa;font-size:0.62rem;font-family:Syne Mono,monospace">${r.title}</div>`;
        if (r.actuDesc) h += `<div style="color:#888;font-size:0.54rem;font-style:italic;margin-top:1px">${r.actuDesc}</div>`;
        if (r.blzTrackCount) h += `<div style="color:#e8c547;font-size:0.54rem;font-family:Syne Mono,monospace;margin-top:1px">${r.blzTrackCount} titre${r.blzTrackCount > 1 ? 's' : ''} BLZante</div>`;
        // Titres BLZante, avec featuring et statut de dépôt
        const pdfPistes = pistesSacem(r);
        if (pdfPistes.length) {
          const cD = { depose: '#4ade80', en_cours: '#f1c40f', a_lancer: '#ff9f6b', a_definir: '#555', non_editeur: '#555' };
          h += `<div style="color:#555;font-size:0.54rem;font-family:Syne Mono,monospace;margin-top:1px">` +
            pdfPistes.map(p => `<span style="color:${cD[p.statut]}">•</span> <span style="color:#aaa">${p.titre}</span>` +
              (p.feat ? ' feat. ' + p.feat : '')).join(' &nbsp; ') + `</div>`;
        } else if (r.blzTrackNames) {
          h += `<div style="color:#555;font-size:0.54rem;font-family:Syne Mono,monospace;margin-top:1px">${r.blzTrackNames.replace(/\n/g, ' · ')}</div>`;
        } else if (r.epTrackNames) {
          h += `<div style="color:#555;font-size:0.54rem;font-family:Syne Mono,monospace;margin-top:1px">${r.epTrackNames.replace(/\n/g, ' · ')}</div>`;
        }
        if (swArr.length) h += `<div style="color:#555;font-size:0.54rem;font-family:Syne Mono,monospace;margin-top:1px">${swArr.join(', ')}</div>`;
        h += '</div>';

        h += '</div>';
      });
    });

    // Footer
    h += `<div style="display:flex;justify-content:center;margin-top:24px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)">`;
    h += `<img src="${NAV_LOGO}" style="height:24px;opacity:0.4" crossorigin="anonymous" />`;
    h += '</div>';

    h += '</div>'; // close content

    render.innerHTML = h;

    // Wait for images
    const allImgs = render.querySelectorAll('img');
    await Promise.all(Array.from(allImgs).map(img => {
      if (img.complete) return Promise.resolve();
      return new Promise(res => { img.onload = res; img.onerror = res; });
    }));
    await new Promise(r => setTimeout(r, 300));

    // Measure actual height for multi-page support
    const totalH = render.scrollHeight;
    const pageH = 1123;
    const pages = Math.ceil(totalH / pageH);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    // Collect link positions before rendering
    const renderRect2 = render.getBoundingClientRect();
    const planLinkData = [];
    render.querySelectorAll('a[href]').forEach(link => {
      const rect = link.getBoundingClientRect();
      planLinkData.push({
        url: link.href,
        x: rect.left - renderRect2.left,
        y: rect.top - renderRect2.top,
        w: rect.width,
        h: rect.height
      });
    });

    for (let i = 0; i < pages; i++) {
      if (i > 0) pdf.addPage();
      const canvas = await html2canvas(render, {
        width: 794, height: pageH, scale: 2,
        backgroundColor: '#0a0a0a', useCORS: true, allowTaint: true,
        y: i * pageH, scrollY: -i * pageH,
        windowHeight: pageH,
      });
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);

      // Add link annotations for this page
      const scaleX = 210 / 794;
      const scaleY = 297 / pageH;
      const pTop = i * pageH;
      const pBot = (i + 1) * pageH;
      planLinkData.forEach(ld => {
        if (ld.w <= 0 || ld.h <= 0) return;
        if (ld.y + ld.h < pTop || ld.y > pBot) return;
        const x = ld.x * scaleX;
        const y = (ld.y - pTop) * scaleY;
        const w = ld.w * scaleX;
        const ht = ld.h * scaleY;
        if (y >= 0 && y < 297) {
          pdf.link(x, y, w, ht, { url: ld.url });
        }
      });
    }

    render.innerHTML = '';
    render.style.height = '0';

    const now = new Date();
    const yyyymmdd = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${yyyymmdd}_Planning_BLZante.pdf`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(err) {
    console.error(err);
    alert('Erreur export PDF');
  } finally {
    btn.textContent = '⚡ Export PDF';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
